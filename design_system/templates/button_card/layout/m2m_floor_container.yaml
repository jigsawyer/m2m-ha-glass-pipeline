  m2m_floor_container:
    # ADR-0068 nextgen-scoped floor section (V9 freedom namespace).
    # Fluid glass section: no masonry literals, no fixed track width —
    # geometry is owned by the m2m_* Jinja shell's CSS grid. Legacy
    # floor_container is untouched (svitlo keeps it byte-for-byte).
    show_icon: false
    show_name: true
    show_state: false
    show_ripple: false
    tap_action:
      action: none
    hold_action:
      action: none
    extra_styles: |
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        display: block;
        box-sizing: border-box;
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible !important;
        --ha-card-border-radius: 0 !important;
      }
      ha-card {
        position: relative;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
        overflow: visible !important;
        display: block !important;
        padding: var(--lg_space_pad_y) var(--lg_space_pad_x) !important;
        border-radius: var(--lg_radius_container);
        border: var(--lg_stroke_glass) solid var(--lg_color_glass_rim);
        box-shadow: var(--lg_shadow_container);
      }
      {{ lg_glass_stack_extra_styles('--lg_radius_container') }}
      {{ lg_name_label_extra_styles('--lg_font_label_size', '--lg_font_title_weight', '--lg_font_label_tracking', '--lg_line_height_label') }}
      #name {
        color: var(--lg_color_text);
        text-align: left;
        white-space: nowrap;
        overflow: visible;
        opacity: 0.9;
        filter: drop-shadow(0 0 0.4rem var(--lg_color_switch_on_frost));
      }
      #container {
        display: grid !important;
        grid-template-areas:
          "floor_title"
          "floor_panel" !important;
        grid-template-columns: minmax(0, 1fr) !important;
        grid-template-rows: min-content minmax(0, 1fr) !important;
        gap: var(--lg_space_gap_sm);
        align-items: start !important;
      }
      #name { grid-area: floor_title; }
      #content {
        grid-area: floor_panel;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
        display: block !important;
      }
      #content > * {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
        display: block !important;
      }
    custom_fields:
      glass_layers: >
        {{ lg_glass_stack_html() }}
