  climate_timer_radial_confirm:
    show_icon: false
    show_name: false
    show_state: false
    show_label: true
    show_ripple: false
    variables:
      save_duration_script_id: ""
      hours_entity_id: ""
      minutes_entity_id: ""
    label: " "
    tap_action:
      action: javascript
      javascript: |
        [[[
          const composedParent = (el) => {
            if (!el) return null;
            if (el.parentElement) return el.parentElement;
            const rn = el.getRootNode && el.getRootNode();
            return (rn && rn.host) || null;
          };
          let radial = null;
          let wheelHost = null;
          let scope = composedParent(this);
          for (let i = 0; i < 16 && scope; i++) {
            if (scope.classList && scope.classList.contains('lg-timer-radial-host')) radial = scope;
            if (scope.classList && scope.classList.contains('lg-wheel-host')) {
              wheelHost = scope;
              break;
            }
            scope = composedParent(scope);
          }
          if (!radial) {
            scope = composedParent(this);
            for (let i = 0; i < 16 && scope; i++) {
              if (scope.classList && scope.classList.contains('lg-timer-radial-host')) {
                radial = scope;
                break;
              }
              scope = composedParent(scope);
            }
          }
          const maxMin = (radial && radial.__lgTimerMaxMin) || 720;
          const minMin = (radial && radial.__lgTimerMinMin) || 5;
          const stepMin = (radial && radial.__lgTimerStepMin) || 5;
          /* D1: quantize to step, clamp up to the 5-minute floor — a commit
             always yields a valid duration (never a no-op below minMin). */
          let mins = (radial && typeof radial.__lgTimerPending === 'number')
            ? radial.__lgTimerPending : minMin;
          mins = Math.round(mins / stepMin) * stepMin;
          mins = Math.max(minMin, Math.min(maxMin, mins));
          const hh = Math.floor(mins / 60);
          const mm = mins % 60;
          const duration = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:00`;
          const scriptId = (variables && variables.save_duration_script_id) || '';
          const hoursId = (variables && variables.hours_entity_id) || '';
          const minutesId = (variables && variables.minutes_entity_id) || '';
          try {
            if (hoursId) hass.callService('input_number', 'set_value', { entity_id: hoursId, value: hh });
            if (minutesId) hass.callService('input_number', 'set_value', { entity_id: minutesId, value: mm });
            if (scriptId) {
              const svc = String(scriptId).replace(/^script\./, '');
              hass.callService('script', svc, { duration });
            }
          } catch (e) {}
          if (radial) {
            radial.__lgTimerPending = undefined;
            radial.__lgTimerDragging = false;
            radial.classList.remove('lg-timer-dragging');
          }
          if (wheelHost) {
            {{ lg_climate_timer_radial_sticky_set_js('wheelHost', 'false') }}
            wheelHost.classList.remove('lg-timer-radial-open', 'lg-timer-radial-arming');
            wheelHost.__lgTimerOpenedAt = 0;
            if (wheelHost.__lgTimerArmTimer) {
              try { clearTimeout(wheelHost.__lgTimerArmTimer); } catch (e) {}
              wheelHost.__lgTimerArmTimer = 0;
            }
          }
          {{ lg_climate_temp_focus_set_js('false') }}
          {{ lg_climate_blur_kick_js() }}
        ]]]
    extra_styles: |
      [[[
        return `
      :host {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      ha-card, #card {
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
      #card {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        /* Same hub chrome as DEFAULT setpoint display (commit = hub press). */
        border: none;
        box-shadow: var(--lg_shadow_climate_hub_idle);
        cursor: pointer;
        transition: var(--lg_transition_climate_node_state), var(--lg_transition_climate_node_press);
      }
      #card:active {
        transform: var(--lg_transform_climate_press_scale);
        opacity: var(--lg_opacity_climate_press);
        filter: var(--lg_filter_climate_press);
        box-shadow: var(--lg_shadow_climate_hub_press);
      }
      #container {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: var(--lg_space_climate_setpoint_stack_gap);
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 0 var(--lg_space_gap_xs);
        overflow: hidden;
      }
      #liquid_clip {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background:
          var(--lg_gradient_climate_setpoint_sphere_highlight),
          var(--lg_color_climate_arc_glass_fill);
        backdrop-filter: blur(var(--lg_blur_climate_timer_radial_glass)) saturate(var(--lg_saturate_glass));
        -webkit-backdrop-filter: blur(var(--lg_blur_climate_timer_radial_glass)) saturate(var(--lg_saturate_glass));
        pointer-events: none;
        z-index: 0;
      }
      #label {
        position: relative;
        z-index: 1;
        order: 1;
        color: var(--lg_color_text) !important;
        font-family: var(--lg_font_label_family);
        font-size: var(--lg_font_climate_timer_radial_size);
        font-weight: var(--lg_font_title_weight);
        letter-spacing: var(--lg_font_body_tracking);
        line-height: var(--lg_line_height_label);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }
      #label::after {
        /* D1: floor is 5 minutes, not 0 — the dial can never seed below it. */
        content: var(--lg_timer_label, "5 хв");
      }
      /* ADR 0032 (item 7) — secondary line under the duration: absolute
         off-at time, live-updated by the radial panel's applyProgress /
         seed pass via --lg_timer_off_at (spec §4.2 Configuration Typography). */
      #off_at {
        position: relative;
        z-index: 1;
        order: 2;
        color: var(--lg_color_text) !important;
        opacity: 0.82;
        font-family: var(--lg_font_label_family);
        font-size: var(--lg_font_climate_timer_off_at_size);
        font-weight: var(--lg_font_body_weight, 400);
        letter-spacing: var(--lg_font_body_tracking);
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }
      #off_at::after {
        content: var(--lg_timer_off_at, '');
      }
      #icon, #name, #state { display: none !important; }
      @media (max-width: 48rem) {
        #label { font-size: var(--lg_font_climate_timer_radial_size_phone); }
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}
      off_at: ""

  # Dual-state Klimat timer control:
  # idle → round timer icon (opens in-place radial, ADR 0025);
  # active|paused → liquid countdown bar + pause/play + edit (cancel via wheel segment);
  # clock-armed → remaining HH:MM:SS + moving progress + pause (pause-clock script).
  # HA timer docs: idle|active|paused; pause/start/cancel actions.
  # Live countdown: finishes_at client tick (remaining not ticked by core).
