  # ADR 0032 (A1) — timer frost is permanently inert (TEMP mirror / ADR 0030).
  # Mounted only so climate_global_wheel's custom_fields set stays stable;
  # abort is Cancel (X) on climate_room_off_button, never a frost tap.
  # Wheel CSS (macros/05_climate_timer_fsm.yaml) also pins this host 0×0.
  climate_timer_frost:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    tap_action:
      action: none
    extra_styles: |
      [[[
        return `
      :host {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        background: transparent !important;
        box-shadow: none !important;
        transition: none !important;
        z-index: 40 !important;
      }
      ha-card, #card, #container {
        background: transparent !important;
        box-shadow: none !important;
        width: 0 !important;
        height: 0 !important;
        pointer-events: none !important;
      }
      #icon, #name, #label, #state { display: none !important; }
        `;
      ]]]

