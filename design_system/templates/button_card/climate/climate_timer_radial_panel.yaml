  climate_timer_radial_panel:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    variables:
      save_duration_script_id: ""
      hours_entity_id: ""
      minutes_entity_id: ""
      seed_minutes: 0
    tap_action:
      action: none
    extra_styles: |
      [[[
        const maxMin = (() => {
          let m = 720;
          if (this) {
            const raw = parseFloat(getComputedStyle(this).getPropertyValue('--lg_size_climate_timer_max_minutes'));
            if (Number.isFinite(raw) && raw > 0) m = raw;
          }
          return m;
        })();
        /* D1 — min 5 / step 5, read from tokens (defaults mirror the JSON
           fallback in case the CSS var isn't resolvable yet). */
        const minMin = (() => {
          let m = 5;
          if (this) {
            const raw = parseFloat(getComputedStyle(this).getPropertyValue('--lg_size_climate_timer_min_minutes'));
            if (Number.isFinite(raw) && raw > 0) m = raw;
          }
          return m;
        })();
        const stepMin = (() => {
          let s = 15;
          if (this) {
            const raw = parseFloat(getComputedStyle(this).getPropertyValue('--lg_size_climate_timer_step_minutes'));
            if (Number.isFinite(raw) && raw > 0) s = raw;
          }
          return s;
        })();
        const quantize = (mins) => {
          let m = Math.round(mins / stepMin) * stepMin;
          return Math.max(minMin, Math.min(maxMin, m));
        };
        const pMin = maxMin > 0 ? minMin / maxMin : 0;
        const fmtLabel = (mins) => {
          const n = Math.max(0, Math.round(mins));
          if (n < 60) return `"${n} хв"`;
          const h = Math.floor(n / 60);
          const mm = n % 60;
          if (mm === 0) return `"${h} год"`;
          return `"${h} год ${mm} хв"`;
        };
        const fmtOffAt = (mins) => {
          const d = new Date(Date.now() + Math.max(0, mins) * 60000);
          const hh = String(d.getHours()).padStart(2, '0');
          const mm = String(d.getMinutes()).padStart(2, '0');
          return `"Вимкнення о ${hh}:${mm}"`;
        };
        const R = 41, CX = 50, CY = 50, TICK_N = 60;
        const r4 = (n) => Math.round(n * 10000) / 10000;
        const posForProgress = (p, radius) => {
          const rad = Number.isFinite(radius) ? radius : R;
          const theta = p * Math.PI * 2;
          return { x: r4(CX + rad * Math.sin(theta)), y: r4(CY - rad * Math.cos(theta)), theta };
        };
        const readTickGeo = (host) => {
          const cs = host ? getComputedStyle(host) : null;
          const num = (prop, fb) => {
            const v = cs ? parseFloat(cs.getPropertyValue(prop)) : NaN;
            return Number.isFinite(v) && v > 0 ? v : fb;
          };
          const phone = typeof window !== 'undefined' && window.matchMedia
            && window.matchMedia('(max-width: 48rem)').matches;
          return {
            outerR: num('--lg_size_climate_timer_radial_track_r', R),
            len: num(phone ? '--lg_size_climate_timer_tick_len_phone' : '--lg_size_climate_timer_tick_len', phone ? 2.25 : 2.0),
            lenQ: num(phone ? '--lg_size_climate_timer_tick_len_quarter_phone' : '--lg_size_climate_timer_tick_len_quarter', phone ? 2.85 : 2.55),
            thick: num(phone ? '--lg_size_climate_timer_tick_thick_phone' : '--lg_size_climate_timer_tick_thick', phone ? 0.95 : 0.85),
            thickQ: num(phone ? '--lg_size_climate_timer_tick_thick_quarter_phone' : '--lg_size_climate_timer_tick_thick_quarter', phone ? 1.35 : 1.2),
            opActive: num('--lg_opacity_climate_timer_tick_active', 0.87),
            opInactive: num('--lg_opacity_climate_timer_tick_inactive', 0.18),
            cursorLen: num('--lg_size_climate_timer_cursor_len', 5.5),
            cursorThick: num('--lg_size_climate_timer_cursor_thick', 1.15),
          };
        };
        const ensureTicks = (g, host) => {
          if (!g) return;
          const geo = readTickGeo(host);
          const geoKey = `${geo.outerR}|${geo.len}|${geo.thick}|${geo.lenQ}|${geo.thickQ}`;
          if (g.childElementCount === TICK_N && g.getAttribute('data-geo') === geoKey) return;
          while (g.firstChild) g.removeChild(g.firstChild);
          g.setAttribute('data-geo', geoKey);
          const ns = 'http://www.w3.org/2000/svg';
          for (let i = 0; i < TICK_N; i += 1) {
            const quarter = (i % 15) === 0;
            const len = quarter ? geo.lenQ : geo.len;
            const thick = quarter ? geo.thickQ : geo.thick;
            const theta = (i / TICK_N) * Math.PI * 2;
            const cos = Math.cos(theta);
            const sin = Math.sin(theta);
            const rOut = geo.outerR;
            const rIn = geo.outerR - len;
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('class', quarter ? 'lg-timer-tick lg-timer-tick--quarter' : 'lg-timer-tick');
            line.setAttribute('data-i', String(i));
            line.setAttribute('x1', String(r4(CX + rIn * sin)));
            line.setAttribute('y1', String(r4(CY - rIn * cos)));
            line.setAttribute('x2', String(r4(CX + rOut * sin)));
            line.setAttribute('y2', String(r4(CY - rOut * cos)));
            line.setAttribute('stroke-width', String(thick));
            line.style.opacity = String(geo.opInactive);
            g.appendChild(line);
          }
        };
        const applyCursor = (host, t) => {
          try {
            const root = host && host.shadowRoot;
            const cur = root && root.querySelector('#timer_ring .lg-timer-cursor');
            if (!cur) return;
            const geo = readTickGeo(host);
            const tt = Math.max(0, Math.min(1, Number(t) || 0));
            const theta = tt * Math.PI * 2;
            const cos = Math.cos(theta);
            const sin = Math.sin(theta);
            const rOut = geo.outerR + 0.35;
            const rIn = geo.outerR - geo.cursorLen;
            cur.setAttribute('x1', String(r4(CX + rIn * sin)));
            cur.setAttribute('y1', String(r4(CY - rIn * cos)));
            cur.setAttribute('x2', String(r4(CX + rOut * sin)));
            cur.setAttribute('y2', String(r4(CY - rOut * cos)));
            cur.setAttribute('stroke-width', String(geo.cursorThick));
          } catch (e) {}
        };
        const applyTickProgress = (host, t) => {
          try {
            const root = host && host.shadowRoot;
            const g = root && root.querySelector('#timer_ring .lg-timer-ticks');
            if (!g) return;
            ensureTicks(g, host);
            const geo = readTickGeo(host);
            const frac = Math.max(0, Math.min(1, Number(t) || 0)) * TICK_N;
            const lines = g.querySelectorAll('.lg-timer-tick');
            for (let i = 0; i < lines.length; i += 1) {
              let op = geo.opInactive;
              if ((i + 1) <= frac) op = geo.opActive;
              else if (i < frac) {
                const u = frac - i;
                op = geo.opInactive + (geo.opActive - geo.opInactive) * u;
              }
              lines[i].style.opacity = String(op);
            }
            applyCursor(host, t);
          } catch (e) {}
        };
        const seedFromVars = () => {
          const hoursId = (variables && variables.hours_entity_id) || '';
          const minutesId = (variables && variables.minutes_entity_id) || '';
          let mins = Number(variables && variables.seed_minutes) || 0;
          if (hoursId && states[hoursId]) mins = (parseInt(states[hoursId].state, 10) || 0) * 60;
          if (minutesId && states[minutesId]) mins += (parseInt(states[minutesId].state, 10) || 0);
          if (!(mins > 0) && this && typeof this.__lgTimerSeedMinutes === 'number') {
            mins = this.__lgTimerSeedMinutes;
          }
          /* D1: clamp to [minMin, maxMin], quantize to step — the radial
             never seeds below the 5-minute floor. */
          return quantize(mins > 0 ? mins : minMin);
        };
        if (this) {
          this.classList.add('lg-timer-radial-host');
          this.__lgTimerMaxMin = maxMin;
          this.__lgTimerMinMin = minMin;
          this.__lgTimerStepMin = stepMin;
          this.__lgApplyTimerTicks = applyTickProgress;
        }
        const pendingNow = (this && typeof this.__lgTimerPending === 'number' && Number.isFinite(this.__lgTimerPending))
          ? this.__lgTimerPending : null;
        const seedMins = seedFromVars();
        const displayMins = pendingNow !== null ? pendingNow : seedMins;
        const timerT = maxMin > 0 ? Math.max(pMin, Math.min(1, displayMins / maxMin)) : 0;
        const knobPos = posForProgress(timerT);
        const labelCss = fmtLabel(displayMins);
        const offAtCss = fmtOffAt(displayMins);
        const dragging = !!(this && this.__lgTimerDragging);
        if (this && this.updateComplete) {
          const card = this;
          const setVar = (n, v) => {
            const cur = card.style.getPropertyValue(n);
            if (v === null || v === undefined || v === '') { if (cur) card.style.removeProperty(n); return; }
            if (cur !== v) card.style.setProperty(n, v);
          };
          const applyProgress = (raw, fromDrag) => {
            let p = Math.max(0, Math.min(1, raw));
            /* D1: progress domain is [pMin..1] — below the 5-minute floor
               does not exist on this dial anymore (supersedes ADR 0025's
               0-start domain). */
            p = Math.max(pMin, p);
            if (fromDrag && typeof card.__lgTimerLastProgress === 'number') {
              const prev = card.__lgTimerLastProgress;
              if (prev > 0.75 && p < 0.25) p = 1;
              else if (prev < 0.25 && p > 0.75) p = pMin;
            }
            /* Quantize to the step, then re-derive progress from the
               quantized minutes so the knob snaps to the exact mark. */
            const mins = quantize(p * (card.__lgTimerMaxMin || maxMin));
            const qMaxMin = card.__lgTimerMaxMin || maxMin;
            const qP = qMaxMin > 0 ? Math.max(pMin, Math.min(1, mins / qMaxMin)) : pMin;
            card.__lgTimerLastProgress = qP;
            const prevMins = typeof card.__lgTimerPending === 'number' ? card.__lgTimerPending : null;
            card.__lgTimerPending = mins;
            const pos = posForProgress(qP);
            setVar('--lg_timer_t', String(qP));
            setVar('--lg_timer_knob_x', `${pos.x}%`);
            setVar('--lg_timer_knob_y', `${pos.y}%`);
            setVar('--lg_timer_label', fmtLabel(mins));
            setVar('--lg_timer_off_at', fmtOffAt(mins));
            applyTickProgress(card, qP);
            try {
              const conf = card.shadowRoot && card.shadowRoot.querySelector('#timer_confirm');
              const host = conf && (conf.shadowRoot ? conf : conf);
              const labelEl = host && host.shadowRoot && host.shadowRoot.querySelector('#label');
              if (labelEl) {
                const raw = fmtLabel(mins).replace(/^"/, '').replace(/"$/, '');
                labelEl.textContent = raw;
              }
            } catch (e) {}
            if (fromDrag && prevMins !== null && mins !== prevMins) {
              const stepNow = card.__lgTimerStepMin || stepMin;
              const crossed = Math.floor(prevMins / stepNow) !== Math.floor(mins / stepNow);
              if (crossed && typeof navigator !== 'undefined' && navigator.vibrate) {
                try { navigator.vibrate(8); } catch (e) {}
              }
            }
          };
          const progressFromEvent = (ev, ringEl) => {
            const rect = ringEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let a = Math.atan2(ev.clientX - cx, -(ev.clientY - cy));
            if (a < 0) a += Math.PI * 2;
            return a / (Math.PI * 2);
          };
          if (!card.__lgTimerBound) {
            const bind = () => {
              const ring = card.shadowRoot && card.shadowRoot.querySelector('#timer_ring');
              if (!ring || card.__lgTimerBound) return;
              card.__lgTimerBound = true;
              applyTickProgress(card, card.__lgTimerLastProgress != null ? card.__lgTimerLastProgress : timerT);
              const down = (ev) => {
                /* Ignore taps that start on the confirm glass — confirm owns commit. */
                const path = (ev.composedPath && ev.composedPath()) || [];
                if (path.some((n) => n && n.id === 'timer_confirm')) return;
                card.__lgTimerDragging = true;
                card.classList.add('lg-timer-dragging');
                if (ring.setPointerCapture && ev.pointerId !== undefined) {
                  try { ring.setPointerCapture(ev.pointerId); } catch (e) {}
                }
                applyProgress(progressFromEvent(ev, ring), true);
                ev.preventDefault();
                ev.stopPropagation();
              };
              const move = (ev) => {
                if (!card.__lgTimerDragging) return;
                applyProgress(progressFromEvent(ev, ring), true);
                ev.preventDefault();
              };
              const up = () => {
                card.__lgTimerDragging = false;
                card.classList.remove('lg-timer-dragging');
              };
              ring.addEventListener('pointerdown', down);
              ring.addEventListener('pointermove', move);
              ring.addEventListener('pointerup', up);
              ring.addEventListener('pointercancel', up);
            };
            card.updateComplete.then(() => { bind(); setTimeout(bind, 60); setTimeout(bind, 240); });
          }
          /* Seed pending when overlay opens without prior drag. */
          if (pendingNow === null && seedMins > 0) {
            card.__lgTimerPending = seedMins;
            card.__lgTimerLastProgress = timerT;
          }
          card.updateComplete.then(() => applyTickProgress(card, timerT));
        }
        return `
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box;
        overflow: visible !important;
        background: transparent !important;
        box-shadow: none !important;
        pointer-events: auto !important;
        --lg_timer_t: ${timerT};
        --lg_timer_knob_x: ${knobPos.x}%;
        --lg_timer_knob_y: ${knobPos.y}%;
        --lg_timer_label: ${labelCss};
        --lg_timer_off_at: ${offAtCss};
        --lg_size_climate_timer_max_minutes: ${maxMin};
        --lg_size_climate_timer_min_minutes: ${minMin};
        --lg_size_climate_timer_step_minutes: ${stepMin};
      }
      ha-card, #card {
        width: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
      #container {
        display: grid !important;
        place-items: center !important;
        width: var(--lg_size_climate_timer_radial_w) !important;
        height: var(--lg_size_climate_timer_radial_w) !important;
        box-sizing: border-box !important;
        position: relative !important;
      }
      #name, #icon, #label, #state { display: none !important; }
      #timer_ring {
        grid-area: 1 / 1 !important;
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: 1 / 1 !important;
        display: block !important;
        position: relative !important;
        box-sizing: border-box !important;
        border-radius: 50% !important;
        pointer-events: auto !important;
        touch-action: none !important;
        z-index: 1 !important;
      }
      #timer_ring .lg-timer-radial__svg {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
        overflow: visible !important;
        pointer-events: none !important;
      }
      #timer_ring .lg-timer-radial__hit {
        fill: none;
        stroke: transparent;
        stroke-width: calc(var(--lg_size_climate_timer_tick_len) * 2.5);
        pointer-events: stroke !important;
      }
      #timer_ring .lg-timer-tick {
        stroke: var(--lg_color_climate_timer_tick);
        stroke-linecap: round;
        fill: none;
        transition: var(--lg_transition_climate_timer_tick);
        pointer-events: none !important;
      }
      #timer_ring .lg-timer-cursor {
        stroke: var(--lg_color_climate_timer_cursor);
        stroke-linecap: round;
        fill: none;
        pointer-events: none !important;
        filter: drop-shadow(0 0 0.15rem rgba(255, 72, 58, 0.45));
      }
      #timer_confirm {
        grid-area: 1 / 1 !important;
        z-index: 4 !important;
        justify-self: center !important;
        align-self: center !important;
        width: var(--lg_size_climate_setpoint_trigger_w) !important;
        height: var(--lg_size_climate_setpoint_trigger_w) !important;
        border-radius: 50% !important;
        position: relative !important;
        pointer-events: auto !important;
      }
      #knob {
        display: none !important;
        pointer-events: none !important;
      }
      @media (max-width: 48rem) {
        #container {
          width: var(--lg_size_climate_timer_radial_w_phone) !important;
          height: var(--lg_size_climate_timer_radial_w_phone) !important;
        }
        #timer_confirm {
          width: var(--lg_size_climate_setpoint_trigger_w_phone) !important;
          height: var(--lg_size_climate_setpoint_trigger_w_phone) !important;
        }
        #timer_ring .lg-timer-radial__hit {
          stroke-width: calc(var(--lg_size_climate_timer_tick_len_phone) * 2.5);
        }
      }
        `;
      ]]]
    custom_fields:
      timer_ring: >
        <svg class="lg-timer-radial__svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <circle class="lg-timer-radial__hit" cx="50" cy="50" r="41" pathLength="100"></circle>
          <g class="lg-timer-ticks"></g>
          <line class="lg-timer-cursor" x1="50" y1="35.5" x2="50" y2="41.35"></line>
        </svg>
      knob: ""
      timer_confirm:
        card:
          type: custom:button-card
          template: climate_timer_radial_confirm
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          variables:
            save_duration_script_id: "[[[ return (variables && variables.save_duration_script_id) || '' ]]]"
            hours_entity_id: "[[[ return (variables && variables.hours_entity_id) || '' ]]]"
            minutes_entity_id: "[[[ return (variables && variables.minutes_entity_id) || '' ]]]"
