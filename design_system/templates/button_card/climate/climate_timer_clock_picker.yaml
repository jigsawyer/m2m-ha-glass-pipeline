  climate_timer_clock_picker:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    variables:
      clock_hour_entity_id: ""
      clock_minute_entity_id: ""
    tap_action:
      action: none
    extra_styles: |
      [[[
        const clampInt = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
        const pad2 = (n) => String(n).padStart(2, '0');
        const parseHHMM = (state) => {
          if (!state || state === 'unknown' || state === 'unavailable') return [0, 0];
          const parts = String(state).split(':');
          return [clampInt(parseInt(parts[0], 10) || 0, 0, 23), clampInt(parseInt(parts[1], 10) || 0, 0, 59)];
        };
        const card = this;
        const ha = card.hass;
        const clockEid = card.config && card.config.entity;
        const hourEid = variables.clock_hour_entity_id;
        const minuteEid = variables.clock_minute_entity_id;
        card.__lgClockHourEid = hourEid;
        card.__lgClockMinuteEid = minuteEid;
        card.__lgClockEid = clockEid;
        const hs = ha && hourEid && ha.states[hourEid];
        const ms = ha && minuteEid && ha.states[minuteEid];
        let h = clampInt(parseInt(hs && hs.state, 10) || 0, 0, 23);
        let m = clampInt(parseInt(ms && ms.state, 10) || 0, 0, 59);
        if ((!hs || hs.state === 'unknown' || hs.state === 'unavailable') && clockEid && ha && ha.states[clockEid]) {
          [h, m] = parseHHMM(ha.states[clockEid].state);
        }
        const expected = `${pad2(h)}:${pad2(m)}`;
        card.__lgClockApplyFromInput = (el) => {
          const raw = (el && el.value) || card.__lgClockLastValue || '';
          if (!raw) return;
          const hass = card.hass;
          const hEid = card.__lgClockHourEid;
          const mEid = card.__lgClockMinuteEid;
          if (!hass || !hEid || !mEid) return;
          const parts = String(raw).split(':');
          const nh = clampInt(parseInt(parts[0], 10) || 0, 0, 23);
          const nm = clampInt(parseInt(parts[1], 10) || 0, 0, 59);
          const next = `${pad2(nh)}:${pad2(nm)}`;
          card.__lgClockLastValue = next;
          // Never rewrite el.value during commit — mutates iOS picker mid-dismiss.
          if (card.__lgClockDisplay) card.__lgClockDisplay.textContent = next;
          const curH = clampInt(parseInt(hass.states[hEid] && hass.states[hEid].state, 10) || 0, 0, 23);
          const curM = clampInt(parseInt(hass.states[mEid] && hass.states[mEid].state, 10) || 0, 0, 59);
          if (nh !== curH) {
            hass.callService('input_number', 'set_value', { entity_id: hEid, value: nh });
          }
          if (nm !== curM) {
            hass.callService('input_number', 'set_value', { entity_id: mEid, value: nm });
          }
        };
        // Mid-scroll: stash + mirror display only — no callService, keep PickerOpen.
        card.__lgClockOnInput = (ev) => {
          const el = ev && ev.target;
          if (el && el.value) {
            card.__lgClockLastValue = el.value;
            if (card.__lgClockDisplay) card.__lgClockDisplay.textContent = el.value;
          }
        };
        card.__lgClockOnChange = (ev) => {
          const el = ev && ev.target;
          if (el && el.value) {
            card.__lgClockLastValue = el.value;
            if (card.__lgClockDisplay) card.__lgClockDisplay.textContent = el.value;
          }
          card.__lgClockApplyFromInput(el);
          // Keep PickerOpen until blur so remount cannot wipe before helpers catch up.
        };
        card.__lgClockOnBlur = (ev) => {
          const el = ev && ev.target;
          card.__lgClockApplyFromInput(el);
          card.__lgClockPickerOpen = false;
        };
        card.__lgClockOpenPicker = (ev) => {
          if (ev) {
            ev.stopPropagation();
            ev.stopImmediatePropagation && ev.stopImmediatePropagation();
          }
          const input = card.__lgClockInput;
          if (!input) return;
          card.__lgClockPickerOpen = true;
          try { input.focus({ preventScroll: true }); } catch (_) { try { input.focus(); } catch (__) {} }
          if (typeof input.showPicker === 'function') {
            try { input.showPicker(); } catch (_) {}
          }
        };
        if (!card.__lgClockOnInputBound) {
          card.__lgClockOnInputBound = (ev) => card.__lgClockOnInput && card.__lgClockOnInput(ev);
          card.__lgClockOnChangeBound = (ev) => card.__lgClockOnChange && card.__lgClockOnChange(ev);
          card.__lgClockOnBlurBound = (ev) => card.__lgClockOnBlur && card.__lgClockOnBlur(ev);
          card.__lgClockOpenPickerBound = (ev) => card.__lgClockOpenPicker && card.__lgClockOpenPicker(ev);
        };
        const syncHelpersFromClock = () => {
          const hass = card.hass;
          const hEid = card.__lgClockHourEid;
          const mEid = card.__lgClockMinuteEid;
          const cEid = card.__lgClockEid;
          if (!hass || !hEid || !mEid || !cEid) return;
          const st = hass.states[cEid];
          if (!st || !st.state || st.state === 'unknown' || st.state === 'unavailable') return;
          const [ch, cm] = parseHHMM(st.state);
          const curH = clampInt(parseInt(hass.states[hEid] && hass.states[hEid].state, 10) || 0, 0, 23);
          const curM = clampInt(parseInt(hass.states[mEid] && hass.states[mEid].state, 10) || 0, 0, 59);
          if (curH === 0 && curM === 0 && (ch !== 0 || cm !== 0)) {
            hass.callService('input_number', 'set_value', { entity_id: hEid, value: ch });
            hass.callService('input_number', 'set_value', { entity_id: mEid, value: cm });
          }
        };
        const mount = () => {
          const root = card.shadowRoot;
          if (!root) return;
          const slot = root.querySelector('#clock_live') || root.querySelector('#container');
          if (!slot) return;
          let live = root.querySelector('#lg_clock_live');
          // Drop visible-only __input experiment so overlay+showPicker remounts cleanly.
          if (live && live.isConnected && !live.querySelector('.lg-climate-timer-clock__overlay')) {
            live.remove();
            live = null;
          }
          if (!live || !live.isConnected) {
            live = document.createElement('div');
            live.id = 'lg_clock_live';
            live.className = 'lg-climate-timer-clock';
            const label = document.createElement('span');
            label.className = 'lg-climate-timer-clock__label';
            label.textContent = 'Вимкнути о';
            const row = document.createElement('div');
            row.className = 'lg-climate-timer-clock__row';
            const icon = document.createElement('ha-icon');
            icon.className = 'lg-climate-timer-clock__icon';
            icon.setAttribute('icon', 'mdi:clock-outline');
            const hit = document.createElement('div');
            hit.className = 'lg-climate-timer-clock__hit';
            const display = document.createElement('span');
            display.className = 'lg-climate-timer-clock__display';
            display.textContent = expected;
            const input = document.createElement('input');
            input.className = 'lg-climate-timer-clock__overlay';
            input.type = 'time';
            input.step = '60';
            input.value = expected;
            input.setAttribute('aria-label', 'Вимкнути о');
            hit.appendChild(display);
            hit.appendChild(input);
            row.appendChild(icon);
            row.appendChild(hit);
            live.appendChild(label);
            live.appendChild(row);
            slot.appendChild(live);
            input.addEventListener('input', card.__lgClockOnInputBound);
            input.addEventListener('change', card.__lgClockOnChangeBound);
            input.addEventListener('blur', card.__lgClockOnBlurBound);
            input.addEventListener('click', card.__lgClockOpenPickerBound);
            input.addEventListener('pointerdown', card.__lgClockOpenPickerBound);
            hit.addEventListener('click', card.__lgClockOpenPickerBound);
            hit.addEventListener('pointerdown', card.__lgClockOpenPickerBound);
            card.__lgClockInput = input;
            card.__lgClockDisplay = display;
            card.__lgClockLastValue = expected;
            syncHelpersFromClock();
          } else {
            const input = live.querySelector('.lg-climate-timer-clock__overlay');
            const display = live.querySelector('.lg-climate-timer-clock__display');
            if (!input) return;
            card.__lgClockInput = input;
            card.__lgClockDisplay = display;
            const focused = root.activeElement === input
              || (typeof input.matches === 'function' && input.matches(':focus'));
            if (card.__lgClockPickerOpen || focused) return;
            // Sticky pending: prefer local commit before hass catches up.
            if (card.__lgClockLastValue && card.__lgClockLastValue !== expected) {
              card.__lgClockApplyFromInput(input);
              return;
            }
            if (input.value !== expected) input.value = expected;
            if (display && display.textContent !== expected) display.textContent = expected;
          }
        };
        setTimeout(mount, 0);
        return `
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: var(--lg_size_climate_timer_clock_h_phone) !important;
        display: block;
        box-sizing: border-box;
        margin: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
        --masonry-view-card-margin: 0;
      }
      ha-card, #card {
        position: relative;
        width: 100% !important;
        height: var(--lg_size_climate_timer_clock_h_phone) !important;
        border-radius: var(--lg_radius_liquid) !important;
        overflow: visible !important;
        background: transparent;
        box-shadow: none;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
      }
      {{ lg_liquid_clip_shell_extra_styles() }}
      #container {
        position: relative;
        display: grid !important;
        grid-template-areas: "live" !important;
        grid-template-columns: 1fr !important;
        grid-template-rows: var(--lg_size_climate_timer_clock_h_phone) !important;
        place-content: center !important;
        width: 100% !important;
        height: var(--lg_size_climate_timer_clock_h_phone) !important;
        box-sizing: border-box !important;
        padding: 0 var(--lg_space_climate_timer_clock_pad_x) !important;
        pointer-events: auto !important;
      }
      #clock_live {
        grid-area: live !important;
        position: relative;
        z-index: 2;
        width: 100% !important;
        min-width: 0 !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
        pointer-events: auto !important;
      }
      #icon, #name, #label, #state { display: none !important; }
      #lg_clock_live {
        position: relative;
        z-index: 2;
        width: 100% !important;
        min-width: 0 !important;
        pointer-events: auto !important;
      }
      #liquid_clip {
        position: absolute;
        inset: 0;
        border-radius: var(--lg_radius_liquid);
        overflow: hidden;
        clip-path: inset(0 round var(--lg_radius_liquid));
        isolation: isolate;
        pointer-events: none;
        z-index: 0;
        background: var(--lg_color_liquid_frost), var(--lg_color_liquid_base);
        background-blend-mode: normal, plus-lighter;
        backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
        -webkit-backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
        box-shadow: var(--lg_shadow_liquid);
      }
      #distort { display: none; }
      .lg-climate-timer-clock {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--lg_space_climate_timer_clock_gap);
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }
      .lg-climate-timer-clock__row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: var(--lg_space_climate_timer_clock_gap);
        width: 100%;
        min-width: 0;
      }
      .lg-climate-timer-clock__icon {
        --mdc-icon-size: var(--lg_font_climate_timer_clock_size_phone);
        width: var(--lg_font_climate_timer_clock_size_phone);
        height: var(--lg_font_climate_timer_clock_size_phone);
        color: var(--lg_color_text);
        flex-shrink: 0;
        pointer-events: none;
      }
      .lg-climate-timer-clock__hit {
        position: relative;
        box-sizing: border-box;
        flex: 0 0 auto;
        width: var(--lg_size_climate_timer_clock_input_w_phone);
        min-width: var(--lg_size_climate_timer_clock_input_w_phone);
        max-width: 100%;
        height: var(--lg_size_climate_timer_clock_input_h_phone);
        border: var(--lg_stroke_glass) solid var(--lg_color_glass_rim);
        border-radius: var(--lg_radius_liquid);
        background: var(--lg_color_glass_fill);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto !important;
        z-index: 3;
        overflow: hidden;
      }
      .lg-climate-timer-clock__display {
        position: relative;
        z-index: 1;
        pointer-events: none;
        color: var(--lg_color_text);
        font-family: var(--lg_font_label_family);
        font-size: var(--lg_font_climate_timer_clock_size_phone);
        font-weight: var(--lg_font_title_weight);
        letter-spacing: var(--lg_font_body_tracking);
        line-height: 1;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .lg-climate-timer-clock__overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
        pointer-events: auto !important;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        color: transparent;
        font-size: 1.25rem;
      }
      .lg-climate-timer-clock__label {
        color: var(--lg_color_text);
        font-family: var(--lg_font_label_family);
        font-size: var(--lg_font_climate_timer_clock_label_size);
        font-weight: var(--lg_font_title_weight);
        letter-spacing: var(--lg_font_body_tracking);
        line-height: var(--lg_line_height_label);
        text-align: center;
        white-space: nowrap;
        opacity: 0.85;
        pointer-events: none;
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}
      clock_live: ""

  # Climate timer duration picker — phone Force Native (wheels).
  # Proven path: glass __display + opacity:0 __overlay + showPicker (same as clock).
  # Apply: LastValue stash + display mirror; callService on change/blur only;
  # clear PickerOpen on blur only; sticky remount; never rewrite el.value mid-dismiss.
