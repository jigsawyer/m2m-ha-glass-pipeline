  climate_timer_remove_btn:
    show_icon: false
    show_name: true
    show_state: false
    show_label: false
    show_ripple: false
    name: Видалити таймер
    tap_action:
      action: none
    hold_action:
      action: call-service
      service: script.turn_on
      target: |
        [[[
          const id = variables && variables.remove_script_id;
          return id ? { entity_id: id } : {};
        ]]]
    variables:
      remove_script_id: ""
    extra_styles: |
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: var(--lg_size_climate_timer_remove_h) !important;
        display: block;
        box-sizing: border-box;
        margin: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
        --masonry-view-card-margin: 0;
      }
      ha-card {
        width: 100% !important;
        height: var(--lg_size_climate_timer_remove_h) !important;
        border-radius: var(--lg_radius_liquid) !important;
        overflow: visible !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
      }
      {{ lg_liquid_clip_shell_extra_styles() }}
      {{ lg_disable_press_feedback_extra_styles() }}
      #container {
        display: grid !important;
        grid-template-areas: "n" !important;
        grid-template-columns: 1fr !important;
        grid-template-rows: var(--lg_size_climate_timer_remove_h) !important;
        place-content: center !important;
      }
      #card {
        position: relative;
        width: 100% !important;
        height: var(--lg_size_climate_timer_remove_h) !important;
        border-radius: var(--lg_radius_liquid);
        background: transparent;
        box-shadow: none;
        transition: var(--lg_transition_press);
        cursor: pointer;
      }
      #card:active {
        box-shadow: var(--lg_glow_disable);
      }
      #icon, #label, #state { display: none !important; }
      #name {
        position: relative;
        z-index: 1;
        color: var(--lg_color_text) !important;
        font-family: var(--lg_font_label_family) !important;
        font-size: var(--lg_font_climate_timer_action_size) !important;
        font-weight: var(--lg_font_title_weight) !important;
        text-align: center !important;
        white-space: nowrap !important;
      }
      #card:active #name {
        color: var(--lg_color_disable_icon) !important;
      }
      #liquid_clip {
        position: absolute;
        inset: 0;
        border-radius: var(--lg_radius_liquid);
        overflow: hidden;
        clip-path: inset(0 round var(--lg_radius_liquid));
        isolation: isolate;
        pointer-events: none;
        z-index: 0;
        background: var(--lg_color_disable_frost), var(--lg_color_liquid_base), var(--lg_color_liquid_burn_soft);
        background-blend-mode: normal, plus-lighter, color-burn;
        backdrop-filter: blur(var(--lg_blur_room_btn));
        -webkit-backdrop-filter: blur(var(--lg_blur_room_btn));
        box-shadow: var(--lg_shadow_room_btn);
      }
      #distort { display: none; }
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  # Climate timer clock picker — phone Force Native (wheels).
  # Proven path: glass __display + opacity:0 __overlay + showPicker (wheels open).
  # Apply: LastValue stash + display mirror; callService on change/blur only;
  # clear PickerOpen on blur only; sticky remount; never rewrite el.value mid-dismiss.
  # Desktop uses climate_timer_dual_slider.
