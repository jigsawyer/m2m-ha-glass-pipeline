  climate_hvac_arc_dial:
    template: climate_arc_dial
    icon: |
      [[[
        /* 1:1 with option_1..5 icons. HA Off is not a menu option — never
           pretend Auto (https://www.home-assistant.io/integrations/climate/). */
        const mode = entity && entity.state;
        if (mode === 'cool') return 'ph:snowflake';
        if (mode === 'heat') return 'ph:flame';
        if (mode === 'dry') return 'ph:drop';
        if (mode === 'fan_only') return 'ph:fan';
        if (mode === 'auto' || mode === 'heat_cool') return 'ph:thermometer-simple';
        return 'ph:power';
      ]]]
    variables:
      arc_total: 5
    custom_fields:
      option_1:
        card:
          type: custom:button-card
          template: climate_arc_option_btn
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          icon: ph:snowflake
          name: Холод
          variables:
            check: state
            value: cool
            service: climate.set_hvac_mode
            data_key: hvac_mode
            arc_side: left
            arc_index: 0
            arc_total: 5
      option_2:
        card:
          type: custom:button-card
          template: climate_arc_option_btn
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          icon: ph:flame
          name: Тепло
          variables:
            check: state
            value: heat
            service: climate.set_hvac_mode
            data_key: hvac_mode
            arc_side: left
            arc_index: 1
            arc_total: 5
      option_3:
        card:
          type: custom:button-card
          template: climate_arc_option_btn
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          icon: ph:drop
          name: Сухо
          variables:
            check: state
            value: dry
            service: climate.set_hvac_mode
            data_key: hvac_mode
            arc_side: left
            arc_index: 2
            arc_total: 5
      option_4:
        card:
          type: custom:button-card
          template: climate_arc_option_btn
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          icon: ph:fan
          name: Вент.
          variables:
            check: state
            value: fan_only
            service: climate.set_hvac_mode
            data_key: hvac_mode
            arc_side: left
            arc_index: 3
            arc_total: 5
      option_5:
        card:
          type: custom:button-card
          template: climate_arc_option_btn
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          icon: ph:thermometer-simple
          name: Авто
          variables:
            check: state
            value: auto
            service: climate.set_hvac_mode
            data_key: hvac_mode
            arc_side: left
            arc_index: 4
            arc_total: 5

  # Fan-speed Arc Speed Dial — 4 options: auto/low/medium/high.
  # Same climate.set_fan_mode target/data as the retired climate_right_col.
