      {{ lg_climate_round_btn_shell_extra_styles('--lg_size_climate_timer_idle_w', '--lg_size_climate_timer_idle_w_phone', '--lg_size_climate_timer_idle_icon', '--lg_size_climate_timer_idle_icon_phone') }}
