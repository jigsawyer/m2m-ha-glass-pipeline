        transition-delay: calc(4 * var(--lg_climate_radial_stagger_step));
      }
      :host(.lg-wheel-temp-open) #swing_v,
      :host(.lg-wheel-temp-open) #mode_entry,
      :host(.lg-wheel-temp-open) #mode_auto {
        transition-delay: calc(5 * var(--lg_climate_radial_stagger_step));
      }
      /* Transparent hit shield over the fading annulus (replaces what
         display:none used to do for hit-testing). It sits above the segment
         hosts (their :host z-index is 2) and below #trigger / #timer_radial
         (z 46/47), so mid-commit taps and arc drag still land; the wheel's own
         tap_action is none, so swallowed taps are inert. */
      :host(.lg-wheel-temp-open) #container::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 5;
        background: transparent;
        pointer-events: auto;
      }
      {{ lg_climate_wheel_timer_fsm_extra_styles() }}
        `;
      ]]]
