  laundry_machine:
    show_name: true
    show_icon: true
    show_state: false
    show_label: false
    show_ripple: false
    triggers_update: all
    variables:
      machine_state_entity_id: ""
      job_state_entity_id: ""
      completion_entity_id: ""
      remote_entity_id: ""
      power_entity_id: ""
      armed_entity_id: ""
      cycle_duration_entity_id: ""
      delay_mode_entity_id: ""
      delay_timer_entity_id: ""
      schedule_script_id: ""
      cancel_script_id: ""
      popup_hash: ""
      option_spin_entity_id: ""
      option_water_entity_id: ""
      option_rinse_entity_id: ""
      option_wrinkle_entity_id: ""
      option_bubble_entity_id: ""
      machine_kind: "washer"
    icon: |
      [[[
        const kind = variables.machine_kind || 'washer';
        const armedId = variables.armed_entity_id || '';
        const armed = armedId && states[armedId] && states[armedId].state === 'on';
        if (armed) return 'mdi:timer-check-outline';
        return kind === 'dryer' ? 'mdi:tumble-dryer' : 'mdi:washing-machine';
      ]]]
    tap_action:
      action: none
    extra_styles: |
      /* Laundry fields live under #container — grid on ha-card never lays them out
         (ADR 0006 / lg_container_grid). Rework: header / state / controls. */
      :host {
        width: var(--lg_size_laundry_card_w) !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: auto !important;
        display: block !important;
        box-sizing: border-box;
        background: transparent !important;
        box-shadow: none !important;
        --ha-card-border-radius: var(--lg_radius_laundry) !important;
      }
      @media (max-width: 48rem) {
        :host {
          width: var(--lg_size_laundry_card_w_phone) !important;
        }
      }
      #card {
        position: relative !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        border-radius: var(--lg_radius_laundry) !important;
        box-sizing: border-box !important;
        overflow: visible !important;
        padding: var(--lg_space_laundry_pad) !important;
        background: var(--lg_color_laundry_card_fill) !important;
        border: var(--lg_stroke_glass, 0.0625rem) solid var(--lg_color_laundry_display_rim) !important;
        box-shadow: var(--lg_shadow_laundry_card) !important;
        backdrop-filter: blur(var(--lg_blur_laundry_glass)) !important;
        -webkit-backdrop-filter: blur(var(--lg_blur_laundry_glass)) !important;
        transition: var(--lg_transition_laundry) !important;
      }
      #card:has(.lg-laundry-state-glow--run) {
        box-shadow: var(--lg_shadow_laundry_card), var(--lg_glow_laundry_run) !important;
      }
      #card:has(.lg-laundry-state-glow--pause) {
        box-shadow: var(--lg_shadow_laundry_card), var(--lg_glow_laundry_pause) !important;
      }
      #card:has(.lg-laundry-state-glow--error) {
        background: var(--lg_color_laundry_error) !important;
        border-color: var(--lg_color_laundry_error_rim) !important;
        box-shadow: var(--lg_shadow_laundry_card), var(--lg_glow_laundry_error) !important;
        animation: lg-laundry-error-breathe 2.4s ease-in-out infinite;
      }
      @keyframes lg-laundry-error-breathe {
        0%, 100% { border-color: var(--lg_color_laundry_error_rim); }
        50% { border-color: var(--lg_color_laundry_display_rim); }
      }
      #container {
        display: grid !important;
        grid-template-areas:
          "icon name power"
          "display display display"
          "opts opts opts"
          "primary primary primary"
          "delay delay delay" !important;
        grid-template-columns: auto minmax(0, 1fr) auto !important;
        grid-template-rows: auto auto auto auto auto !important;
        gap: var(--lg_space_laundry_gap) !important;
        align-items: center !important;
        justify-items: stretch !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        position: relative !important;
        box-sizing: border-box !important;
        overflow: visible !important;
      }
      #liquid_clip, #distort, #state_glow {
        position: absolute !important;
        inset: 0 !important;
        width: auto !important;
        height: auto !important;
        pointer-events: none !important;
        grid-area: unset !important;
      }
      #img, #img-cell {
        grid-area: icon !important;
        position: relative !important;
        inset: auto !important;
        top: auto !important;
        left: auto !important;
        justify-self: start !important;
        width: var(--lg_size_laundry_icon) !important;
        height: var(--lg_size_laundry_icon) !important;
        z-index: 1 !important;
      }
      :host:has(.lg-laundry-state-glow--run) #img {
        animation: lg-laundry-drum 2s linear infinite;
      }
      @keyframes lg-laundry-drum {
        to { transform: rotate(360deg); }
      }
      #name {
        grid-area: name !important;
        position: relative !important;
        inset: auto !important;
        top: auto !important;
        left: auto !important;
        justify-self: start !important;
        width: auto !important;
        max-width: 100% !important;
        font-size: var(--lg_font_laundry_title_size) !important;
        font-weight: 700 !important;
        color: var(--lg_color_text) !important;
        white-space: normal !important;
        z-index: 1 !important;
      }
      #power, #display, #opts, #primary, #delay {
        position: relative !important;
        inset: auto !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        z-index: 1 !important;
      }
      #power {
        grid-area: power !important;
        justify-self: end !important;
        width: auto !important;
      }
      #display { grid-area: display !important; width: 100% !important; }
      #opts { grid-area: opts !important; width: 100% !important; }
      #primary { grid-area: primary !important; width: 100% !important; }
      #delay { grid-area: delay !important; width: 100% !important; }
      #opts > *, #primary > *, #delay > * {
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
      }
      :host:has(.lg-laundry-lock--controls) #opts {
        opacity: var(--lg_opacity_laundry_controls_locked) !important;
        pointer-events: none !important;
      }
      :host:has(.lg-laundry-lock--delay) #delay {
        display: none !important;
      }
      .lg-laundry-power {
        width: var(--lg_size_laundry_power);
        height: var(--lg_size_laundry_power);
        border-radius: 50%;
        box-sizing: border-box;
        border: var(--lg_stroke_glass, 0.0625rem) solid var(--lg_color_laundry_display_rim);
        background: var(--lg_color_laundry_power_off);
        box-shadow: none;
        pointer-events: none;
      }
      .lg-laundry-power--on {
        background: var(--lg_color_laundry_power_on);
        box-shadow: 0 0 0.5rem var(--lg_color_laundry_power_on);
      }
      .lg-laundry-display {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        min-height: var(--lg_size_laundry_display_min_h);
        padding: var(--lg_space_laundry_pad);
        border-radius: var(--lg_radius_laundry);
        background: var(--lg_color_laundry_display_fill);
        box-shadow: var(--lg_shadow_laundry_display);
        overflow: hidden;
        transition: var(--lg_transition_laundry);
      }
      .lg-laundry-display::before,
      .lg-laundry-display::after {
        content: "";
        position: absolute;
        pointer-events: none;
        inset: 0;
        border-radius: inherit;
      }
      .lg-laundry-display::before {
        border: var(--lg_stroke_glass, 0.0625rem) solid var(--lg_color_laundry_display_rim);
        opacity: 0.55;
      }
      .lg-laundry-display::after {
        background: linear-gradient(
          135deg,
          var(--lg_color_glass_frost) 0%,
          transparent 42%,
          var(--lg_color_glass_luminosity) 100%
        );
        opacity: 0.85;
      }
      .lg-laundry-display--run::after {
        background: linear-gradient(
          180deg,
          transparent 40%,
          var(--lg_color_climate_cool) 100%
        );
        opacity: 0.18;
        animation: lg-laundry-wave 3.2s ease-in-out infinite;
      }
      @keyframes lg-laundry-wave {
        0%, 100% { transform: translateY(8%); }
        50% { transform: translateY(-4%); }
      }
      .lg-laundry-display__body {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--lg_space_laundry_gap);
        min-height: calc(var(--lg_size_laundry_display_min_h) - var(--lg_space_laundry_pad) * 2);
        text-align: center;
        color: var(--lg_color_text);
        transition: var(--lg_transition_laundry);
      }
      .lg-laundry-display--paused .lg-laundry-display__eta {
        filter: blur(0.08rem);
        opacity: var(--lg_opacity_laundry_paused_blur);
      }
      .lg-laundry-ring-wrap {
        position: relative;
        width: var(--lg_size_laundry_ring);
        height: var(--lg_size_laundry_ring);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lg-laundry-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .lg-laundry-ring__track,
      .lg-laundry-ring__meter {
        fill: none;
        stroke-width: var(--lg_stroke_laundry_ring);
        stroke-linecap: round;
      }
      .lg-laundry-ring__track {
        stroke: var(--lg_color_laundry_display_rim);
        opacity: 0.35;
      }
      .lg-laundry-ring__meter {
        stroke: var(--lg_color_climate_cool);
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        transition: stroke-dashoffset 0.6s ease;
      }
      .lg-laundry-ring--p0 .lg-laundry-ring__meter { stroke-dashoffset: 100; }
      .lg-laundry-ring--p5 .lg-laundry-ring__meter { stroke-dashoffset: 95; }
      .lg-laundry-ring--p10 .lg-laundry-ring__meter { stroke-dashoffset: 90; }
      .lg-laundry-ring--p15 .lg-laundry-ring__meter { stroke-dashoffset: 85; }
      .lg-laundry-ring--p20 .lg-laundry-ring__meter { stroke-dashoffset: 80; }
      .lg-laundry-ring--p25 .lg-laundry-ring__meter { stroke-dashoffset: 75; }
      .lg-laundry-ring--p30 .lg-laundry-ring__meter { stroke-dashoffset: 70; }
      .lg-laundry-ring--p35 .lg-laundry-ring__meter { stroke-dashoffset: 65; }
      .lg-laundry-ring--p40 .lg-laundry-ring__meter { stroke-dashoffset: 60; }
      .lg-laundry-ring--p45 .lg-laundry-ring__meter { stroke-dashoffset: 55; }
      .lg-laundry-ring--p50 .lg-laundry-ring__meter { stroke-dashoffset: 50; }
      .lg-laundry-ring--p55 .lg-laundry-ring__meter { stroke-dashoffset: 45; }
      .lg-laundry-ring--p60 .lg-laundry-ring__meter { stroke-dashoffset: 40; }
      .lg-laundry-ring--p65 .lg-laundry-ring__meter { stroke-dashoffset: 35; }
      .lg-laundry-ring--p70 .lg-laundry-ring__meter { stroke-dashoffset: 30; }
      .lg-laundry-ring--p75 .lg-laundry-ring__meter { stroke-dashoffset: 25; }
      .lg-laundry-ring--p80 .lg-laundry-ring__meter { stroke-dashoffset: 20; }
      .lg-laundry-ring--p85 .lg-laundry-ring__meter { stroke-dashoffset: 15; }
      .lg-laundry-ring--p90 .lg-laundry-ring__meter { stroke-dashoffset: 10; }
      .lg-laundry-ring--p95 .lg-laundry-ring__meter { stroke-dashoffset: 5; }
      .lg-laundry-ring--p100 .lg-laundry-ring__meter { stroke-dashoffset: 0; }
      .lg-laundry-display__eta {
        font-size: var(--lg_font_laundry_display_size);
        line-height: 1.1;
        letter-spacing: 0.02em;
        font-weight: 600;
        z-index: 1;
      }
      @media (max-width: 48rem) {
        .lg-laundry-display__eta {
          font-size: var(--lg_font_laundry_display_size_phone);
        }
      }
      .lg-laundry-display__title {
        font-size: var(--lg_font_laundry_title_size);
        font-weight: 600;
      }
      .lg-laundry-display__sub {
        font-size: var(--lg_font_laundry_status_size);
        opacity: 0.8;
      }
      .lg-laundry-display__overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--lg_font_laundry_title_size);
        font-weight: 700;
        pointer-events: none;
        background: var(--lg_color_glass_darken);
      }
      .lg-laundry-alert {
        animation: lg-laundry-shake 5s ease-in-out infinite;
      }
      @keyframes lg-laundry-shake {
        0%, 92%, 100% { transform: translateX(0); }
        94% { transform: translateX(-0.15rem); }
        96% { transform: translateX(0.15rem); }
        98% { transform: translateX(-0.1rem); }
      }
      {{ lg_liquid_clip_shell_extra_styles() }}
      {{ lg_distort_shell_extra_styles() }}
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}
      distort: '{{ lg_distort_shell_html() }}'
      state_glow: |
        [[[
          const armedId = variables.armed_entity_id || '';
          const armed = armedId && states[armedId] && states[armedId].state === 'on';
          const powerId = variables.power_entity_id || '';
          const power = powerId && states[powerId] ? states[powerId].state : 'on';
          const stId = variables.machine_state_entity_id || '';
          const st = stId && states[stId] ? String(states[stId].state).toLowerCase() : '';
          const sel = entity ? entity.state : '';
          let mod = 'idle';
          const locks = [];
          if (st.includes('error') || st.includes('failure')) mod = 'error';
          else if (armed) mod = 'scheduled';
          else if (power === 'off' || power === 'unavailable') {
            mod = 'off';
            locks.push('controls');
          } else if (sel === 'run') {
            mod = 'run';
            locks.push('controls', 'delay');
          } else if (sel === 'pause') {
            mod = 'pause';
            locks.push('controls');
          }
          const lockCls = locks.map((k) => `lg-laundry-lock--${k}`).join(' ');
          return `<div class="lg-laundry-state-glow lg-laundry-state-glow--${mod} ${lockCls}"></div>`;
        ]]]
      power: |
        [[[
          const powerId = variables.power_entity_id || '';
          const power = powerId && states[powerId] ? states[powerId].state : 'unknown';
          const on = power === 'on';
          const cls = on ? 'lg-laundry-power lg-laundry-power--on' : 'lg-laundry-power';
          return `<div class="${cls}" title="Power ${on ? 'on' : 'off'}"></div>`;
        ]]]
      display: |
        [[[
          const stId = variables.machine_state_entity_id || '';
          const jobId = variables.job_state_entity_id || '';
          const remId = variables.remote_entity_id || '';
          const compId = variables.completion_entity_id || '';
          const armedId = variables.armed_entity_id || '';
          const timerId = variables.delay_timer_entity_id || '';
          const durId = variables.cycle_duration_entity_id || '';
          const powerId = variables.power_entity_id || '';
          const armed = armedId && states[armedId] && states[armedId].state === 'on';
          const power = powerId && states[powerId] ? states[powerId].state : 'on';
          const sel = entity ? entity.state : '';
          const st = stId && states[stId] ? states[stId].state : '';
          const stLow = String(st || '').toLowerCase();
          const job = jobId && states[jobId] ? states[jobId].state : '';
          const remote = remId && states[remId] ? states[remId].state : '';
          const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const fmtEta = () => {
            let eta = '—';
            let progress = 0;
            const raw = compId && states[compId] ? states[compId].state : '';
            if (raw && raw !== 'unknown' && raw !== 'unavailable') {
              const end = Date.parse(raw);
              if (!Number.isNaN(end)) {
                const ms = Math.max(0, end - Date.now());
                const totalSec = Math.floor(ms / 1000);
                const hh = Math.floor(totalSec / 3600);
                const mm = Math.floor((totalSec % 3600) / 60);
                const ss = totalSec % 60;
                const pad = (n) => String(n).padStart(2, '0');
                eta = hh > 0 ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
                const durMin = durId && states[durId] ? Number(states[durId].state) : NaN;
                if (!Number.isNaN(durMin) && durMin > 0) {
                  const totalMs = durMin * 60000;
                  progress = Math.max(0, Math.min(1, 1 - (ms / totalMs)));
                }
              } else {
                eta = esc(raw);
              }
            }
            const pClass = 'lg-laundry-ring--p' + (Math.round(progress * 20) * 5);
            return { eta, pClass };
          };
          if (stLow.includes('error') || stLow.includes('failure')) {
            return `<div class="lg-laundry-display lg-laundry-display--error"><div class="lg-laundry-display__body"><div class="lg-laundry-display__title lg-laundry-alert">Помилка</div><div class="lg-laundry-display__sub">${esc(st)}</div></div></div>`;
          }
          if (power === 'off' || power === 'unavailable') {
            return `<div class="lg-laundry-display lg-laundry-display--off"><div class="lg-laundry-display__body"><div class="lg-laundry-display__title">Powered Off</div><div class="lg-laundry-display__sub">живлення вимкнено</div></div></div>`;
          }
          if (armed) {
            const t = timerId && states[timerId] ? states[timerId].state : '';
            const sub = t && t !== 'idle' ? esc(t) : 'очікування старту';
            return `<div class="lg-laundry-display lg-laundry-display--scheduled"><div class="lg-laundry-display__body"><div class="lg-laundry-display__title">Відкладений старт</div><div class="lg-laundry-display__sub">${sub}</div></div></div>`;
          }
          if (sel === 'run' || sel === 'pause') {
            const { eta, pClass } = fmtEta();
            const subParts = [];
            if (job && job !== 'none' && job !== 'unknown') subParts.push(esc(job));
            if (st && st !== 'unknown') subParts.push(esc(st));
            const sub = subParts.length ? subParts.join(' · ') : (sel === 'pause' ? 'на паузі' : 'цикл триває');
            const paused = sel === 'pause' ? ' lg-laundry-display--paused' : ' lg-laundry-display--run';
            const overlay = sel === 'pause' ? '<div class="lg-laundry-display__overlay">Paused</div>' : '';
            return `<div class="lg-laundry-display${paused}"><div class="lg-laundry-display__body"><div class="lg-laundry-ring-wrap"><svg class="lg-laundry-ring ${pClass}" viewBox="0 0 100 100" aria-hidden="true"><circle class="lg-laundry-ring__track" cx="50" cy="50" r="42" pathLength="100"/><circle class="lg-laundry-ring__meter" cx="50" cy="50" r="42" pathLength="100"/></svg><div class="lg-laundry-display__eta">${eta}</div></div><div class="lg-laundry-display__sub">${sub}</div></div>${overlay}</div>`;
          }
          let title = 'Ready to Start';
          if (sel === 'stop' || st === 'stop' || st === 'off') title = 'Ready to Start';
          const bits = [];
          if (st && st !== 'unknown' && st !== 'unavailable') bits.push(esc(st));
          if (job && job !== 'none' && job !== 'unknown') bits.push(esc(job));
          if (remote === 'off') bits.push('remote off');
          const sub = bits.length ? bits.join(' · ') : 'очікування команди';
          return `<div class="lg-laundry-display lg-laundry-display--ready"><div class="lg-laundry-display__body"><div class="lg-laundry-display__title">${title}</div><div class="lg-laundry-display__sub">${sub}</div></div></div>`;
        ]]]
      opts:
        card:
          type: custom:button-card
          template: laundry_params_grid
          entity: |
            [[[ return entity.entity_id; ]]]
          variables:
            option_spin_entity_id: '[[[ return variables.option_spin_entity_id || ""; ]]]'
            option_water_entity_id: '[[[ return variables.option_water_entity_id || ""; ]]]'
            option_rinse_entity_id: '[[[ return variables.option_rinse_entity_id || ""; ]]]'
            option_wrinkle_entity_id: '[[[ return variables.option_wrinkle_entity_id || ""; ]]]'
            option_bubble_entity_id: '[[[ return variables.option_bubble_entity_id || ""; ]]]'
            armed_entity_id: '[[[ return variables.armed_entity_id || ""; ]]]'
      primary:
        card:
          type: custom:button-card
          template: laundry_primary_action
          entity: |
            [[[ return entity.entity_id; ]]]
          variables:
            armed_entity_id: '[[[ return variables.armed_entity_id || ""; ]]]'
            power_entity_id: '[[[ return variables.power_entity_id || ""; ]]]'
            machine_kind: '[[[ return variables.machine_kind || "washer"; ]]]'
      delay:
        card:
          type: custom:button-card
          template: laundry_delay_controls
          entity: |
            [[[ return variables.armed_entity_id || entity.entity_id; ]]]
          variables:
            armed_entity_id: '[[[ return variables.armed_entity_id || ""; ]]]'
            cancel_script_id: '[[[ return variables.cancel_script_id || ""; ]]]'
            popup_hash: '[[[ return variables.popup_hash || ""; ]]]'
            delay_timer_entity_id: '[[[ return variables.delay_timer_entity_id || ""; ]]]'
