  switch_placeholder:
    template: switch_button
    show_name: false
    tap_action:
      action: none
    # Must NOT use color_type: blank-card — that skips extra_styles (display:none).
    extra_styles: |
      :host {
        width: 0;
        max-width: 0;
        min-width: 0;
        height: 0;
        min-height: 0;
        display: none;
        overflow: hidden;
      }
      #card {
        width: var(--lg_size_placeholder_w);
        max-width: 0;
        min-width: 0;
        height: var(--lg_size_placeholder_h);
        min-height: 0;
        aspect-ratio: auto;
        opacity: 0;
        pointer-events: none;
        box-shadow: none;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: none;
        margin: 0;
        padding: 0;
      }
