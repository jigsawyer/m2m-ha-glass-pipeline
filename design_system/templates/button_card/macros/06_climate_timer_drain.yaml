{# ADR 0055 — Watch Bezel drain: equidistant geometry + Ambient Conic Track.
   Call from climate_global_wheel extra_styles AFTER __lgDrainT / running / armed /
   tEnt / __lgWantManage / __lgWantRadial / __lgClockRemSec are in scope. #}
{% macro lg_climate_timer_drain_sync_js() -%}
        this.style.setProperty('--lg_timer_drain_t', String(__lgDrainT));
        const __lgParseCssLen = (raw, hostPx) => {
          const s = String(raw || '').trim();
          if (!s) return 0;
          if (s.endsWith('rem')) {
            const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
            return (parseFloat(s) || 0) * fs;
          }
          if (s.endsWith('px')) return parseFloat(s) || 0;
          if (s.endsWith('%') && hostPx) return (parseFloat(s) / 100) * hostPx;
          const n = parseFloat(s);
          return Number.isFinite(n) ? n : 0;
        };
        const __lgTickN = 60;
        const __lgR4 = (n) => Math.round(n * 10000) / 10000;
        const __lgReadDrainTickGeo = (host, drainW) => {
          const cs = getComputedStyle(host);
          const num = (prop, fb) => {
            const v = parseFloat(cs.getPropertyValue(prop));
            return Number.isFinite(v) && v > 0 ? v : fb;
          };
          const phone = window.matchMedia && window.matchMedia('(max-width: 48rem)').matches;
          const remToVb = (prop, fbRem) => {
            const px = __lgParseCssLen(cs.getPropertyValue(prop) || fbRem, host.clientWidth || 0);
            if (!(drainW > 0) || !(px > 0)) return 0;
            return (px / drainW) * 100;
          };
          return {
            len: num(phone ? '--lg_size_climate_timer_tick_len_phone' : '--lg_size_climate_timer_tick_len', phone ? 2.25 : 2.0),
            lenM: remToVb(
              phone ? '--lg_size_climate_timer_tick_len_medium_phone' : '--lg_size_climate_timer_tick_len_medium',
              phone ? '0.48rem' : '0.42rem'
            ) || (phone ? 2.5 : 2.25),
            lenQ: num(phone ? '--lg_size_climate_timer_tick_len_quarter_phone' : '--lg_size_climate_timer_tick_len_quarter', phone ? 2.35 : 2.1),
            thick: num(phone ? '--lg_size_climate_timer_tick_thick_phone' : '--lg_size_climate_timer_tick_thick', phone ? 1.05 : 0.95),
            thickM: remToVb(
              phone ? '--lg_size_climate_timer_tick_thick_medium_phone' : '--lg_size_climate_timer_tick_thick_medium',
              phone ? '0.125rem' : '0.11rem'
            ) || (phone ? 1.2 : 1.1),
            thickQ: num(phone ? '--lg_size_climate_timer_tick_thick_quarter_phone' : '--lg_size_climate_timer_tick_thick_quarter', phone ? 1.7 : 1.55),
            opDormant: num('--lg_opacity_climate_timer_tick_dormant', 0.48),
            opInactive: num('--lg_opacity_climate_timer_tick_inactive', 0.18),
          };
        };
        const __lgEnsureDrainTicks = (g, host, outerR, innerR, drainW) => {
          if (!g) return;
          const geo = __lgReadDrainTickGeo(host, drainW);
          const band = Math.max(0.2, outerR - Math.max(0, innerR));
          const geoKey = `${outerR}|${innerR}|${geo.len}|${geo.lenM}|${geo.thick}|${geo.thickM}|${geo.lenQ}|${geo.thickQ}|${band}`;
          const needRebuild = g.childElementCount !== __lgTickN
            || g.getAttribute('data-geo') !== geoKey;
          if (!needRebuild) return;
          while (g.firstChild) g.removeChild(g.firstChild);
          g.setAttribute('data-geo', geoKey);
          g.setAttribute('data-r', String(outerR));
          g.setAttribute('data-ri', String(innerR));
          const ns = 'http://www.w3.org/2000/svg';
          const CX = 50, CY = 50;
          /* Ticks stay inside the Watch Bezel band so D_bezel_gap reads as clear air. */
          const lenMinor = Math.min(geo.len, band * 0.52);
          const lenMed = Math.min(geo.lenM, band * 0.78);
          const lenMaj = Math.min(geo.lenQ, band * 0.98);
          for (let i = 0; i < __lgTickN; i += 1) {
            const quarter = (i % 15) === 0;
            const medium = !quarter && (i % 5) === 0;
            const len = quarter ? lenMaj : (medium ? lenMed : lenMinor);
            const thick = quarter ? geo.thickQ : (medium ? geo.thickM : geo.thick);
            const theta = (i / __lgTickN) * Math.PI * 2;
            const cos = Math.cos(theta);
            const sin = Math.sin(theta);
            const rOut = outerR;
            const rIn = Math.max(innerR, outerR - len);
            const line = document.createElementNS(ns, 'line');
            let cls = 'lg-timer-drain-tick';
            if (quarter) cls += ' lg-timer-drain-tick--quarter';
            else if (medium) cls += ' lg-timer-drain-tick--medium';
            line.setAttribute('class', cls);
            line.setAttribute('data-i', String(i));
            line.setAttribute('x1', String(__lgR4(CX + rIn * sin)));
            line.setAttribute('y1', String(__lgR4(CY - rIn * cos)));
            line.setAttribute('x2', String(__lgR4(CX + rOut * sin)));
            line.setAttribute('y2', String(__lgR4(CY - rOut * cos)));
            line.setAttribute('stroke-width', String(thick));
            line.style.opacity = String(geo.opDormant);
            g.appendChild(line);
          }
        };
        const __lgApplyDrainTicks = (host, t, outerR, innerR, drainW) => {
          try {
            const root = host.shadowRoot;
            const g = root && root.querySelector('#timer_drain .lg-timer-drain-ticks');
            if (!g) return false;
            __lgEnsureDrainTicks(g, host, outerR, innerR, drainW);
            const geo = __lgReadDrainTickGeo(host, drainW);
            const lines = g.querySelectorAll('.lg-timer-drain-tick');
            for (let i = 0; i < lines.length; i += 1) {
              lines[i].style.opacity = String(geo.opDormant);
            }
            const tt = Math.max(0, Math.min(1, Number(t) || 0));
            host.style.setProperty('--lg_timer_drain_t', String(tt));
            const fill = root.querySelector('#timer_drain .lg-timer-conic-fill');
            if (fill) fill.style.setProperty('--lg_timer_drain_t', String(tt));
            /* Threshold_Warning needs a known span; armed clock timers report
               none, so warn only when the duration is actually measurable. */
            const durSec = Number(host.__lgTimerDrainDurSec) || 0;
            const remSec = durSec * tt;
            const warn = tt > 0 && durSec > 0 && (tt < 0.1 || remSec < 300);
            host.classList.toggle('lg-timer-threshold-warn', !!warn);
            if (tt <= 0.001 && host.__lgTimerDrainWasPositive) {
              host.classList.add('lg-timer-completion');
              setTimeout(() => {
                try { host.classList.remove('lg-timer-completion'); } catch (e) {}
              }, 700);
            }
            host.__lgTimerDrainWasPositive = tt > 0.001;
            return true;
          } catch (e) { return false; }
        };
        /* ADR 0055 — Watch Bezel: D_bezel_gap = G_radial; W_bezel = k * W_radial_button.
           Oversized gap tokens must not collapse the progress track to 0 width:
           clamp gap down toward G_radial first, then shrink W_bezel to fit room. */
        const __lgLayoutDrain = (host) => {
          try {
            const root = host.shadowRoot;
            const el = root && root.querySelector('#timer_drain');
            if (!el) return { r: 0, ri: 0, drainW: 0 };
            const hostW = host.clientWidth || 0;
            if (!(hostW > 0)) return { r: 0, ri: 0, drainW: 0 };
            const cs = getComputedStyle(host);
            const phone = window.matchMedia && window.matchMedia('(max-width: 48rem)').matches;
            const outerPct = parseFloat(cs.getPropertyValue(
              phone ? '--lg_size_climate_wheel_outer_pct_phone' : '--lg_size_climate_wheel_outer_pct'
            )) || 96;
            const innerPct = parseFloat(cs.getPropertyValue(
              phone ? '--lg_size_climate_wheel_inner_pct_phone' : '--lg_size_climate_wheel_inner_pct'
            )) || 54;
            const padPx = __lgParseCssLen(cs.getPropertyValue('--lg_space_climate_pad'), hostW);
            const strokeGlassPx = __lgParseCssLen(cs.getPropertyValue('--lg_stroke_glass'), hostW);
            const gRadialPx = __lgParseCssLen(cs.getPropertyValue('--lg_size_climate_wheel_seg_gap'), hostW);
            let bezelGapPx = (() => {
              const dedicated = __lgParseCssLen(cs.getPropertyValue('--lg_size_climate_timer_bezel_gap'), hostW);
              return dedicated > 0 ? dedicated : gRadialPx;
            })();
            const kWeight = (() => {
              const v = parseFloat(cs.getPropertyValue('--lg_ratio_climate_timer_bezel_weight'));
              return Number.isFinite(v) && v > 0 ? v : 0.36;
            })();
            const hostHalf = hostW / 2;
            const rRadialOuter = (outerPct / 100) * hostHalf;
            const wRadialButton = Math.max(0, ((outerPct - innerPct) / 100) * hostHalf);
            let wBezel = kWeight * wRadialButton;
            const roomHalfPx = hostHalf + padPx + strokeGlassPx;
            let rBezelInner = rRadialOuter + bezelGapPx;
            let rBezelOuter = rBezelInner + wBezel;
            if (rBezelOuter > roomHalfPx) {
              const overflow = rBezelOuter - roomHalfPx;
              const gapFloor = Math.max(0, gRadialPx);
              const gapSlack = Math.max(0, bezelGapPx - gapFloor);
              const gapCut = Math.min(overflow, gapSlack);
              bezelGapPx -= gapCut;
              rBezelInner = rRadialOuter + bezelGapPx;
              wBezel = Math.max(0, roomHalfPx - rBezelInner);
              rBezelOuter = rBezelInner + wBezel;
            }
            const needHalf = Math.max(hostW / 2, rBezelOuter * 1.02);
            const needBox = needHalf * 2;
            if (needBox > hostW + 0.5) {
              try {
                el.style.setProperty('width', `${needBox}px`, 'important');
                el.style.setProperty('height', `${needBox}px`, 'important');
              } catch (e) {}
            }
            const drainW = Math.max(el.clientWidth || hostW, needBox);
            const viewHalf = drainW / 2;
            if (viewHalf > 0) {
              const pct = (px) => __lgR4(Math.max(0, Math.min(100, (px / viewHalf) * 100)));
              el.style.setProperty('--lg_timer_conic_inner_pct', `${pct(rBezelInner)}%`);
              el.style.setProperty('--lg_timer_conic_outer_pct', `${pct(rBezelOuter)}%`);
              el.style.setProperty('--lg_timer_bezel_gap_px', String(__lgR4(bezelGapPx)));
              el.style.setProperty('--lg_timer_bezel_weight_px', String(__lgR4(wBezel)));
            }
            const r = viewHalf > 0 ? (rBezelOuter / viewHalf) * 50 : 46;
            const ri = viewHalf > 0 ? (rBezelInner / viewHalf) * 50 : 40;
            return {
              r: Math.min(49, Math.round(r * 1000) / 1000),
              ri: Math.min(48, Math.round(ri * 1000) / 1000),
              drainW,
            };
          } catch (e) { return { r: 0, ri: 0, drainW: 0 }; }
        };
        const __lgSyncDrain = (host, t, show) => {
          const once = () => {
            const el = host.shadowRoot && host.shadowRoot.querySelector('#timer_drain');
            if (!el) return false;
            try {
              el.style.setProperty('display', show ? 'block' : 'none', 'important');
              el.style.setProperty('opacity', show ? '1' : '0', 'important');
            } catch (e) {}
            if (show) {
              const layout = __lgLayoutDrain(host);
              const r = layout.r || 48.5;
              const ri = layout.ri || Math.max(0, r - 2);
              host.__lgTimerDrainR = r;
              host.__lgTimerDrainRi = ri;
              __lgApplyDrainTicks(host, t, r, ri, layout.drainW || el.clientWidth || host.clientWidth || 0);
            }
            return true;
          };
          if (once()) return;
          if (host.__lgDrainMountTimer) {
            try { clearInterval(host.__lgDrainMountTimer); } catch (e) {}
          }
          let n = 0;
          host.__lgDrainMountTimer = setInterval(() => {
            n += 1;
            if (once() || n > 40) {
              try { clearInterval(host.__lgDrainMountTimer); } catch (e) {}
              host.__lgDrainMountTimer = 0;
            }
          }, 50);
        };
        /* ADR 0055 — hue from hvac_action, fallback entity.state (cool/heat/neutral). */
        const __lgDrainAttrs = (entity && entity.attributes) || {};
        const __lgDrainAction = String(__lgDrainAttrs.hvac_action || '').toLowerCase();
        const __lgDrainMode = String((entity && entity.state) || 'off').toLowerCase();
        const __lgDrainPowered = __lgDrainMode !== 'off'
          && __lgDrainMode !== 'unavailable'
          && __lgDrainMode !== 'unknown';
        const __lgHueFromAction = (() => {
          if (__lgDrainAction === 'cooling') return 'cool';
          if (__lgDrainAction === 'heating') return 'heat';
          if (__lgDrainAction === 'fan' || __lgDrainAction === 'fan_only'
            || __lgDrainAction === 'dry' || __lgDrainAction === 'idle') {
            return 'neutral';
          }
          return '';
        })();
        const __lgDrainHue = __lgHueFromAction
          || (__lgDrainMode === 'cool' ? 'cool'
            : (__lgDrainMode === 'heat' ? 'heat' : 'neutral'));
        this.style.setProperty('--lg_color_climate_timer_conic_active',
          `var(--lg_color_climate_timer_conic_fill_${__lgDrainHue})`);
        this.style.setProperty('--lg_color_climate_timer_conic_active_glow',
          `var(--lg_color_climate_timer_conic_glow_${__lgDrainHue})`);
        /* Dormant Watch Bezel ticks always on powered main layer (ADR 0055 IDLE).
           Progress arc stays opacity 0 until armed/running (t > 0). */
        const __lgDrainShow = !!(__lgDrainPowered
          && this.classList.contains('lg-wheel-layer-main')
          && !this.classList.contains('lg-wheel-layer-mode')
          && !this.classList.contains('lg-wheel-layer-fan')
          && !(__lgWantManage || __lgWantRadial)
          && !(this.classList.contains('lg-wheel-temp-open') || this.classList.contains('lg-wheel-temp-arming')));
        if (!__lgDrainPowered) {
          this.classList.remove('lg-timer-threshold-warn', 'lg-timer-completion');
        }
        __lgSyncDrain(this, __lgDrainT, __lgDrainShow);
        if (this.__lgTimerDrainTick) {
          clearInterval(this.__lgTimerDrainTick);
          this.__lgTimerDrainTick = null;
        }
        const __lgDrainHideCheck = (h) => !!(h.classList.contains('lg-timer-manage-open')
          || (h.getAttribute && h.getAttribute('data-lg-timer-manage') === '1')
          || h.classList.contains('lg-timer-radial-open')
          || (h.getAttribute && h.getAttribute('data-lg-timer-radial') === '1')
          || h.classList.contains('lg-power-idle-off')
          || h.classList.contains('lg-power-unavailable')
          || !h.classList.contains('lg-wheel-layer-main')
          || h.classList.contains('lg-wheel-layer-mode')
          || h.classList.contains('lg-wheel-layer-fan')
          || h.classList.contains('lg-wheel-temp-open')
          || h.classList.contains('lg-wheel-temp-arming'));
        if (running && tEnt && tEnt.state === 'active') {
          const __lgDrainHost = this;
          this.__lgTimerDrainTick = setInterval(() => {
            const fin = __lgDrainHost.__lgTimerDrainFinishesAt;
            const dur = __lgDrainHost.__lgTimerDrainDurSec || 0;
            if (!fin || !dur) return;
            const ms = new Date(fin).getTime() - Date.now();
            const rem = Number.isFinite(ms) ? Math.max(0, Math.floor(ms / 1000)) : 0;
            const t = Math.max(0, Math.min(1, rem / dur));
            __lgDrainHost.style.setProperty('--lg_timer_drain_t', String(t));
            __lgSyncDrain(__lgDrainHost, t, !__lgDrainHideCheck(__lgDrainHost));
          }, 1000);
        } else if (armed) {
          const __lgDrainHost = this;
          this.__lgTimerDrainTick = setInterval(() => {
            const rem = __lgClockRemSec(__lgDrainHost.__lgTimerDrainClockState);
            let initial = __lgDrainHost.__lgTimerDrainClockInitial || Math.max(rem, 1);
            if (rem > initial) {
              initial = rem;
              __lgDrainHost.__lgTimerDrainClockInitial = initial;
            }
            const t = Math.max(0, Math.min(1, rem / initial));
            __lgDrainHost.style.setProperty('--lg_timer_drain_t', String(t));
            __lgSyncDrain(__lgDrainHost, t, !__lgDrainHideCheck(__lgDrainHost));
          }, 1000);
        }
{%- endmacro %}
