        /* Idle/Active glow: release curve as default; :active swaps to press-down. */
        transition: var(--lg_transition_climate_node_state), var(--lg_transition_climate_node_press_release);
        filter: ${(__lgPowerLoad && !(__lgPowerRec && (__lgPowerRec.phase === 'optimistic_off' || __lgPowerRec.phase === 'shutdown')))
          ? 'var(--lg_filter_climate_wheel_seg_idle_lift)'
          : (__lgNodeDisabled || (__lgPeripheralDisabled && !__lgPowerLoad)
            ? 'var(--lg_filter_climate_node_disabled)'
            : 'var(--lg_filter_climate_wheel_seg_idle_lift)')};
        opacity: ${(__lgPowerLoad && (__lgPowerRec && (__lgPowerRec.phase === 'optimistic_off' || __lgPowerRec.phase === 'shutdown')))
          ? 'var(--lg_opacity_climate_power_optimistic_off_seg)'
          : (__lgNodeDisabled || (__lgPeripheralDisabled && !__lgPowerLoad)
            ? 'var(--lg_opacity_climate_node_disabled)'
            : '1')};
        ${(__lgPowerLoad && __lgSegVisible && (__lgPowerRec && (__lgPowerRec.phase === 'optimistic_on' || __lgPowerRec.phase === 'init')))
          ? `animation: lg_power_skel_pass var(--lg_duration_climate_power_skel) ease-in-out infinite; animation-delay: calc(${__lgSegIdx} * var(--lg_delay_climate_power_skel_step));`
          : 'animation: none;'}
      }
      @keyframes lg_power_skel_pass {
        0%, 100% { opacity: var(--lg_opacity_climate_power_skel_dim); }
        45%, 55% { opacity: var(--lg_opacity_climate_power_skel_lit); }
      }
      /* Spring Press (ADR 0028 / 0034): #card spans the FULL annulus box
         (inset:0 / 100%x100%, clip-path only trims the visible wedge), so its
         default transform-origin (center) IS the disk's own hub — scaling
         here reads as the wedge compressing toward the wheel center, the same
         proven pattern already used by lg_climate_round_btn_shell_extra_styles
         for the setpoint/arc-dial round buttons (#card:active there). :active
         is retained for the held pointer regardless of the shrink, per
         standard UA press-capture behavior — no separate JS pointer tracking
         needed. Own press-scale token (not lg_transform_climate_press_scale)
         so this doesn't retune the already-shipped round-button feel.
         Press-down ~100ms; release uses the default overshoot curve (~300ms). */
      #card:active {
        transition: var(--lg_transition_climate_node_press_down);
        transform: var(--lg_transform_climate_wheel_seg_press_scale);
        opacity: var(--lg_opacity_climate_press);
        filter: var(--lg_filter_climate_press);
      }
      /* Press shadow reduce on the glass fill (not wrapper) — keeps ADR 0031
         backdrop-filter ancestors free of transform/filter during morph. */
      #card:active #liquid_clip {
        box-shadow: var(--lg_shadow_climate_wheel_seg_press) !important;
      }
      /* Desktop hover: micro-elevation via inset highlight + lighter opacity
         (filter/box-shadow on #liquid_clip itself — ADR 0031-safe). */
      @media (hover: hover) and (pointer: fine) {
        #card:hover:not(:active) #liquid_clip {
          box-shadow: var(--lg_shadow_climate_wheel_seg), var(--lg_glow_climate_wheel_seg_hover_inset) !important;
          opacity: var(--lg_opacity_climate_wheel_seg_hover);
        }
      }
      /* Switch-like liquid glass (climate-scoped frost + lg_shadow_liquid mirror)
         + annular mask. Single-layer fill — multi-layer + plus-lighter broke
         mask-composite on quiet/turbo (ghost icons / sparse wedges). */
      #liquid_clip {
        position: absolute !important;
        inset: 0 !important;
        border-radius: 0 !important;
        overflow: hidden !important;
        background: var(--lg_color_climate_wheel_seg_frost) !important;
        backdrop-filter: blur(var(--lg_blur_climate_wheel_seg)) saturate(var(--lg_saturate_glass));
        -webkit-backdrop-filter: blur(var(--lg_blur_climate_wheel_seg)) saturate(var(--lg_saturate_glass));
        box-shadow: var(--lg_shadow_climate_wheel_seg) !important;
        pointer-events: none !important;
        z-index: 0 !important;
        /* Layer 1 conic = full sector span. Layer 2 radial = annulus.
           Layers 3+4 = constant-width strips centred on the two boundary rays;
           intersecting them subtracts a gap of exactly
           lg_size_climate_wheel_seg_gap regardless of radius (each neighbour
           gives up half of it). A linear-gradient's line runs through the box
           centre, so the 50%+/-half-gap band is exactly the boundary ray.
           Requires span < 180deg (true for N >= 3) so the opposite ray of each
           infinite strip never crosses this sector. */
        -webkit-mask-image:
          conic-gradient(
            from calc(-0.5 * ${__lgSegFill} * 1deg),
            #000 0deg,
            #000 calc(${__lgSegFill} * 1deg),
            transparent calc(${__lgSegFill} * 1deg)
          ),
          radial-gradient(
            closest-side,
            transparent var(--lg_wheel_inner_pct),
            #000 calc(var(--lg_wheel_inner_pct) + 0.05%),
            #000 var(--lg_wheel_outer_pct),
            transparent calc(var(--lg_wheel_outer_pct) + 0.05%)
          ),
          linear-gradient(
            ${__lgBndA}deg,
            #000 calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2)),
            #000 calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2))
          ),
          linear-gradient(
            ${__lgBndB}deg,
            #000 calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2)),
            #000 calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2))
          );
        mask-image:
          conic-gradient(
            from calc(-0.5 * ${__lgSegFill} * 1deg),
            #000 0deg,
            #000 calc(${__lgSegFill} * 1deg),
            transparent calc(${__lgSegFill} * 1deg)
          ),
          radial-gradient(
            closest-side,
            transparent var(--lg_wheel_inner_pct),
            #000 calc(var(--lg_wheel_inner_pct) + 0.05%),
            #000 var(--lg_wheel_outer_pct),
            transparent calc(var(--lg_wheel_outer_pct) + 0.05%)
          ),
          linear-gradient(
            ${__lgBndA}deg,
            #000 calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2)),
            #000 calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2))
          ),
          linear-gradient(
            ${__lgBndB}deg,
            #000 calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% - (var(--lg_size_climate_wheel_seg_gap) / 2)),
            transparent calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2)),
            #000 calc(50% + (var(--lg_size_climate_wheel_seg_gap) / 2))
          );
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }
      #container {
        position: absolute !important;
        inset: 0 !important;
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        pointer-events: none !important;
        overflow: visible !important;
      }
      /* Icon box on annular midline; counter-rotate so glyph stays upright.
         Flex H+V center (analyzer §0e) + overflow:visible mitigates iOS WebKit
         mask crop on secondary Modes/Power layers when sector fill is tight. */
      #img-cell {
        position: absolute !important;
        left: 50% !important;
        top: ${__lgIconTop}% !important;
        width: var(--lg_size_climate_wheel_seg_icon) !important;
        height: var(--lg_size_climate_wheel_seg_icon) !important;
        max-width: var(--lg_size_climate_wheel_seg_icon) !important;
        max-height: var(--lg_size_climate_wheel_seg_icon) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        overflow: visible !important;
        transform: translate(-50%, -50%) rotate(calc(-1 * ${__lgSegRot}deg)) !important;
        pointer-events: none !important;
        z-index: 2 !important;
      }
      #icon,
      #icon ha-icon,
      #icon ha-svg-icon {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        place-content: center !important;
        place-items: center !important;
        line-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      #icon {
        width: var(--lg_size_climate_wheel_seg_icon) !important;
        height: var(--lg_size_climate_wheel_seg_icon) !important;
        max-width: var(--lg_size_climate_wheel_seg_icon) !important;
        max-height: var(--lg_size_climate_wheel_seg_icon) !important;
        --mdc-icon-size: var(--lg_size_climate_wheel_seg_icon);
        transform: none !important;
        color: var(--lg_color_climate_wheel_seg_icon) !important;
        filter: var(--lg_filter_climate_wheel_seg_icon);
        opacity: var(--lg_opacity_climate_wheel_seg_icon_idle);
      }
      #icon ha-svg-icon svg {
        display: block !important;
        margin: 0 auto !important;
        overflow: visible !important;
      }
      @media (max-width: 48rem) {
        #img-cell, #icon {
          width: var(--lg_size_climate_wheel_seg_icon_phone) !important;
          height: var(--lg_size_climate_wheel_seg_icon_phone) !important;
          max-width: var(--lg_size_climate_wheel_seg_icon_phone) !important;
          max-height: var(--lg_size_climate_wheel_seg_icon_phone) !important;
          --mdc-icon-size: var(--lg_size_climate_wheel_seg_icon_phone);
        }
      }
      #name, #label, #state { display: none !important; }
{%- endmacro %}

{# Propagate / clear TEMP focus on thermostat + room hosts (composed tree).
   open_expr MUST be Jinja-emitted ({{ open_expr }}) — never ${open_expr}: that
   literal survives build and breaks button-card new Function (Unexpected token '{').
   ADR 0030: the class ONLY drives same-card chrome (title hide, Power↔Cancel).
   Sibling .lg-climate-room-host cards stay visible AND interactive — there is
   no sibling-hide walk and no TEMP frost; abort is Cancel (X) only.
   Also toggle .lg-temp-focus on the nested climate_room_off button-card host
   so Power→X uses :host(.lg-temp-focus) (Safari/HA WebView has no :host-context). #}
{% macro lg_climate_temp_focus_set_js(open_expr) -%}
        (() => {
          const __lgOpen = !!({{ open_expr }});
          const __lgCP = (el) => {
            if (!el) return null;
            if (el.parentElement) return el.parentElement;
            const rn = el.getRootNode && el.getRootNode();
            return (rn && rn.host) || null;
          };
          const __lgFindButtonCard = (root, depth) => {
            if (!root || depth > 8) return null;
            if (root.querySelector) {
              const direct = root.querySelector('button-card');
              if (direct) return direct;
            }
            const kids = root.querySelectorAll ? root.querySelectorAll('*') : [];
            for (const el of kids) {
              if (el.shadowRoot) {
                const found = __lgFindButtonCard(el.shadowRoot, depth + 1);
                if (found) return found;
              }
            }
            return null;
          };
          const __lgSyncCorner = (roomHost) => {
            if (!roomHost || !roomHost.shadowRoot) return;
            const corner = roomHost.shadowRoot.querySelector('#corner');
            if (!corner) return;
            const offHost = __lgFindButtonCard(corner, 0)
              || (corner.shadowRoot && __lgFindButtonCard(corner.shadowRoot, 0));
            if (offHost && offHost.classList) {
              offHost.classList.add('lg-room-off-host');
              offHost.classList.toggle('lg-temp-focus', __lgOpen);
            }
          };
          let __lgScope = __lgCP(this);
          for (let __i = 0; __i < 24 && __lgScope; __i++) {
            if (__lgScope.classList
                && (__lgScope.classList.contains('lg-thermostat-host')
                    || __lgScope.classList.contains('lg-climate-room-host'))) {
              __lgScope.classList.toggle('lg-temp-focus', __lgOpen);
              if (__lgScope.classList.contains('lg-climate-room-host')) {
                __lgSyncCorner(__lgScope);
              }
            }
            __lgScope = __lgCP(__lgScope);
          }
        })();
{%- endmacro %}

{# One-shot compositor kick for backdrop-filter after TEMP open/close only
   (not every extra_styles re-render — that would flicker glass). #}
{% macro lg_climate_blur_kick_js() -%}
        (() => {
          const __lgCP = (el) => {
            if (!el) return null;
            if (el.parentElement) return el.parentElement;
            const rn = el.getRootNode && el.getRootNode();
            return (rn && rn.host) || null;
          };
          let __lgScope = __lgCP(this);
          for (let __i = 0; __i < 24 && __lgScope; __i++) {
            if (__lgScope.classList
                && (__lgScope.classList.contains('lg-thermostat-host')
                    || __lgScope.classList.contains('lg-climate-room-host')
                    || __lgScope.classList.contains('lg-climate-floor-host'))) {
              __lgScope.classList.remove('lg-blur-kick');
              void __lgScope.offsetWidth;
              __lgScope.classList.add('lg-blur-kick');
              const __lgKickEl = __lgScope;
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  if (__lgKickEl && __lgKickEl.classList) {
                    __lgKickEl.classList.remove('lg-blur-kick');
                  }
                });
              });
            }
            __lgScope = __lgCP(__lgScope);
          }
        })();
{%- endmacro %}

{# One-shot cold-load compositor kick on climate room/floor hosts (first paint). #}
{% macro lg_climate_blur_cold_kick_js() -%}
        if (!this.__lgBlurColdKicked) {
          this.__lgBlurColdKicked = true;
          this.classList.remove('lg-blur-kick');
          void this.offsetWidth;
          this.classList.add('lg-blur-kick');
          const __lgColdKickEl = this;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (__lgColdKickEl && __lgColdKickEl.classList) {
                __lgColdKickEl.classList.remove('lg-blur-kick');
              }
            });
          });
        }
{%- endmacro %}
