{# ADR 0032 — Klimat wheel TIMER_CONFIG / TIMER_MANAGE / TIMER_ACTIVE chrome.
   Injected into climate_global_wheel extra_styles to keep the host file under
   ADR 0000's 800-line atomic limit. #}
{% macro lg_climate_wheel_timer_fsm_extra_styles() -%}
      /* ADR 0032 — timer radial (TIMER_CONFIG) / manage (TIMER_MANAGE) open:
         frost-free, hide segments; mutex with TEMP and with each other.
         Gate on data-* AND class: button-card can wipe host classList on
         timer ticks while data-lg-timer-* attributes survive (H8). */
      :host(.lg-timer-radial-open),
      :host([data-lg-timer-radial="1"]),
      :host(.lg-timer-manage-open),
      :host([data-lg-timer-manage="1"]) {
        filter: none !important;
      }
      /* ADR 0032: #timer_frost permanently inert (A1 / TEMP mirror). */
      #timer_frost,
      :host(.lg-timer-radial-open) #timer_frost,
      :host([data-lg-timer-radial="1"]) #timer_frost {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: auto !important;
        bottom: auto !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        z-index: 40 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transition: none !important;
      }
      #timer_frost > *,
      :host(.lg-timer-radial-open) #timer_frost > *,
      :host([data-lg-timer-radial="1"]) #timer_frost > * {
        pointer-events: none !important;
      }
      #timer_radial,
      #timer_manage {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: var(--lg_size_climate_timer_radial_w) !important;
        height: var(--lg_size_climate_timer_radial_w) !important;
        z-index: 47 !important;
        display: none !important;
        pointer-events: none !important;
      }
      /* Inline CSS vars (--lg_fsm_*) are SoT across classList wipes. */
      #timer_radial {
        display: var(--lg_fsm_radial_display, none) !important;
        pointer-events: var(--lg_fsm_radial_pe, none) !important;
      }
      #timer_manage {
        display: var(--lg_fsm_manage_display, none) !important;
        pointer-events: var(--lg_fsm_manage_pe, none) !important;
      }
      :host(.lg-timer-radial-open) #timer_radial,
      :host([data-lg-timer-radial="1"]) #timer_radial {
        display: block !important;
        pointer-events: auto !important;
      }
      :host(.lg-timer-manage-open) #timer_manage,
      :host([data-lg-timer-manage="1"]) #timer_manage {
        display: block !important;
        pointer-events: auto !important;
      }
      @media (max-width: 48rem) {
        #timer_radial,
        #timer_manage {
          width: var(--lg_size_climate_timer_radial_w_phone) !important;
          height: var(--lg_size_climate_timer_radial_w_phone) !important;
        }
      }
      /* Beat :host(.lg-wheel-layer-*) #slot { display:block } — compound
         host selectors out-spec that rule so DEFAULT segments stay hidden
         even if classList briefly loses .lg-timer-*-open. */
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #quiet_btn,
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #fan_entry,
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #turbo_btn,
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #timer_slot,
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #swing_h,
      :host(.lg-wheel-layer-main.lg-timer-radial-open) #mode_entry,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #quiet_btn,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #fan_entry,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #turbo_btn,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #timer_slot,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #swing_h,
      :host(.lg-wheel-layer-main[data-lg-timer-radial="1"]) #mode_entry,
      :host(.lg-timer-radial-open) #quiet_btn,
      :host(.lg-timer-radial-open) #fan_entry,
      :host(.lg-timer-radial-open) #turbo_btn,
      :host(.lg-timer-radial-open) #timer_slot,
      :host(.lg-timer-radial-open) #swing_h,
      :host(.lg-timer-radial-open) #swing_v,
      :host(.lg-timer-radial-open) #mode_entry,
      :host(.lg-timer-radial-open) #back_fan,
      :host(.lg-timer-radial-open) #fan_auto,
      :host(.lg-timer-radial-open) #fan_low,
      :host(.lg-timer-radial-open) #fan_med,
      :host(.lg-timer-radial-open) #fan_high,
      :host(.lg-timer-radial-open) #back_mode,
      :host(.lg-timer-radial-open) #mode_cool,
      :host(.lg-timer-radial-open) #mode_heat,
      :host(.lg-timer-radial-open) #mode_dry,
      :host(.lg-timer-radial-open) #mode_fan_only,
      :host(.lg-timer-radial-open) #mode_auto,
      :host(.lg-timer-radial-open) #trigger,
      :host([data-lg-timer-radial="1"]) #quiet_btn,
      :host([data-lg-timer-radial="1"]) #fan_entry,
      :host([data-lg-timer-radial="1"]) #turbo_btn,
      :host([data-lg-timer-radial="1"]) #timer_slot,
      :host([data-lg-timer-radial="1"]) #swing_h,
      :host([data-lg-timer-radial="1"]) #swing_v,
      :host([data-lg-timer-radial="1"]) #mode_entry,
      :host([data-lg-timer-radial="1"]) #back_fan,
      :host([data-lg-timer-radial="1"]) #fan_auto,
      :host([data-lg-timer-radial="1"]) #fan_low,
      :host([data-lg-timer-radial="1"]) #fan_med,
      :host([data-lg-timer-radial="1"]) #fan_high,
      :host([data-lg-timer-radial="1"]) #back_mode,
      :host([data-lg-timer-radial="1"]) #mode_cool,
      :host([data-lg-timer-radial="1"]) #mode_heat,
      :host([data-lg-timer-radial="1"]) #mode_dry,
      :host([data-lg-timer-radial="1"]) #mode_fan_only,
      :host([data-lg-timer-radial="1"]) #mode_auto,
      :host([data-lg-timer-radial="1"]) #trigger,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #quiet_btn,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #fan_entry,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #turbo_btn,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #timer_slot,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #swing_h,
      :host(.lg-wheel-layer-main.lg-timer-manage-open) #mode_entry,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #quiet_btn,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #fan_entry,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #turbo_btn,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #timer_slot,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #swing_h,
      :host(.lg-wheel-layer-main[data-lg-timer-manage="1"]) #mode_entry,
      :host(.lg-timer-manage-open) #quiet_btn,
      :host(.lg-timer-manage-open) #fan_entry,
      :host(.lg-timer-manage-open) #turbo_btn,
      :host(.lg-timer-manage-open) #timer_slot,
      :host(.lg-timer-manage-open) #swing_h,
      :host(.lg-timer-manage-open) #swing_v,
      :host(.lg-timer-manage-open) #mode_entry,
      :host(.lg-timer-manage-open) #back_fan,
      :host(.lg-timer-manage-open) #fan_auto,
      :host(.lg-timer-manage-open) #fan_low,
      :host(.lg-timer-manage-open) #fan_med,
      :host(.lg-timer-manage-open) #fan_high,
      :host(.lg-timer-manage-open) #back_mode,
      :host(.lg-timer-manage-open) #mode_cool,
      :host(.lg-timer-manage-open) #mode_heat,
      :host(.lg-timer-manage-open) #mode_dry,
      :host(.lg-timer-manage-open) #mode_fan_only,
      :host(.lg-timer-manage-open) #mode_auto,
      :host(.lg-timer-manage-open) #trigger,
      :host([data-lg-timer-manage="1"]) #quiet_btn,
      :host([data-lg-timer-manage="1"]) #fan_entry,
      :host([data-lg-timer-manage="1"]) #turbo_btn,
      :host([data-lg-timer-manage="1"]) #timer_slot,
      :host([data-lg-timer-manage="1"]) #swing_h,
      :host([data-lg-timer-manage="1"]) #swing_v,
      :host([data-lg-timer-manage="1"]) #mode_entry,
      :host([data-lg-timer-manage="1"]) #back_fan,
      :host([data-lg-timer-manage="1"]) #fan_auto,
      :host([data-lg-timer-manage="1"]) #fan_low,
      :host([data-lg-timer-manage="1"]) #fan_med,
      :host([data-lg-timer-manage="1"]) #fan_high,
      :host([data-lg-timer-manage="1"]) #back_mode,
      :host([data-lg-timer-manage="1"]) #mode_cool,
      :host([data-lg-timer-manage="1"]) #mode_heat,
      :host([data-lg-timer-manage="1"]) #mode_dry,
      :host([data-lg-timer-manage="1"]) #mode_fan_only,
      :host([data-lg-timer-manage="1"]) #mode_auto,
      :host([data-lg-timer-manage="1"]) #trigger {
        display: none !important;
        pointer-events: none !important;
        opacity: 0 !important;
      }
      :host(.lg-wheel-timer-active) #timer_slot #liquid_clip {
        /* Mode-colored contour is owned by climate_wheel_timer_btn extra_styles;
           keep base 3D rim here only (no saturate/brightness fill wash). */
        filter: none;
      }
      /* ADR 0044 — TIMER_ACTIVE outer drain = Ambient Conic + static ticks. */
      #timer_drain {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        width: var(--lg_size_climate_timer_drain_box) !important;
        height: var(--lg_size_climate_timer_drain_box) !important;
        transform: translate(-50%, -50%) !important;
        z-index: 45 !important;
        pointer-events: none !important;
        display: none !important;
        opacity: 0 !important;
        overflow: visible !important;
        transition: var(--lg_transition_climate_radial_morph);
      }
      @media (max-width: 48rem) {
        #timer_drain {
          width: var(--lg_size_climate_timer_drain_box_phone) !important;
          height: var(--lg_size_climate_timer_drain_box_phone) !important;
        }
      }
      :host(.lg-wheel-timer-active) #timer_drain {
        display: block !important;
        opacity: 1 !important;
      }
      :host(.lg-timer-radial-open) #timer_drain,
      :host([data-lg-timer-radial="1"]) #timer_drain,
      :host(.lg-timer-manage-open) #timer_drain,
      :host([data-lg-timer-manage="1"]) #timer_drain,
      :host(.lg-wheel-temp-open) #timer_drain,
      :host(.lg-wheel-temp-arming) #timer_drain {
        display: none !important;
        opacity: 0 !important;
      }
      #timer_drain .lg-timer-conic-host {
        position: relative !important;
        width: 100% !important;
        height: 100% !important;
      }
      #timer_drain .lg-timer-conic-fill {
        position: absolute !important;
        inset: 0 !important;
        border-radius: 50% !important;
        pointer-events: none !important;
        z-index: 1 !important;
        background: conic-gradient(
          from -90deg,
          var(--lg_color_climate_timer_conic_fill) 0 calc(var(--lg_timer_drain_t, 0) * 360deg),
          transparent calc(var(--lg_timer_drain_t, 0) * 360deg) 360deg
        );
        -webkit-mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--lg_size_climate_timer_conic_ring_pct)),
          #000 calc(100% - var(--lg_size_climate_timer_conic_ring_pct) + 0.5%),
          #000 100%
        );
        mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--lg_size_climate_timer_conic_ring_pct)),
          #000 calc(100% - var(--lg_size_climate_timer_conic_ring_pct) + 0.5%),
          #000 100%
        );
        filter: drop-shadow(0 0 0.35rem var(--lg_color_climate_timer_conic_glow));
        transition: var(--lg_transition_climate_timer_state_morph);
      }
      :host(.lg-timer-threshold-warn) #timer_drain .lg-timer-conic-fill {
        background: conic-gradient(
          from -90deg,
          var(--lg_color_climate_timer_conic_fill_warn) 0 calc(var(--lg_timer_drain_t, 0) * 360deg),
          transparent calc(var(--lg_timer_drain_t, 0) * 360deg) 360deg
        );
        filter: drop-shadow(0 0 0.4rem var(--lg_color_climate_timer_conic_glow_warn));
      }
      #timer_drain .lg-timer-conic-edge {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        width: var(--lg_size_climate_timer_leading_edge) !important;
        height: var(--lg_size_climate_timer_leading_edge) !important;
        border-radius: 50% !important;
        pointer-events: none !important;
        z-index: 2 !important;
        background: var(--lg_color_climate_timer_conic_fill);
        box-shadow: 0 0 var(--lg_blur_climate_timer_leading_edge) var(--lg_color_climate_timer_conic_glow);
        filter: blur(calc(var(--lg_blur_climate_timer_leading_edge) * 0.35));
        transform: rotate(calc(var(--lg_timer_edge_deg, 0deg) - 90deg))
          translateY(calc(-1 * (50% - var(--lg_size_climate_timer_conic_ring_pct) * 0.35)))
          translate(-50%, -50%);
        transform-origin: center center;
        opacity: 0;
      }
      :host(.lg-timer-threshold-warn) #timer_drain .lg-timer-conic-edge {
        background: var(--lg_color_climate_timer_conic_fill_warn);
        box-shadow: 0 0 var(--lg_blur_climate_timer_leading_edge) var(--lg_color_climate_timer_conic_glow_warn);
        animation: lg_timer_edge_breath var(--lg_duration_climate_timer_threshold_breath) ease-in-out infinite;
      }
      @keyframes lg_timer_edge_breath {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      :host(.lg-timer-completion) #timer_drain .lg-timer-conic-fill {
        filter: brightness(2) drop-shadow(0 0 0.6rem var(--lg_color_climate_timer_conic_glow));
        animation: lg_timer_completion_flash var(--lg_duration_climate_timer_completion_flash) ease-out,
          lg_timer_completion_fade var(--lg_duration_climate_timer_completion_fade) ease-in 0.2s forwards;
      }
      @keyframes lg_timer_completion_flash {
        from { filter: brightness(1); }
        to { filter: brightness(2); }
      }
      @keyframes lg_timer_completion_fade {
        to { opacity: 0; }
      }
      #timer_drain svg {
        position: relative !important;
        z-index: 3 !important;
        width: 100% !important;
        height: 100% !important;
        display: block !important;
        overflow: visible !important;
        pointer-events: none !important;
      }
      #timer_drain .lg-timer-drain-tick {
        stroke: var(--lg_color_climate_timer_tick);
        stroke-linecap: round;
        fill: none;
        filter: none;
      }
      #timer_drain .lg-timer-drain__spark {
        display: none !important;
        opacity: 0 !important;
      }
{%- endmacro %}
