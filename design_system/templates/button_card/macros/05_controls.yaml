      #name {
        position: relative;
        z-index: 1;
        font-family: var(--lg_font_label_family);
        font-size: var(--lg_font_floor_btn_size);
        font-weight: var(--lg_font_body_weight);
        letter-spacing: var(--lg_font_body_tracking);
        -webkit-font-smoothing: var(--lg_font_smoothing);
        -moz-osx-font-smoothing: var(--lg_font_smoothing_moz);
        justify-self: center !important;
        align-self: center !important;
        text-align: center !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      #liquid_clip {
        position: absolute;
        inset: 0;
        border-radius: var(--lg_radius_liquid);
        overflow: hidden;
        clip-path: inset(0 round var(--lg_radius_liquid));
        isolation: isolate;
        pointer-events: none;
        z-index: 0;
        background: var(--lg_color_disable_frost), var(--lg_color_liquid_base);
        background-blend-mode: normal, plus-lighter;
        backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
        -webkit-backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
        box-shadow: var(--lg_shadow_liquid);
      }
{%- endmacro %}
{% macro lg_disable_room_layout_extra_styles() -%}
