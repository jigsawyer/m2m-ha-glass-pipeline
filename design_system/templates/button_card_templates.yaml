  # Dual-state Klimat timer control (replaces text pill):
  # idle → round timer icon (navigate Bubble popup);
  # active|paused → liquid countdown bar + pause/play + cancel + edit;
  # clock-armed → remaining HH:MM:SS + moving progress + pause (pause-clock script).
  # HA timer docs: idle|active|paused; pause/start/cancel actions.
  # Live countdown: finishes_at client tick (remaining not ticked by core).
  climate_timer_action_chip:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    tap_action:
      action: none
    extra_styles: |
      {{ lg_climate_round_btn_shell_extra_styles('--lg_size_climate_timer_action_chip_w', '--lg_size_climate_timer_action_chip_w_phone', '--lg_size_climate_timer_action_chip_icon', '--lg_size_climate_timer_action_chip_icon_phone') }}
