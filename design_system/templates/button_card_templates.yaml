  # ── Global liquid-glass game wheel (Klimat mode/fan SoT) ──────────────
  # Equal-fill annular game wheel around climate_setpoint_trigger.
  # Main N=6 (quiet/fan/turbo/timer/swingH/mode); fan N=5; mode N=6.
  # Back sits at the clicked entry index. HA services unchanged.

  climate_wheel_back_btn:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    icon: mdi:arrow-left
    variables:
      seg_index: 0
      seg_total: 6
      seg_slot: back_fan
    tap_action:
      action: javascript
      javascript: |
        [[[
          {{ lg_climate_wheel_set_layer_js("'main'") }}
        ]]]
    extra_styles: |
      [[[
        {{ lg_climate_wheel_seg_math_js() }}
        return `
      {{ lg_climate_wheel_slot_position_css() }}
      #icon { color: var(--lg_color_text) !important; opacity: 0.92; }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_wheel_menu_entry:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    variables:
      seg_index: 0
      seg_total: 6
      seg_slot: fan_entry
      wheel_layer: fan
    icon: |
      [[[
        const layer = (variables && variables.wheel_layer) || 'fan';
        if (layer === 'mode') {
          const mode = entity && entity.state;
          if (mode === 'cool') return 'mdi:snowflake';
          if (mode === 'heat') return 'mdi:fire';
          if (mode === 'dry') return 'mdi:water';
          if (mode === 'fan_only') return 'mdi:fan';
          if (mode === 'auto' || mode === 'heat_cool') return 'mdi:thermometer';
          return 'mdi:power';
        }
        const fm = entity && entity.attributes ? String(entity.attributes.fan_mode || '').toLowerCase() : '';
        if (fm === 'low') return 'mdi:weather-windy';
        if (fm === 'medium') return 'mdi:gauge';
        if (fm === 'high') return 'mdi:gauge-full';
        return 'mdi:fan';
      ]]]
    tap_action:
      action: javascript
      javascript: |
        [[[
          {{ lg_climate_wheel_set_layer_js("(variables && variables.wheel_layer) || 'fan'") }}
        ]]]
    extra_styles: |
      [[[
        {{ lg_climate_wheel_seg_math_js() }}
        const layer = (variables && variables.wheel_layer) || 'fan';
        let active = false;
        let color = 'var(--lg_color_text)';
        let glow = 'none';
        let iconFilter = 'none';
        if (layer === 'mode') {
          const mode = entity ? entity.state : 'off';
          active = mode === 'cool' || mode === 'heat' || mode === 'dry' || mode === 'fan_only' || mode === 'auto' || mode === 'heat_cool';
          color = mode === 'cool' ? 'var(--lg_color_climate_cool)' : mode === 'heat' ? 'var(--lg_color_climate_heat)' : 'var(--lg_color_text)';
          glow = mode === 'cool' ? 'var(--lg_glow_climate_cool)' : mode === 'heat' ? 'var(--lg_glow_climate_heat)' : active ? 'var(--lg_glow_climate_other)' : 'none';
          iconFilter = mode === 'cool' ? 'var(--lg_filter_climate_cool)' : mode === 'heat' ? 'var(--lg_filter_climate_heat)' : active ? 'var(--lg_filter_climate_other)' : 'none';
        } else {
          const fm = entity && entity.attributes ? String(entity.attributes.fan_mode || '').toLowerCase() : '';
          active = !!fm;
          glow = active ? 'var(--lg_glow_climate_other)' : 'none';
          iconFilter = active ? 'var(--lg_filter_climate_other)' : 'none';
          color = active ? 'var(--lg_color_climate_other)' : 'var(--lg_color_text)';
        }
        return `
      {{ lg_climate_wheel_slot_position_css() }}
      #icon { color: ${color} !important; filter: ${iconFilter}; opacity: ${active ? '1' : '0.85'}; }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_wheel_option_btn:
    show_icon: true
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    variables:
      seg_index: 0
      seg_total: 6
      seg_slot: ""
      check: state
      attrib: ""
      value: ""
      service: climate.set_hvac_mode
      data_key: hvac_mode
    tap_action:
      action: javascript
      javascript: |
        [[[
          {{ lg_climate_wheel_set_layer_js("'main'") }}
          const key = (variables && variables.data_key) || 'hvac_mode';
          const id = (entity && entity.entity_id) || '';
          const svc = (variables && variables.service) || 'climate.set_hvac_mode';
          const val = variables && variables.value;
          if (id && val !== undefined && val !== null && val !== '') {
            try {
              const parts = String(svc).split('.');
              const domain = parts[0];
              const service = parts.slice(1).join('.') || parts[0];
              const data = { entity_id: id };
              data[key] = val;
              hass.callService(domain, service, data);
            } catch (e) {}
          }
        ]]]
    extra_styles: |
      [[[
        {{ lg_climate_wheel_seg_math_js() }}
        const a = (entity && entity.attributes) || {};
        const active = variables.check === 'attrib'
          ? a[variables.attrib] === variables.value
          : entity && entity.state === variables.value;
        const mode = variables.value;
        const color = mode === 'cool'
          ? 'var(--lg_color_climate_cool)'
          : mode === 'heat'
            ? 'var(--lg_color_climate_heat)'
            : 'var(--lg_color_text)';
        const glow = !active
          ? 'none'
          : mode === 'cool'
            ? 'var(--lg_glow_climate_cool)'
            : mode === 'heat'
              ? 'var(--lg_glow_climate_heat)'
              : 'var(--lg_glow_climate_other)';
        const iconFilter = !active
          ? 'none'
          : mode === 'cool'
            ? 'var(--lg_filter_climate_cool)'
            : mode === 'heat'
              ? 'var(--lg_filter_climate_heat)'
              : 'var(--lg_filter_climate_other)';
        return `
      {{ lg_climate_wheel_slot_position_css() }}
      /* Active State Illumination (hyper-glass refresh): see
         climate_wheel_quiet_btn for the overflow:hidden / mask-image
         rationale for inset-only glow (the outer glow variable computed
         above would be silently clipped as a #liquid_clip box-shadow). */
      #liquid_clip {
        box-shadow: ${active
          ? 'var(--lg_shadow_climate_wheel_seg), var(--lg_glow_climate_wheel_seg_on_inset)'
          : 'var(--lg_shadow_climate_wheel_seg)'} !important;
        filter: ${active ? 'var(--lg_filter_climate_wheel_seg_on)' : 'none'};
      }
      #icon {
        color: ${active ? color : 'var(--lg_color_text)'} !important;
        filter: ${iconFilter};
        opacity: ${active ? '1' : '0.78'};
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_wheel_quiet_btn:
    template: climate_quiet_btn
    variables:
      seg_index: 0
      seg_total: 6
      seg_slot: quiet
    extra_styles: |
      [[[
        {{ lg_climate_wheel_seg_math_js() }}
        const on = entity && entity.state === 'on';
        const gateId = variables && variables.gate_entity_id;
        const gateStates = (variables && variables.gate_states) || [];
        let gated = false;
        if (gateId && gateStates.length) {
          const gEnt = states[gateId];
          const gState = gEnt && gEnt.state;
          gated = !gateStates.includes(gState);
        }
        const frost = on
          ? 'var(--lg_color_climate_frost_other)'
          : 'var(--lg_color_climate_wheel_seg_frost)';
        const hostOpacity = !__lgSegVisible
          ? '0'
          : (gated ? 'var(--lg_opacity_tab_side_disabled)' : '1');
        return `
      {{ lg_climate_wheel_slot_position_css() }}
      :host {
        opacity: ${hostOpacity} !important;
        visibility: ${__lgSegVisible ? 'visible' : 'hidden'} !important;
      }
      #card {
        pointer-events: ${gated || !__lgSegVisible ? 'none' : 'auto'} !important;
      }
      #liquid_clip {
        background: ${frost} !important;
        /* Active State Illumination (hyper-glass refresh): inset-only glow —
           an outer box-shadow here would be clipped away by this element's
           own overflow:hidden + mask-image (proven: see macro above), so the
           "on" state must read as light FROM INSIDE the glass, not a flat
           color swap. */
        box-shadow: ${on
          ? 'var(--lg_shadow_climate_wheel_seg), var(--lg_glow_climate_wheel_seg_on_inset)'
          : 'var(--lg_shadow_climate_wheel_seg)'} !important;
        filter: ${on ? 'var(--lg_filter_climate_wheel_seg_on)' : 'none'};
      }
      #icon {
        color: ${on ? 'var(--lg_color_climate_other)' : 'var(--lg_color_text)'} !important;
        opacity: ${on ? '1' : '0.72'};
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_wheel_turbo_btn:
    template: climate_turbo_btn
    variables:
      seg_index: 2
      seg_total: 6
      seg_slot: turbo
    extra_styles: |
      [[[
        {{ lg_climate_wheel_seg_math_js() }}
        const on = entity && entity.state === 'on';
        const gateId = variables && variables.gate_entity_id;
        const gateStates = (variables && variables.gate_states) || [];
        let gated = false;
        if (gateId && gateStates.length) {
          const gEnt = states[gateId];
          const gState = gEnt && gEnt.state;
          gated = !gateStates.includes(gState);
        }
        const frost = on
          ? 'var(--lg_color_climate_frost_other)'
          : 'var(--lg_color_climate_wheel_seg_frost)';
        const hostOpacity = !__lgSegVisible
          ? '0'
          : (gated ? 'var(--lg_opacity_tab_side_disabled)' : '1');
        return `
      {{ lg_climate_wheel_slot_position_css() }}
      :host {
        opacity: ${hostOpacity} !important;
        visibility: ${__lgSegVisible ? 'visible' : 'hidden'} !important;
      }
      #card {
        pointer-events: ${gated || !__lgSegVisible ? 'none' : 'auto'} !important;
      }
      #liquid_clip {
        background: ${frost} !important;
        /* Active State Illumination (hyper-glass refresh): see quiet_btn for
           the overflow:hidden / mask-image rationale for inset-only glow. */
        box-shadow: ${on
          ? 'var(--lg_shadow_climate_wheel_seg), var(--lg_glow_climate_wheel_seg_on_inset)'
          : 'var(--lg_shadow_climate_wheel_seg)'} !important;
        filter: ${on ? 'var(--lg_filter_climate_wheel_seg_on)' : 'none'};
      }
      #icon {
        color: ${on ? 'var(--lg_color_climate_other)' : 'var(--lg_color_text)'} !important;
        opacity: ${on ? '1' : '0.72'};
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_wheel_swing_btn:
    show_name: false
    show_icon: true
    show_state: false
    show_ripple: false
    variables:
      axis: vertical
      seg_index: 4
      seg_total: 6
      seg_slot: swing_h
    tap_action:
      action: call-service
      service: |
        [[[
          const axis = variables.axis || 'vertical';
          const a = (entity && entity.attributes) || {};
          const hModes = a.swing_horizontal_modes;
          if (axis === 'horizontal' && Array.isArray(hModes) && hModes.length) {
            return 'climate.set_swing_horizontal_mode';
          }
          return 'climate.set_swing_mode';
        ]]]
      target:
        entity_id: "[[[ return (entity && entity.entity_id) || '' ]]]"
      data: |
        [[[
          const axis = variables.axis || 'vertical';
          const a = (entity && entity.attributes) || {};
          const modes = Array.isArray(a.swing_modes) ? a.swing_modes : [];
          const hModes = Array.isArray(a.swing_horizontal_modes)
            ? a.swing_horizontal_modes
            : null;
          const pick = (list, cands) => {
            const lower = (list || []).map((m) => String(m).toLowerCase());
            for (const c of cands) {
              const i = lower.indexOf(String(c).toLowerCase());
              if (i >= 0) return list[i];
            }
            return null;
          };
          const axisOn = (mode, ax) => {
            const m = String(mode || '').toLowerCase();
            if (ax === 'vertical') {
              return m === 'vertical' || m === 'both' || m === 'on';
            }
            return m === 'horizontal' || m === 'both';
          };
          if (axis === 'horizontal' && hModes && hModes.length) {
            const curH = a.swing_horizontal_mode;
            const on = String(curH || '').toLowerCase() !== 'off' && !!curH;
            const next = on
              ? pick(hModes, ['off'])
