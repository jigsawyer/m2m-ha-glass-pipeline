          const __lgNext = (__lgWant === 'fan' || __lgWant === 'mode') ? __lgWant : 'main';
          let __lgScope = __lgCP(this);
          for (let __i = 0; __i < 16 && __lgScope; __i++) {
            if (__lgScope.classList && __lgScope.classList.contains('lg-wheel-host')) {
