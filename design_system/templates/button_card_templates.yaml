        --slider-track-color: var(--lg_color_climate_cc_track);
        --slider-color: ${fillColor};
        --slider-bg-color: ${fillColor};
        --slider-transition-duration: 0s;
        --state-color-on: var(--lg_color_climate_timer_slider_value);
        --state-color-off: var(--lg_color_climate_timer_slider_value);
        box-shadow: var(--lg_shadow_climate_cc_inset);
      }
      #hours_slider { grid-area: hs !important; }
      #minutes_slider { grid-area: ms !important; }
      #hours_shell { grid-area: hs !important; }
      #minutes_shell { grid-area: ms !important; }
      #hours_shell, #minutes_shell {
        position: relative;
        z-index: 3;
        width: var(--lg_size_climate_timer_pill_w_desktop) !important;
        height: var(--lg_size_climate_timer_pill_h_desktop) !important;
        justify-self: center !important;
        pointer-events: none !important;
      }
      #hours_shell .lg-climate-cc,
      #minutes_shell .lg-climate-cc {
        border-radius: var(--lg_radius_climate_timer_pill_desktop);
        clip-path: inset(0 round var(--lg_radius_climate_timer_pill_desktop));
      }
      #hours_shell .lg-climate-cc__frost,
      #minutes_shell .lg-climate-cc__frost,
      #hours_shell .lg-climate-cc__rim,
      #minutes_shell .lg-climate-cc__rim {
        border-radius: var(--lg_radius_climate_timer_pill_desktop);
      }
      #hours_slider slider-button-card,
      #minutes_slider slider-button-card {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }
        `;
      ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}
      hours_label: >
        [[[
          return `<span class="lg-climate-timer-slider-label">${variables.hours_label || 'Години'}</span>`;
        ]]]
      minutes_label: >
        [[[
          return `<span class="lg-climate-timer-slider-label">${variables.minutes_label || 'Хвилини'}</span>`;
        ]]]
      hours_shell: >
        {{ lg_climate_cc_shell_html() }}
      minutes_shell: >
        {{ lg_climate_cc_shell_html() }}
      # Prefer state object; fall back to parent config.entity / variables so
      # slider-button-card never receives '' when helpers exist but state unbound.
      hours_slider:
        card:
          type: custom:slider-button-card
          entity: "[[[ return (entity && entity.entity_id) || (this && this.config && this.config.entity) || (this && this._config && this._config.entity) || '' ]]]"
          show_name: false
          show_state: true
          compact: false
          icon:
            show: false
          action_button:
            show: false
          slider:
            direction: bottom-top
            background: solid
            use_state_color: false
            use_percentage_bg_opacity: false
            show_track: false
            force_square: false
      minutes_slider:
        card:
          type: custom:slider-button-card
          entity: "[[[ return (variables && variables.minutes_entity_id) || '' ]]]"
          show_name: false
          show_state: true
          compact: false
          icon:
            show: false
          action_button:
            show: false
          slider:
            direction: bottom-top
            background: solid
            use_state_color: false
            use_percentage_bg_opacity: false
            show_track: false
            force_square: false

  # Klimat Arc UI Rebuild (global change — replaces the retired 3-column grid
  # dock with a freeform stack: caption / controls row (hvac arc | setpoint
  # trigger | fan arc) / utility row / timer bar). Setpoint drag + pending-temp
  # binding live in climate_thermostat_ring_panel, nested in-place inside
  # climate_setpoint_trigger (analyzer.mdc §6, revised — no popup); this card
  # only owns the accent/glow caption coloring plus the same-room focus scrim.
  climate_thermostat:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    show_ripple: false
    variables:
      timer_entity_id: ""
      clock_entity_id: ""
      armed_entity_id: ""
      popup_hash: ""
      mode_entity_id: ""
      hours_entity_id: ""
      minutes_entity_id: ""
      clock_hour_entity_id: ""
      clock_minute_entity_id: ""
      remove_script_id: ""
      pause_clock_script_id: ""
      turbo_entity_id: ""
      quiet_entity_id: ""
    tap_action:
      action: none
    extra_styles: |
      [[[
        const mode = entity ? entity.state : 'off';
        const attrs = (entity && entity.attributes) || {};
        const action = attrs.hvac_action || '';
        const glow =
          action === 'heating' ? 'var(--lg_glow_climate_heat)' :
          action === 'cooling' ? 'var(--lg_glow_climate_cool)' :
          action === 'idle' && mode !== 'off' ? 'var(--lg_glow_climate_idle)' :
          mode === 'heat' ? 'var(--lg_glow_climate_heat)' :
          mode === 'cool' ? 'var(--lg_glow_climate_cool)' :
          mode !== 'off' ? 'var(--lg_glow_climate_other)' :
          'none';
        const timerId = variables && variables.timer_entity_id;
        const armedId = variables && variables.armed_entity_id;
        const tEnt = timerId ? states[timerId] : null;
        const running = tEnt && (tEnt.state === 'active' || tEnt.state === 'paused');
        const armed = !running && armedId && states[armedId] && states[armedId].state === 'on';
        this.classList.toggle('lg-timer-active', !!(running || armed));
        this.classList.add('lg-thermostat-host');
        const __lgWheelEl = this.shadowRoot && this.shadowRoot.querySelector('.lg-wheel-host');
        const __lgTempOpen = !!(__lgWheelEl && __lgWheelEl.classList.contains('lg-wheel-temp-open'));
        this.classList.toggle('lg-temp-focus', __lgTempOpen);
        return `
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        display: block;
        box-sizing: border-box;
        overflow: visible !important;
        background: transparent !important;
        box-shadow: none !important;
        margin-left: 0 !important;
        margin-right: auto !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
        --masonry-view-card-margin: 0;
      }
      ha-card {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
        border-radius: var(--lg_radius_liquid) !important;
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible !important;
        margin-left: 0 !important;
        margin-right: auto !important;
      }
      #container {
        display: grid !important;
        grid-template-areas:
          "wheel"
          "timer" !important;
        grid-template-columns: minmax(0, 1fr) !important;
        grid-template-rows: auto auto !important;
        justify-items: center !important;
        align-items: center !important;
        justify-content: center !important;
        place-content: start center !important;
        row-gap: var(--lg_space_climate_gap) !important;
        column-gap: 0 !important;
        padding: var(--lg_space_climate_pad) !important;
        box-sizing: border-box !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin-left: auto !important;
        margin-right: auto !important;
        position: relative !important;
      }
      #card {
        position: relative;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        border-radius: var(--lg_radius_liquid);
        background: transparent;
        box-shadow: ${glow};
        overflow: visible;
      }
      #name, #icon, #label, #state { display: none !important; }
      #wheel {
        grid-area: wheel !important;
        justify-self: center !important;
        align-self: center !important;
        position: relative;
        z-index: 1;
        width: 100% !important;
        max-width: 100% !important;
        display: flex !important;
        justify-content: center !important;
      }
      #timer_bar {
        grid-area: timer !important;
        width: min(100%, var(--lg_size_climate_timer_bar_w)) !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: auto !important;
        min-height: var(--lg_size_climate_timer_idle_w) !important;
        justify-self: center !important;
        align-self: center !important;
        overflow: visible !important;
        z-index: 1;
        position: relative;
        margin-top: 0 !important;
        display: none !important;
        justify-content: center !important;
        align-items: center !important;
      }
      :host(.lg-timer-active) #timer_bar {
        display: flex !important;
      }
      #timer_bar > * {
        width: auto !important;
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        margin: 0 auto !important;
        box-sizing: border-box !important;
        overflow: visible !important;
      }
      @media (max-width: 48rem) {
        #timer_bar {
          width: min(100%, var(--lg_size_climate_timer_bar_w_phone)) !important;
          min-height: var(--lg_size_climate_timer_bar_h) !important;
        }
      }
      /* TEMP red-box: hide under-wheel timer entirely (not merely dim). */
      :host(.lg-temp-focus) #timer_bar,
      #container:has(.lg-ring-trigger-expanded) #timer_bar {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        filter: none !important;
        transition: none !important;
      }
        `;
      ]]]
    custom_fields:
      wheel:
        card:
          type: custom:button-card
          template: climate_global_wheel
          entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
          variables:
            turbo_entity_id: "[[[ return (variables && variables.turbo_entity_id) || '' ]]]"
            quiet_entity_id: "[[[ return (variables && variables.quiet_entity_id) || '' ]]]"
            timer_entity_id: "[[[ return (variables && variables.timer_entity_id) || '' ]]]"
            popup_hash: "[[[ return (variables && variables.popup_hash) || '' ]]]"
            armed_entity_id: "[[[ return (variables && variables.armed_entity_id) || '' ]]]"
      timer_bar:
        card:
          type: custom:button-card
          template: climate_timer_active_bar
          entity: "[[[ return (variables && variables.timer_entity_id) || '' ]]]"
          variables:
            clock_entity_id: "[[[ return (variables && variables.clock_entity_id) || '' ]]]"
            armed_entity_id: "[[[ return (variables && variables.armed_entity_id) || '' ]]]"
            popup_hash: "[[[ return (variables && variables.popup_hash) || '' ]]]"
            mode_entity_id: "[[[ return (variables && variables.mode_entity_id) || '' ]]]"
            hours_entity_id: "[[[ return (variables && variables.hours_entity_id) || '' ]]]"
            minutes_entity_id: "[[[ return (variables && variables.minutes_entity_id) || '' ]]]"
            clock_hour_entity_id: "[[[ return (variables && variables.clock_hour_entity_id) || '' ]]]"
            clock_minute_entity_id: "[[[ return (variables && variables.clock_minute_entity_id) || '' ]]]"
            remove_script_id: "[[[ return (variables && variables.remove_script_id) || '' ]]]"
            pause_clock_script_id: "[[[ return (variables && variables.pause_clock_script_id) || '' ]]]"


  climate_floor_off_button:
    show_icon: true
    show_state: false
    show_ripple: false
    icon: mdi:power
    variables:
      ha_entity_ids: []
    extra_styles: |
      :host {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        height: var(--lg_size_floor_btn_h);
        max-height: var(--lg_size_floor_btn_h);
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        justify-self: stretch !important;
        box-sizing: border-box;
        margin-left: auto !important;
        margin-right: auto !important;
        background: transparent !important;
        box-shadow: none !important;
        filter: none !important;
        overflow: visible !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
      }
      ha-card {
        width: min(100%, var(--lg_size_floor_btn_w)) !important;
        max-width: min(100%, var(--lg_size_floor_btn_w)) !important;
        min-width: 0 !important;
        height: var(--lg_size_floor_btn_h) !important;
        max-height: var(--lg_size_floor_btn_h) !important;
        min-height: var(--lg_size_floor_btn_h) !important;
        aspect-ratio: unset !important;
        box-sizing: border-box;
        border-radius: var(--lg_radius_liquid) !important;
        overflow: visible !important;
        margin-left: auto !important;
        margin-right: auto !important;
        --ha-card-border-radius: var(--lg_radius_liquid) !important;
      }
      {{ lg_liquid_clip_shell_extra_styles() }}
      {{ lg_distort_shell_extra_styles() }}
      {{ lg_floor_disable_layout_extra_styles() }}
    tap_action:
      action: none
    hold_action:
      action: call-service
      service: climate.turn_off
      target: |
        [[[
          const ids = variables.ha_entity_ids;
          if (Array.isArray(ids) && ids.length) return { entity_id: ids };
          return {};
        ]]]
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}

  climate_house_off_button:
    show_name: false
    show_icon: true
    show_state: false
    show_ripple: false
    icon: mdi:power
    variables:
      ha_entity_ids: []
    tap_action:
      action: none
    hold_action:
      action: call-service
      service: climate.turn_off
      target: |
        [[[
          const ids = variables.ha_entity_ids;
          if (Array.isArray(ids) && ids.length) return { entity_id: ids };
          return {};
        ]]]
    extra_styles: |
      {{ lg_tab_side_btn_layout_extra_styles(disabled=false) }}
      /* Klimat-only idle rim — shared tab-side shell keeps transparent border
         for light dashboard isolation; climate house-off needs a readable
         hitbox outline matching arc glass stroke. */
      #card {
        border-width: var(--lg_stroke_climate_tab_side) !important;
        border-color: var(--lg_color_climate_tab_side_rim) !important;
      }
      .lg-liquid-clip-shell {
        position: absolute;
        inset: 0;
        border-radius: var(--lg_radius_tab_side_btn);
        overflow: hidden;
        clip-path: inset(0 round var(--lg_radius_tab_side_btn));
        pointer-events: none;
      }
    custom_fields:
      liquid_clip: >
        {{ lg_liquid_clip_shell_html() }}
      distort: ""
    state: []

  # Per-room AC off badge — sits in the climate_room_container top-right
  # corner (see the `corner` custom_field in
  # design_system/templates/layout/climate_room_container.yaml), NOT inside
  # climate_thermostat's own satellite constellation. Docs-native safety
  # pattern (analyzer.mdc "no accidental destructive taps"): hold_action
  # only, tap_action: none, same as disable_room_button/
  # climate_floor_off_button/climate_house_off_button — but climate-scoped
  # glow/color tokens (lg_glow_climate_room_off_press /
  # lg_color_climate_room_off_press), never the shared light lg_glow_disable
  # / lg_color_disable_icon (dashboard isolation, analyzer.mdc §Premium
  # safety + global.mdc §"Dashboard isolation").
  # Idle chrome = lg_climate_round_btn_shell (rim + #liquid_clip + §0e center).
  climate_room_off_button:
    show_name: false
    show_icon: true
    show_state: false
    show_ripple: false
    icon: mdi:power
    variables:
      ha_entity_ids: []
    tap_action:
      action: none
    hold_action:
      action: call-service
      service: climate.turn_off
      target: |
        [[[
          const ids = variables.ha_entity_ids;
          if (Array.isArray(ids) && ids.length) return { entity_id: ids };
          return {};
        ]]]
    extra_styles: |
      {{ lg_climate_round_btn_shell_extra_styles('--lg_size_climate_room_off_w', '--lg_size_climate_room_off_w_phone', '--lg_size_climate_room_off_icon', '--lg_size_climate_room_off_icon_phone') }}
      :host {
        margin: 0 !important;
        overflow: visible !important;
      }
      #icon {
        color: var(--lg_color_text) !important;
      }
      #card:active {
        box-shadow: var(--lg_glow_climate_room_off_press), var(--lg_shadow_climate_arc_sphere);
      }
      #card:active #icon {
        color: var(--lg_color_climate_room_off_press) !important;
      }
    custom_fields:
      liquid_clip: ""
