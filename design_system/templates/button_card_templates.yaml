        .lg-setpoint-stack__target::after { font-size: var(--lg_font_climate_setpoint_target_size_phone); }
        .lg-setpoint-stack__mode { font-size: var(--lg_font_climate_setpoint_mode_size_phone); }
      }
      /* Ring overlay — absolutely centered on the trigger via the SAME
         --lg_size_climate_ring_w token the ring panel sizes itself with (no
         separate offset token, so centering can never drift out of sync with
         the ring's own width). Same escape technique already proven by
         climate_arc_option_btn (position:absolute + transform inside a
         #card with overflow:hidden — the room-level #content overflow:visible
         is what actually lets it spill past the room panel, see
         climate_room_container). */
      #ring_overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--lg_size_climate_ring_w);
        height: var(--lg_size_climate_ring_w);
