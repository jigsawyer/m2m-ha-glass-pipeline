{# DynamicSegmentsGroup (analyzer §6b): N = count(visible) share 360° evenly.
   Math.sum(segment spans) === 360 always (N * (360/N)).
   Sectors fill their whole span; separators are constant-width strips carved by
   the #liquid_clip mask from lg_size_climate_wheel_seg_gap (a length, not deg).
   seg_slot + wheel-host classes recompute index/total when timer/swing hide.
   seg_index 0 starts at 12 o'clock. Fill centered in each span.
   Clip radii MUST match CSS mask tokens (closest-side % → box-% * 0.5).
   JS vars: __lgSegRot, __lgSegSpan, __lgSegFill, __lgClipPts, __lgIconTop,
   __lgBndA / __lgBndB (gap strip angles), __lgSegVisible. #}
