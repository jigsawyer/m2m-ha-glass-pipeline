{% macro lg_climate_wheel_seg_math_js() -%}
        const __lgComposedParent = (el) => {
          if (!el) return null;
          if (el.parentElement) return el.parentElement;
          const rn = el.getRootNode && el.getRootNode();
          return (rn && rn.host) || null;
        };
        let __lgWheel = null;
        let __lgScope = __lgComposedParent(this);
        for (let i = 0; i < 24 && __lgScope; i++) {
          if (__lgScope.classList && __lgScope.classList.contains('lg-wheel-host')) {
            __lgWheel = __lgScope;
            break;
          }
          __lgScope = __lgComposedParent(__lgScope);
        }
        const __lgIdToSlot = {
          quiet_btn: 'quiet', fan_entry: 'fan_entry', turbo_btn: 'turbo',
          timer_slot: 'timer', swing_h: 'swing_h', swing_v: 'swing_v',
          mode_entry: 'mode_entry', back_fan: 'back_fan', fan_auto: 'fan_auto',
          fan_low: 'fan_low', fan_med: 'fan_med', fan_high: 'fan_high',
          back_mode: 'back_mode', mode_cool: 'mode_cool', mode_heat: 'mode_heat',
          mode_dry: 'mode_dry', mode_fan_only: 'mode_fan_only', mode_auto: 'mode_auto'
        };
        const __lgWrapId = (() => {
          let p = this;
          for (let i = 0; i < 8 && p; i++) {
            if (p.id && __lgIdToSlot[p.id]) return p.id;
            p = p.parentElement;
          }
          return '';
        })();
        const __lgSlotFromDom = __lgIdToSlot[__lgWrapId] || '';
        const __lgSlotFromVar = String((variables && variables.seg_slot) || '');
        const __lgSlot = __lgSlotFromDom || __lgSlotFromVar;
        let __lgSegIdx = Number(variables && variables.seg_index);
        let __lgSegTotal = Math.max(1, Number(variables && variables.seg_total) || 6);
        let __lgSegVisible = true;
        let __lgSlots = [];
        let __lgLayer = 'none';
        if (__lgWheel) {
          const __lgTimerActive = __lgWheel.classList.contains('lg-wheel-timer-active');
          const __lgSwingOn = __lgWheel.classList.contains('lg-wheel-swing-h-on');
          /* Property SoT: window map by entity (survives host recreate), then expando. */
          const __lgCfgW = __lgWheel._config || __lgWheel.config || {};
          const __lgEid = String((__lgCfgW.entity) || (__lgWheel.__lgWheelEntityId) || '');
          if (__lgEid) __lgWheel.__lgWheelEntityId = __lgEid;
          window.__lgKlimatWheelLayerByEntity = window.__lgKlimatWheelLayerByEntity || {};
          const __lgFromMap = __lgEid ? window.__lgKlimatWheelLayerByEntity[__lgEid] : null;
          const __lgProp = (__lgFromMap === 'fan' || __lgFromMap === 'mode')
            ? __lgFromMap
            : ((__lgWheel.__lgWheelLayer === 'fan' || __lgWheel.__lgWheelLayer === 'mode')
              ? __lgWheel.__lgWheelLayer
              : 'main');
          __lgWheel.__lgWheelLayer = __lgProp;
          __lgLayer = __lgProp;
          const __lgLayerFan = __lgLayer === 'fan';
          const __lgLayerMode = __lgLayer === 'mode';
          const __lgLayerMain = __lgLayer === 'main';
          /* Keep CSS classes aligned with map SoT every segment eval. */
          __lgWheel.classList.remove('lg-wheel-layer-main', 'lg-wheel-layer-fan', 'lg-wheel-layer-mode');
          __lgWheel.classList.add('lg-wheel-layer-' + __lgLayer);
          if (__lgLayerFan) {
            __lgSlots = ['fan_auto', 'back_fan', 'fan_low', 'fan_med', 'fan_high'];
          } else if (__lgLayerMode) {
            __lgSlots = ['mode_auto', 'mode_cool', 'mode_heat', 'mode_dry', 'mode_fan_only', 'back_mode'];
          } else {
            /* Main layer — MUST match climate_global_wheel CSS visibility. */
            __lgSlots = ['quiet', 'fan_entry', 'turbo'];
            if (!__lgTimerActive) __lgSlots.push('timer');
            if (__lgSwingOn) __lgSlots.push('swing_h');
            __lgSlots.push('mode_entry');
          }
