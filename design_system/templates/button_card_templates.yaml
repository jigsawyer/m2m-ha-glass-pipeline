{# Propagate / clear TEMP red-box focus on thermostat + room hosts (composed tree).
   open_expr MUST be Jinja-emitted ({{ open_expr }}) — never ${open_expr}: that
   literal survives build and breaks button-card new Function (Unexpected token '{').
   When opening: hide sibling .lg-climate-room-host under the same floor (ONLY
   active room stays readable). When closing: restore siblings. #}
{% macro lg_climate_temp_focus_set_js(open_expr) -%}
        (() => {
          const __lgOpen = !!({{ open_expr }});
          const __lgCP = (el) => {
            if (!el) return null;
            if (el.parentElement) return el.parentElement;
            const rn = el.getRootNode && el.getRootNode();
            return (rn && rn.host) || null;
          };
          const __lgActiveRooms = [];
          let __lgScope = __lgCP(this);
          let __lgFloor = null;
          for (let __i = 0; __i < 24 && __lgScope; __i++) {
            if (__lgScope.classList) {
              if (__lgScope.classList.contains('lg-thermostat-host')
                  || __lgScope.classList.contains('lg-climate-room-host')) {
                __lgScope.classList.toggle('lg-temp-focus', __lgOpen);
                if (__lgScope.classList.contains('lg-climate-room-host')) {
                  __lgActiveRooms.push(__lgScope);
                }
              }
              if (__lgScope.classList.contains('lg-climate-floor-host')) {
                __lgFloor = __lgScope;
              }
            }
            __lgScope = __lgCP(__lgScope);
          }
          const __lgWalkRooms = (node, depth, out) => {
            if (!node || depth > 18 || out.length > 12) return;
            if (node.classList && node.classList.contains('lg-climate-room-host')) {
              out.push(node);
            }
            if (node.shadowRoot) __lgWalkRooms(node.shadowRoot, depth + 1, out);
            if (node.querySelectorAll) {
              node.querySelectorAll('*').forEach((el) => {
                if (el.shadowRoot) __lgWalkRooms(el.shadowRoot, depth + 1, out);
              });
            }
          };
          if (__lgFloor) {
            const __lgAllRooms = [];
            __lgWalkRooms(__lgFloor, 0, __lgAllRooms);
            __lgAllRooms.forEach((__lgRoom) => {
              const __lgIsActive = __lgActiveRooms.indexOf(__lgRoom) !== -1;
              if (__lgOpen && !__lgIsActive) {
                __lgRoom.classList.add('lg-temp-sibling-hidden');
                __lgRoom.style.setProperty('opacity', '0');
                __lgRoom.style.setProperty('visibility', 'hidden');
                __lgRoom.style.setProperty('pointer-events', 'none');
              } else {
                __lgRoom.classList.remove('lg-temp-sibling-hidden');
                __lgRoom.style.removeProperty('opacity');
                __lgRoom.style.removeProperty('visibility');
                __lgRoom.style.removeProperty('pointer-events');
              }
            });
          }
        })();
{%- endmacro %}

