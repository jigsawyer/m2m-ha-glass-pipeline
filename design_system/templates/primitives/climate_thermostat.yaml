{# Climate thermostat — thin instance (Hisense / climate domain) #}
type: custom:button-card
template: climate_thermostat
entity: {{ entity_id }}
name: {{ name }}
variables:
  timer_entity_id: "{{ custom_props.timer_entity_id | default('') }}"
  clock_entity_id: "{{ custom_props.clock_entity_id | default('') }}"
  armed_entity_id: "{{ custom_props.armed_entity_id | default('') }}"
  popup_hash: "{{ custom_props.popup_hash | default('') }}"
  mode_entity_id: "{{ custom_props.mode_entity_id | default('') }}"
  hours_entity_id: "{{ custom_props.hours_entity_id | default('') }}"
  minutes_entity_id: "{{ custom_props.minutes_entity_id | default('') }}"
  clock_hour_entity_id: "{{ custom_props.clock_hour_entity_id | default('') }}"
  clock_minute_entity_id: "{{ custom_props.clock_minute_entity_id | default('') }}"
  remove_script_id: "{{ custom_props.remove_script_id | default('') }}"
  pause_clock_script_id: "{{ custom_props.pause_clock_script_id | default('') }}"
  turbo_entity_id: "{{ custom_props.turbo_entity_id | default('') }}"
  quiet_entity_id: "{{ custom_props.quiet_entity_id | default('') }}"
