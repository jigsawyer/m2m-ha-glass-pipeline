{# Laundry Delayed Start Bubble pop-up (ADR 0020 + ADR 0026).
   Standalone Bubble format (v3.2.0+): content in `cards:`, not vertical-stack siblings.
   Client computes delayMinutes for START_AT | FINISH_BY before script call. #}
{%- set props = custom_props | default({}) -%}
type: custom:bubble-card
card_type: pop-up
hash: "{{ props.popup_hash }}"
name: Відкладений старт
icon: mdi:timer-outline
show_header: true
show_close_button: true
popup_mode: centered
width_desktop: var(--lg_size_laundry_popup_w)
bg_color: rgb(255, 255, 255)
bg_opacity: 28
bg_blur: 48
shadow_opacity: 30
close_by_clicking_outside: true
styles: |
  :host {
    --bubble-pop-up-background-color: var(--lg_color_glass_fill);
    --bubble-pop-up-main-background-color: var(--lg_color_glass_fill);
    --bubble-pop-up-border-radius: var(--lg_radius_laundry);
    --bubble-backdrop-background-color: var(--lg_color_focus_viewport_fill);
    --paper-item-icon-color: var(--lg_color_text);
    --icon-primary-color: var(--lg_color_text);
    --primary-color: var(--lg_color_text);
  }
  .bubble-backdrop {
    background-color: var(--lg_color_focus_viewport_fill) !important;
    backdrop-filter: blur(var(--lg_blur_focus_viewport)) saturate(var(--lg_saturate_focus_viewport)) !important;
    -webkit-backdrop-filter: blur(var(--lg_blur_focus_viewport)) saturate(var(--lg_saturate_focus_viewport)) !important;
    transition: none !important;
  }
  @media (max-width: 48rem) {
    .bubble-pop-up.popup-mode-centered:not(.editor) {
      width: var(--lg_size_laundry_popup_w_phone) !important;
      max-width: var(--lg_size_laundry_popup_w_phone) !important;
    }
  }
cards:
  - type: custom:button-card
    template: laundry_delay_scheduler
    entity: "{{ props.armed_entity_id }}"
    name: "{{ props.label | default('Пральна') }}"
    variables:
      cycle_duration_entity_id: "{{ props.cycle_duration_entity_id | default('') }}"
      delay_mode_entity_id: "{{ props.delay_mode_entity_id | default('') }}"
      schedule_script_id: "{{ props.schedule_script_id | default('') }}"
      popup_hash: "{{ props.popup_hash | default('') }}"
