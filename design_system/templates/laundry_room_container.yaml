{# Laundry room — 2-col desktop / 1-col phone for washer|dryer (ADR 0026 rework) #}
type: custom:button-card
template: laundry_room_container
name: {{ name }}
custom_fields:
  content:
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: "1fr"
        place-items: stretch stretch
        grid-gap: "var(--lg_space_laundry_col_gap)"
        margin: "0"
        padding: "0"
        mediaquery:
          "(min-width: 48.0625rem)":
            grid-template-columns: "1fr 1fr"
      cards:
{{ cards | yaml_cards(8) }}
{%- if corner_card %}
  corner:
    card:
{{ corner_card | indent(6, first=True) }}
{%- endif %}
