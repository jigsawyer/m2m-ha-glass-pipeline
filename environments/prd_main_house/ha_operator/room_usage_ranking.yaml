# M2M Nextgen — Room Usage Frequency Tracker (STRUCTURAL, ADR-0003 @architect)
# Feeds design_system-agnostic room ranking for the m2m_nextgen dashboard's
# dynamic room ordering. Grounded ONLY in switch entities already declared in
# environments/prd_main_house/dashboards/svitlo/local_content_map.json room_content
# (STD-06 — no invented entities). Rolling 7-day usage-turn-on counter per room;
# NOT auto-applied to the live host — same manual-apply note as laundry_delay.yaml
# (publish_edge does NOT deploy packages/; operator copy + `ha core check` + reload).

input_number:
  m2m_room_usage_vitalnia:
    name: "M2M usage count — vitalnia"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_dushova:
    name: "M2M usage count — dushova"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_kukhnia:
    name: "M2M usage count — kukhnia"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_zal:
    name: "M2M usage count — zal"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_kabinet:
    name: "M2M usage count — kabinet"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_skhody_i_korydor:
    name: "M2M usage count — skhody_i_korydor"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_spalnia:
    name: "M2M usage count — spalnia"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_ditiacha:
    name: "M2M usage count — ditiacha"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_vanna:
    name: "M2M usage count — vanna"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_tualet:
    name: "M2M usage count — tualet"
    min: 0
    max: 100000
    step: 1
    mode: box

  m2m_room_usage_pralnia:
    name: "M2M usage count — pralnia"
    min: 0
    max: 100000
    step: 1
    mode: box

automation:
  - id: m2m_room_usage_tick
    alias: M2M — increment room usage counter on switch turn-on
    mode: queued
    trigger:
      - platform: state
        entity_id: switch.vitalnia_svitlo_switch
        to: "on"
        id: vitalnia
      - platform: state
        entity_id: switch.vitalnia_svitlo_switch_2
        to: "on"
        id: vitalnia
      - platform: state
        entity_id: switch.vimikach_switch_2
        to: "on"
        id: dushova
      - platform: state
        entity_id: switch.vimikach_switch
        to: "on"
        id: dushova
      - platform: state
        entity_id: switch.pidsvitka_switch
        to: "on"
        id: kukhnia
      - platform: state
        entity_id: switch.svitlo_switch_3
        to: "on"
        id: kukhnia
      - platform: state
        entity_id: switch.svitlo_switch_4
        to: "on"
        id: kukhnia
      - platform: state
        entity_id: switch.svitlo_3
        to: "on"
        id: kukhnia
      - platform: state
        entity_id: switch.zal_switch_2
        to: "on"
        id: zal
      - platform: state
        entity_id: switch.zal_switch
        to: "on"
        id: zal
      - platform: state
        entity_id: switch.svitlo_4
        to: "on"
        id: zal
      - platform: state
        entity_id: switch.kabinet_vimikach_kabinet
        to: "on"
        id: kabinet
      - platform: state
        entity_id: switch.svitlo_switch
        to: "on"
        id: skhody_i_korydor
      - platform: state
        entity_id: switch.svitlo_switch_2
        to: "on"
        id: skhody_i_korydor
      - platform: state
        entity_id: switch.vimikach_bilia_vkhodu_switch_2
        to: "on"
        id: spalnia
      - platform: state
        entity_id: switch.vimikach_bilia_vkhodu_switch
        to: "on"
        id: spalnia
      - platform: state
        entity_id: switch.balkon_spalnia_svitlo_switch
        to: "on"
        id: spalnia
      - platform: state
        entity_id: switch.pidsvitka
        to: "on"
        id: ditiacha
      - platform: state
        entity_id: switch.ditiacha_svitlo_switch
        to: "on"
        id: ditiacha
      - platform: state
        entity_id: switch.ditiacha_svitlo_switch_2
        to: "on"
        id: ditiacha
      - platform: state
        entity_id: switch.ditiacha_pidsvitka_terasi
        to: "on"
        id: ditiacha
      - platform: state
        entity_id: switch.svitlo_2
        to: "on"
        id: ditiacha
      - platform: state
        entity_id: switch.lumi_lumi_ctrl_ln1_aq1
        to: "on"
        id: vanna
      - platform: state
        entity_id: switch.vitiazhka
        to: "on"
        id: vanna
      - platform: state
        entity_id: switch.svitlo
        to: "on"
        id: tualet
      - platform: state
        entity_id: switch.pralnia_switch
        to: "on"
        id: pralnia
    action:
      - service: input_number.increment
        target:
          entity_id: "input_number.m2m_room_usage_{{ trigger.id }}"

  - id: m2m_room_usage_weekly_reset
    alias: M2M — weekly reset of room usage counters (rolling-frequency window)
    mode: single
    trigger:
      - platform: time
        at: "03:00:00"
    condition:
      - condition: time
        weekday:
          - mon
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_vitalnia
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_dushova
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_kukhnia
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_zal
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_kabinet
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_skhody_i_korydor
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_spalnia
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_ditiacha
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_vanna
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_tualet
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.m2m_room_usage_pralnia
        data:
          value: 0

template:
  - sensor:
      - name: "M2M Room Usage Rank"
        unique_id: m2m_room_usage_rank
        state: >-
          {{ now().isoformat() }}
        attributes:
          rooms_by_usage: >-
            {% set ns = namespace(pairs=[]) %}
            {%- for r in ["vitalnia", "dushova", "kukhnia", "zal", "kabinet", "skhody_i_korydor", "spalnia", "ditiacha", "vanna", "tualet", "pralnia"] %}
            {%- set ns.pairs = ns.pairs + [(r, states('input_number.m2m_room_usage_' ~ r) | float(0))] %}
            {%- endfor %}
            {{ ns.pairs | sort(attribute='1', reverse=true) | map(attribute='0') | list }}
