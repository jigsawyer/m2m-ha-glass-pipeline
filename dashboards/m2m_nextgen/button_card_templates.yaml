        let __lgScope = __lgComposedParent(this);
        for (let i = 0; i < 16 && __lgScope; i++) {
          if (__lgScope.classList && __lgScope.classList.contains('lg-wheel-host')) {
            __lgWheel = __lgScope;
            break;
          }
          __lgScope = __lgComposedParent(__lgScope);
        }
        const __lgEid = String((entity && entity.entity_id) || '');
        window.__lgKlimatPowerLoadByEntity = window.__lgKlimatPowerLoadByEntity || {};
        const __lgPowerRec = (__lgEid && window.__lgKlimatPowerLoadByEntity[__lgEid]) || null;
        const __lgPowerPhaseRaw = (__lgPowerRec && __lgPowerRec.phase)
          || (__lgWheel && __lgWheel.getAttribute && __lgWheel.getAttribute('data-lg-power-load'))
          || '';
        const __lgOptimisticOn = __lgPowerPhaseRaw === 'optimistic_on' || __lgPowerPhaseRaw === 'init'
          || !!(__lgWheel && __lgWheel.classList.contains('lg-power-optimistic--on'));
        const __lgOptimisticOff = __lgPowerPhaseRaw === 'optimistic_off' || __lgPowerPhaseRaw === 'shutdown'
          || !!(__lgWheel && __lgWheel.classList.contains('lg-power-optimistic--off'));
        const __lgPowerLoad = !!(__lgOptimisticOn || __lgOptimisticOff || (__lgWheel && (
          __lgWheel.classList.contains('lg-power-load')
          || __lgWheel.classList.contains('lg-power-optimistic')
        )));
        if (__lgWheel && __lgWheel.classList.contains('lg-power-degraded')) {
          return `<div class="lg-setpoint-stack lg-setpoint-stack--wait"><div class="lg-setpoint-stack__toast">Зв'язок з Home Assistant втрачено. Перепідключення...</div></div>`;
        }
        if (__lgOptimisticOn) {
          return `<div class="lg-setpoint-stack lg-setpoint-stack--optimistic-on"><div class="lg-setpoint-stack__ambient">${ambient}</div><div class="lg-setpoint-stack__target lg-setpoint-stack__target--opt">${targetLabel}</div></div>`;
        }
        if (__lgOptimisticOff) {
          return `<div class="lg-setpoint-stack lg-setpoint-stack--idle lg-setpoint-stack--optimistic-off"><div class="lg-setpoint-stack__ambient">${ambient}</div><div class="lg-setpoint-stack__mode">${modeLabels.off}</div></div>`;
        }
        /* ADR 0035 IDLE_OFF: ambient + Вимк only (hide target / L3). */
        if (mode === 'off') {
          return `<div class="lg-setpoint-stack lg-setpoint-stack--idle"><div class="lg-setpoint-stack__ambient">${ambient}</div><div class="lg-setpoint-stack__mode">${modeLabels.off}</div></div>`;
        }
        const __lgTimerActive = !!(__lgWheel && __lgWheel.classList.contains('lg-wheel-timer-active'));
        const __lgTimerConfigOpen = !!(__lgWheel && __lgWheel.classList.contains('lg-timer-radial-open'));
        const __lgTimerManageOpen = !!(__lgWheel && (
          __lgWheel.classList.contains('lg-timer-manage-open')
          || (__lgWheel.getAttribute && __lgWheel.getAttribute('data-lg-timer-manage') === '1')
        ));
        const __lgShowTimerLine = __lgTimerActive && !__lgTimerConfigOpen && !__lgTimerManageOpen;
        let __lgSchedule = '';
        if (__lgShowTimerLine) {
          const __lgParseDur = (raw) => {
            const parts = String(raw || '').split(':').map((p) => parseInt(p, 10) || 0);
            if (parts.length >= 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            if (parts.length === 2) return parts[0] * 60 + parts[1];
            return 0;
          };
          const __lgFmtOffAt = (dateOrMs) => {
            const d = (dateOrMs instanceof Date) ? dateOrMs : new Date(dateOrMs);
            if (!Number.isFinite(d.getTime())) return '';
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `Вимкнеться о <span class="lg-setpoint-stack__timer-emph">${hh}:${mm}</span>`;
          };
          const timerId = (variables && variables.timer_entity_id) || '';
          const armedId = (variables && variables.armed_entity_id) || '';
          const clockId = (variables && variables.clock_entity_id) || '';
          const tEnt = timerId ? states[timerId] : null;
          const running = tEnt && (tEnt.state === 'active' || tEnt.state === 'paused');
          const armed = !running && armedId && states[armedId] && states[armedId].state === 'on';
          let __lgOffLabel = '';
          let __lgCountdown = '';
          const __lgFmtHms = (sec) => {
            const s = Math.max(0, Math.floor(sec));
            const hh = String(Math.floor(s / 3600)).padStart(2, '0');
            const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;
          };
          if (running) {
            if (tEnt.state === 'active' && tEnt.attributes && tEnt.attributes.finishes_at) {
              __lgOffLabel = __lgFmtOffAt(tEnt.attributes.finishes_at);
              const ms = new Date(tEnt.attributes.finishes_at).getTime() - Date.now();
              if (Number.isFinite(ms)) __lgCountdown = __lgFmtHms(ms / 1000);
            } else if (tEnt.state === 'paused') {
              const rem = __lgParseDur(tEnt.attributes && tEnt.attributes.remaining);
              if (rem > 0) {
                __lgOffLabel = __lgFmtOffAt(Date.now() + rem * 1000);
                __lgCountdown = __lgFmtHms(rem);
              }
            }
          } else if (armed && clockId && states[clockId] && states[clockId].state) {
            const parts = String(states[clockId].state).split(':');
            const hh = String(parseInt(parts[0], 10) || 0).padStart(2, '0');
            const mm = String(parseInt(parts[1], 10) || 0).padStart(2, '0');
            __lgOffLabel = `Вимкнеться о <span class="lg-setpoint-stack__timer-emph">${hh}:${mm}</span>`;
            const now = new Date();
            const targetClock = new Date(now);
            targetClock.setHours(parseInt(hh, 10) || 0, parseInt(mm, 10) || 0, 0, 0);
            if (targetClock.getTime() <= now.getTime()) targetClock.setDate(targetClock.getDate() + 1);
            __lgCountdown = __lgFmtHms((targetClock.getTime() - now.getTime()) / 1000);
          }
          if (__lgCountdown || __lgOffLabel) {
            __lgSchedule = `<div class="lg-setpoint-stack__schedule">${__lgCountdown ? `<div class="lg-setpoint-stack__countdown"><ha-icon class="lg-setpoint-stack__timer-icon" icon="mdi:clock-outline"></ha-icon><span>${__lgCountdown}</span></div>` : ''}${__lgOffLabel ? `<div class="lg-setpoint-stack__timer">${__lgOffLabel}</div>` : ''}</div>`;
          }
        }
        const __lgStackClass = __lgSchedule
          ? 'lg-setpoint-stack lg-setpoint-stack--timer'
          : 'lg-setpoint-stack';
        return `<div class="${__lgStackClass}"><div class="lg-setpoint-stack__ambient">${ambient}</div><div class="lg-setpoint-stack__focal"><div class="lg-setpoint-stack__target">${targetLabel}</div><span class="${modePillClass}">${modeLabel}</span></div>${__lgSchedule}</div>`;
      ]]]
    ring_overlay:
      card:
        type: custom:button-card
        template: climate_thermostat_ring_panel
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"

# LiquidThermostatControl "ApproveButton" — shows the live pending
# (Adjusting, green pulse) or synced setpoint. Reads --lg_climate_pending_label /
# --lg_climate_action_shadow / --lg_climate_action_color INHERITED from the
# ancestor climate_thermostat_ring_panel (cross-shadow-boundary custom
# property inheritance). Tap = the ONLY commit: calls climate.set_temperature
# with the ring's pending value (analyzer.mdc §6), then collapses the outer
# climate_setpoint_trigger overlay back in place (no popup/navigate anymore
# — the ring lives in-place inside the trigger, see climate_setpoint_trigger).
climate_swing_axis_chip:
  show_name: false
  show_icon: true
  show_state: false
  show_ripple: false
  variables:
    axis: vertical
  tap_action:
    action: call-service
    service: |
      [[[
        const axis = variables.axis || 'vertical';
        const a = (entity && entity.attributes) || {};
        const hModes = a.swing_horizontal_modes;
        if (axis === 'horizontal' && Array.isArray(hModes) && hModes.length) {
          return 'climate.set_swing_horizontal_mode';
        }
        return 'climate.set_swing_mode';
      ]]]
    target:
      entity_id: "[[[ return (entity && entity.entity_id) || '' ]]]"
    data: |
      [[[
        const axis = variables.axis || 'vertical';
        const a = (entity && entity.attributes) || {};
        const modes = Array.isArray(a.swing_modes) ? a.swing_modes : [];
        const hModes = Array.isArray(a.swing_horizontal_modes)
          ? a.swing_horizontal_modes
          : null;
        const pick = (list, cands) => {
          const lower = (list || []).map((m) => String(m).toLowerCase());
          for (const c of cands) {
            const i = lower.indexOf(String(c).toLowerCase());
            if (i >= 0) return list[i];
          }
          return null;
        };
        const axisOn = (mode, ax) => {
          const m = String(mode || '').toLowerCase();
          if (ax === 'vertical') {
            return m === 'vertical' || m === 'both' || m === 'on';
          }
          return m === 'horizontal' || m === 'both';
        };
        /* Independent horizontal feature (HA ClimateEntityFeature.SWING_HORIZONTAL_MODE). */
        if (axis === 'horizontal' && hModes && hModes.length) {
          const curH = a.swing_horizontal_mode;
          const on = String(curH || '').toLowerCase() !== 'off' && !!curH;
          const next = on
            ? pick(hModes, ['off'])
            : pick(hModes, ['on', 'horizontal']);
          if (!next) return { swing_horizontal_mode: curH };
          return { swing_horizontal_mode: next };
        }
        if (axis === 'vertical' && hModes && hModes.length) {
          const cur = a.swing_mode;
          const on = axisOn(cur, 'vertical');
          const next = on
            ? pick(modes, ['off'])
            : pick(modes, ['vertical', 'on']);
          if (!next) return { swing_mode: cur };
          return { swing_mode: next };
        }
        /* Combined swing_modes: off | vertical | horizontal | both. */
        const cur = a.swing_mode;
        let wantVert = axisOn(cur, 'vertical');
        let wantHoriz = axisOn(cur, 'horizontal');
        if (axis === 'vertical') wantVert = !wantVert;
        else wantHoriz = !wantHoriz;
        let target = null;
        if (!wantVert && !wantHoriz) target = pick(modes, ['off']);
        else if (wantVert && !wantHoriz) target = pick(modes, ['vertical', 'on']);
        else if (!wantVert && wantHoriz) target = pick(modes, ['horizontal']);
        else target = pick(modes, ['both']);
        if (!target) return { swing_mode: cur };
        return { swing_mode: target };
      ]]]
  extra_styles: |
    [[[
      const axis = variables.axis || 'vertical';
      const a = (entity && entity.attributes) || {};
      const modes = Array.isArray(a.swing_modes) ? a.swing_modes : [];
      const hModes = Array.isArray(a.swing_horizontal_modes)
        ? a.swing_horizontal_modes
        : null;
      const axisOn = (mode, ax) => {
        const m = String(mode || '').toLowerCase();
        if (ax === 'vertical') {
          return m === 'vertical' || m === 'both' || m === 'on';
        }
        return m === 'horizontal' || m === 'both';
      };
      let supported = true;
      if (axis === 'horizontal') {
        supported = !!(hModes && hModes.length)
          || modes.some((m) => /^(horizontal|both)$/i.test(String(m)));
