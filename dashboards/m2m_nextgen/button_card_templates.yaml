m2m_rank_chip:
  # ADR-0068 nextgen-scoped live rank chip (V9 freedom namespace).
  # One chip per rank slot: reads the room id from its rank sensor
  # (sensor.m2m_room_usage_rank_N), the display label from the order
  # sensor's `labels` attribute, the weekly usage count from the room's
  # input_number counter, and a live active/total lights count from the
  # caller-supplied room→entity map. Fully client-side dynamic (STD-08:
  # registry SoT feeds ids only, never a fabricated count).
  show_icon: true
  show_name: true
  show_state: true
  show_label: true
  color_type: icon
  triggers_update: all
  tap_action:
    action: none
  hold_action:
    action: none
  icon: |
    [[[
      const medals = ['mdi:podium-gold', 'mdi:podium-silver', 'mdi:podium-bronze'];
      const idx = (variables.m2m_rank_index || 1) - 1;
      return medals[idx] || 'mdi:podium';
    ]]]
  name: |
    [[[
      const rank = hass.states[variables.m2m_rank_sensor];
      if (!rank || !rank.state || ['unknown', 'unavailable'].includes(rank.state)) return '—';
      const order = hass.states[variables.m2m_order_sensor];
      const labels = (order && order.attributes && order.attributes.labels) || {};
      return labels[rank.state] || rank.state;
    ]]]
  state_display: |
    [[[
      const rank = hass.states[variables.m2m_rank_sensor];
      if (!rank || !rank.state || ['unknown', 'unavailable'].includes(rank.state)) return '';
      const ids = (variables.m2m_room_entity_map || {})[rank.state] || [];
      const active = ids.filter((id) => {
        const st = hass.states[id];
        return st && st.state === 'on';
      }).length;
      return `${active} / ${ids.length}`;
    ]]]
  label: |
