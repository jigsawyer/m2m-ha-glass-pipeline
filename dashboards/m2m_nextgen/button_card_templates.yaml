      position: relative;
      z-index: 2;
      color: var(--lg_color_text) !important;
      --icon-primary-color: var(--lg_color_text);
      --mdc-icon-size: var(--lg_size_tab_side_icon);
    }
    #img-cell {
      position: relative;
      z-index: 2;
      width: var(--lg_size_tab_side_icon) !important;
      height: var(--lg_size_tab_side_icon) !important;
      max-width: var(--lg_size_tab_side_icon) !important;
      max-height: var(--lg_size_tab_side_icon) !important;
      overflow: hidden !important;
    }
    #img-cell {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-self: center !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    #icon,
    #icon ha-icon,
    #icon ha-svg-icon {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-content: center !important;
      place-items: center !important;
      line-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #icon {
      transform: translateY(var(--lg_space_icon_optical_nudge));
    }
    #icon ha-svg-icon svg {
      display: block !important;
      margin: 0 auto !important;
    }
    #name, #label, #state {
      display: none !important;
    }
    #liquid_clip {
      position: absolute;
      inset: 0;
      border-radius: var(--lg_radius_tab_side_btn);
      overflow: hidden;
      clip-path: inset(0 round var(--lg_radius_tab_side_btn));
      isolation: isolate;
      pointer-events: none;
      z-index: 0;
      background: var(--lg_color_disable_frost), var(--lg_color_liquid_base);
      background-blend-mode: normal, plus-lighter;
      backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
      -webkit-backdrop-filter: blur(var(--lg_blur_liquid)) saturate(var(--lg_saturate_glass));
      box-shadow: var(--lg_shadow_liquid);
    }
    #distort {
      display: none;
    }
    /* Klimat-only idle rim — shared tab-side shell keeps transparent border
       for light dashboard isolation; climate house-off needs a readable
       hitbox outline matching arc glass stroke. */
    #card {
      border-width: var(--lg_stroke_climate_tab_side) !important;
      border-color: var(--lg_color_climate_tab_side_rim) !important;
    }
    .lg-liquid-clip-shell {
      position: absolute;
      inset: 0;
      border-radius: var(--lg_radius_tab_side_btn);
      overflow: hidden;
      clip-path: inset(0 round var(--lg_radius_tab_side_btn));
      pointer-events: none;
    }
  custom_fields:
    liquid_clip: >
      <div class="lg-liquid-clip-shell"></div>
    distort: ""
  state: []

# Per-room AC off — round icon-only (no liquid chrome) inside room panel.
# Room-level tap-to-off (ADR 0016); floor/house stay hold. Climate-scoped
# glow/color tokens only (ADR 0014). Round icon centering (ADR 0015).
climate_hvac_arc_dial:
  template: climate_arc_dial
  icon: |
    [[[
      /* 1:1 with option_1..5 icons. HA Off is not a menu option — never
         pretend Auto (https://www.home-assistant.io/integrations/climate/). */
      const mode = entity && entity.state;
      if (mode === 'cool') return 'ph:snowflake';
      if (mode === 'heat') return 'ph:flame';
      if (mode === 'dry') return 'ph:drop';
      if (mode === 'fan_only') return 'ph:fan';
      if (mode === 'auto' || mode === 'heat_cool') return 'ph:thermometer-simple';
      return 'ph:power';
    ]]]
  variables:
    arc_total: 5
  custom_fields:
    option_1:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:snowflake
        name: Холод
        variables:
          check: state
          value: cool
          service: climate.set_hvac_mode
          data_key: hvac_mode
          arc_side: left
          arc_index: 0
          arc_total: 5
    option_2:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:flame
        name: Тепло
        variables:
          check: state
          value: heat
          service: climate.set_hvac_mode
          data_key: hvac_mode
          arc_side: left
          arc_index: 1
          arc_total: 5
    option_3:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:drop
        name: Сухо
        variables:
          check: state
          value: dry
          service: climate.set_hvac_mode
          data_key: hvac_mode
          arc_side: left
          arc_index: 2
          arc_total: 5
    option_4:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:fan
        name: Вент.
