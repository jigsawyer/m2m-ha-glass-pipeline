    [[[
      const ids = variables.ha_entity_ids || [];
      const activeState = variables.active_state || 'on';
      const total = ids.length;
      const active = ids.filter((id) => {
        const st = hass && hass.states && hass.states[id];
        if (!st) return false;
        if (activeState === 'climate_active') {
          return st.state && st.state !== 'off';
        }
        return st.state === activeState;
      }).length;
      return `${active} / ${total}`;
