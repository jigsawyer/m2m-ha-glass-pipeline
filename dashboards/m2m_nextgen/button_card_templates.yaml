  # Header pill: live count of "active" entities from a caller-supplied
  # entity_id list (variables.ha_entity_ids) + an "active state" predicate
  # (variables.active_state, e.g. "on" for switch/light or hvac_mode != off
  # for climate). Counting runs client-side via button-card [[[ ]]] JS
  # templates against the live hass.states object — genuinely dynamic,
  # not a build-time snapshot (STD-08: registry SoT feeds entity IDs only,
  # never a fabricated count).
  show_icon: true
  show_name: true
  show_state: true
  show_label: false
