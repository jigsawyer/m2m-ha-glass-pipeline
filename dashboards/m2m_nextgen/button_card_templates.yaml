        [[[ return variables.cancel_script_id || ''; ]]]
  extra_styles: |
    :host {
      width: 100% !important;
      height: var(--lg_size_laundry_action_h) !important;
      transition: var(--lg_transition_laundry) !important;
    }
    ha-card,
    #card {
      height: var(--lg_size_laundry_action_h) !important;
      border-radius: var(--lg_radius_liquid) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: var(--lg_space_laundry_gap) !important;
      transition: var(--lg_transition_laundry) !important;
    }
