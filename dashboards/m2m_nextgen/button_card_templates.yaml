    ha_entity_ids: []
  extra_styles: |
    :host {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      height: var(--lg_size_floor_btn_h);
      max-height: var(--lg_size_floor_btn_h);
      display: flex !important;
