      border-radius: var(--lg_radius_liquid);
      width: 100%;
      height: 100%;
    }
    #container {
      display: grid !important;
      grid-template-areas: "i n" !important;
      grid-template-columns: auto auto !important;
      grid-template-rows: var(--lg_size_floor_btn_h) !important;
