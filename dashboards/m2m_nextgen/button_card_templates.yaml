            };
            const move = (ev) => {
              if (!card.__lgTimerDragging) return;
              applyProgress(progressFromEvent(ev, ring), true);
              ev.preventDefault();
            };
            const up = () => {
              card.__lgTimerDragging = false;
              card.classList.remove('lg-timer-dragging');
            };
            ring.addEventListener('pointerdown', down);
            ring.addEventListener('pointermove', move);
            ring.addEventListener('pointerup', up);
            ring.addEventListener('pointercancel', up);
          };
          card.updateComplete.then(() => { bind(); setTimeout(bind, 60); setTimeout(bind, 240); });
        }
        /* Seed pending when overlay opens without prior drag. */
        if (pendingNow === null && seedMins > 0) {
          card.__lgTimerPending = seedMins;
          card.__lgTimerLastProgress = timerT;
        }
        card.updateComplete.then(() => applyTickProgress(card, timerT));
      }
      return `
    :host {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box;
      overflow: visible !important;
      background: transparent !important;
      box-shadow: none !important;
      pointer-events: auto !important;
      --lg_timer_t: ${timerT};
      --lg_timer_knob_x: ${knobPos.x}%;
      --lg_timer_knob_y: ${knobPos.y}%;
      --lg_timer_label: ${labelCss};
      --lg_timer_off_at: ${offAtCss};
      --lg_size_climate_timer_max_minutes: ${maxMin};
      --lg_size_climate_timer_min_minutes: ${minMin};
      --lg_size_climate_timer_step_minutes: ${stepMin};
    }
    ha-card, #card {
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      background: transparent !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    #container {
      display: grid !important;
      place-items: center !important;
      width: var(--lg_size_climate_timer_radial_w) !important;
      height: var(--lg_size_climate_timer_radial_w) !important;
      box-sizing: border-box !important;
      position: relative !important;
    }
    #name, #icon, #label, #state { display: none !important; }
    #timer_ring {
      grid-area: 1 / 1 !important;
      width: 100% !important;
      height: 100% !important;
      aspect-ratio: 1 / 1 !important;
      display: block !important;
      position: relative !important;
      box-sizing: border-box !important;
      border-radius: 50% !important;
      pointer-events: auto !important;
      touch-action: none !important;
      z-index: 1 !important;
    }
    #timer_ring .lg-timer-radial__svg {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      overflow: visible !important;
      pointer-events: none !important;
    }
    #timer_ring .lg-timer-radial__hit {
      fill: none;
      stroke: transparent;
      stroke-width: calc(var(--lg_size_climate_timer_tick_len) * 2.5);
      pointer-events: stroke !important;
    }
    #timer_ring .lg-timer-tick {
      stroke: var(--lg_color_climate_timer_tick);
      stroke-linecap: round;
      fill: none;
      transition: var(--lg_transition_climate_timer_tick);
      pointer-events: none !important;
    }
    #timer_ring .lg-timer-cursor {
      stroke: var(--lg_color_climate_timer_cursor);
      stroke-linecap: round;
      fill: none;
      pointer-events: none !important;
      filter: drop-shadow(0 0 0.15rem rgba(255, 72, 58, 0.45));
    }
    #timer_confirm {
      grid-area: 1 / 1 !important;
      z-index: 4 !important;
      justify-self: center !important;
      align-self: center !important;
      width: var(--lg_size_climate_setpoint_trigger_w) !important;
      height: var(--lg_size_climate_setpoint_trigger_w) !important;
      border-radius: 50% !important;
      position: relative !important;
      pointer-events: auto !important;
    }
    #knob {
      display: none !important;
      pointer-events: none !important;
    }
    @media (max-width: 48rem) {
      #container {
        width: var(--lg_size_climate_timer_radial_w_phone) !important;
        height: var(--lg_size_climate_timer_radial_w_phone) !important;
      }
      #timer_confirm {
        width: var(--lg_size_climate_setpoint_trigger_w_phone) !important;
        height: var(--lg_size_climate_setpoint_trigger_w_phone) !important;
      }
      #timer_ring .lg-timer-radial__hit {
        stroke-width: calc(var(--lg_size_climate_timer_tick_len_phone) * 2.5);
      }
    }
      `;
    ]]]
  custom_fields:
    timer_ring: >
      <svg class="lg-timer-radial__svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
