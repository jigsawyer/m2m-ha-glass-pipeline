      -webkit-font-smoothing: var(--lg_font_smoothing);
      -moz-osx-font-smoothing: var(--lg_font_smoothing_moz);
      line-height: var(--lg_line_height_room);
      justify-self: center !important;
      align-self: start !important;
      text-align: center !important;
      width: 100% !important;
    }
    /* Title + corner action share the header axis; panel spans below. */
    #container {
      display: grid !important;
      grid-template-areas:
        "room_title room_corner"
        "room_panel room_panel" !important;
      grid-template-columns: minmax(0, 1fr) auto !important;
      grid-template-rows: min-content min-content !important;
      gap: var(--lg_space_gap_sm);
      align-items: center !important;
    }
    #name {
      grid-area: room_title;
      color: var(--lg_color_text);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.88;
    }
    #content {
      grid-area: room_panel;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box;
      display: block !important;
    }
    #content > * {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box;
      display: block !important;
    }
    #corner {
      grid-area: room_corner;
      justify-self: end;
    }
  custom_fields:
    glass_layers: >
      <div class="lg-glass-stack"><div class="lg-glass-stack__fill"></div><div class="lg-glass-stack__frost"></div><div class="lg-glass-stack__luminosity"></div></div>
room_container:
  show_icon: false
  show_name: true
  show_state: false
  # Shell only — same as floor_container; nested switches keep tap_action toggle.
  show_ripple: false
  tap_action:
    action: none
  extra_styles: |
    /* Cap room glass at switch-driven lg_size_container_w — never stretch to
       masonry track (width:100% bloated cards). Floor/shell carry free space.
       Plugin .column > * { margin: card_margin } keeps H/V mosaic gaps.
       iOS folder: title above panel; glass only on #content row. */
    :host {
      width: min(100%, var(--lg_size_container_w)) !important;
      max-width: min(100%, var(--lg_size_container_w)) !important;
      min-width: 0 !important;
      flex: 0 0 auto;
      display: block;
      box-sizing: border-box;
      align-self: start;
      height: auto;
      background: transparent !important;
      box-shadow: none !important;
      justify-self: center;
      overflow: visible !important;
      --ha-card-border-radius: 0 !important;
    }
    @media (max-width: 48rem) {
      :host {
        margin-bottom: var(--lg_space_room_stack_gap);
      }
    }
    ha-card {
      width: min(100%, var(--lg_size_container_w)) !important;
      max-width: min(100%, var(--lg_size_container_w)) !important;
      min-width: 0 !important;
      box-sizing: border-box;
      overflow: visible !important;
      border-radius: 0 !important;
      --ha-card-border-radius: 0 !important;
      display: block !important;
      align-items: stretch !important;
      padding: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    
    #card {
      position: relative;
      overflow: visible;
      box-sizing: border-box;
      width: min(100%, var(--lg_size_container_w));
      max-width: min(100%, var(--lg_size_container_w));
      min-width: 0;
      min-height: 0;
      height: auto;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      transition: var(--lg_transition_smooth);
      /* Layout shell — not a control; docs: tap_action none removes pointer (#1038) */
      cursor: default;
    }
    #container {
      display: grid !important;
      grid-template-areas: "room_title" "room_panel" !important;
      grid-template-columns: 1fr !important;
      grid-template-rows: min-content min-content !important;
      justify-items: center !important;
      align-content: start !important;
      width: 100% !important;
    }
    #name {
      grid-area: room_title !important;
      margin-bottom: var(--lg_space_room_title_gap);
    }
    #content,
    #glass_layers {
      grid-area: room_panel !important;
    }
    #content {
      position: relative;
      z-index: 2;
      padding: var(--lg_space_gap_md);
      border-radius: var(--lg_radius_room);
      border: var(--lg_stroke_glass) solid var(--lg_color_room_glass_rim);
      box-shadow: var(--lg_shadow_room_container);
      overflow: hidden;
      margin-top: 0;
      box-sizing: border-box;
    }
    #glass_layers {
      z-index: 1;
      align-self: stretch !important;
      justify-self: stretch !important;
      position: relative;
      width: 100%;
      min-height: 0;
      border-radius: var(--lg_radius_room);
      overflow: hidden;
      clip-path: inset(0 round var(--lg_radius_room));
      isolation: isolate;
      pointer-events: none;
    }
    #name {
      position: relative;
      z-index: 2;
      color: var(--lg_color_text);
      font-family: var(--lg_font_label_family);
      font-size: var(--lg_font_room_label_size);
      font-weight: var(--lg_font_title_weight);
      letter-spacing: var(--lg_font_room_tracking);
      -webkit-font-smoothing: var(--lg_font_smoothing);
      -moz-osx-font-smoothing: var(--lg_font_smoothing_moz);
      line-height: var(--lg_line_height_room);
      justify-self: center !important;
      align-self: start !important;
      text-align: center !important;
      width: 100% !important;
    }
    /* Title + room-off on one header axis; panel spans below (corner via
       room_corner_actions / build_engine corner_card). */
    #container {
      grid-template-areas:
        "room_title room_corner"
        "room_panel room_panel" !important;
      grid-template-columns: minmax(0, 1fr) auto !important;
      grid-template-rows: min-content min-content !important;
      align-items: center !important;
    }
    #name {
      grid-area: room_title !important;
      justify-self: center !important;
      align-self: center !important;
      text-align: center !important;
      width: auto !important;
      max-width: 100% !important;
      overflow: visible;
    }
    #corner {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      grid-area: room_corner !important;
      justify-self: end !important;
      align-self: center !important;
      z-index: 5 !important;
      pointer-events: auto !important;
      margin-bottom: var(--lg_space_room_title_gap);
    }
    #content {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      justify-self: stretch !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    #content > * {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    #content layout-card,
    #content grid-layout,
    #content HuiGridLayout,
    #content .card {
      width: 100% !important;
      max-width: 100% !important;
      display: grid !important;
      justify-content: center !important;
      justify-items: center !important;
      align-items: start !important;
      align-content: start !important;
      place-content: start center !important;
      gap: var(--lg_space_gap_sm) !important;
      box-sizing: border-box;
      margin-left: 0 !important;
      margin-right: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    #content button-card,
    #content hui-card {
      justify-self: center !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .lg-glass-stack {
      position: absolute;
      inset: 0;
      border-radius: var(--lg_radius_room);
      overflow: hidden;
      clip-path: inset(0 round var(--lg_radius_room));
      isolation: isolate;
      pointer-events: none;
    }
    .lg-glass-stack__fill,
    .lg-glass-stack__frost,
    .lg-glass-stack__luminosity {
      position: absolute;
      inset: 0;
      border-radius: var(--lg_radius_room);
    }
    .lg-glass-stack__fill {
      background: var(--lg_color_room_glass_fill);
      backdrop-filter: blur(var(--lg_blur_room_glass)) saturate(var(--lg_saturate_room_glass));
      -webkit-backdrop-filter: blur(var(--lg_blur_room_glass)) saturate(var(--lg_saturate_room_glass));
    }
    .lg-glass-stack__frost {
      background: var(--lg_color_room_glass_frost);
      mix-blend-mode: plus-lighter;
    }
    .lg-glass-stack__luminosity {
      background: var(--lg_color_room_glass_luminosity);
      mix-blend-mode: soft-light;
    }
  custom_fields:
    glass_layers: >
      <div class="lg-glass-stack"><div class="lg-glass-stack__fill"></div><div class="lg-glass-stack__frost"></div><div class="lg-glass-stack__luminosity"></div></div>

