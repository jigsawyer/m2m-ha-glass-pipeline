# m2m-generated: 2026-08-10 22:55:08
climate_arc_dial:
  show_icon: true
  show_name: false
  show_state: false
  show_label: false
  show_ripple: false
  variables:
    arc_total: 1
  tap_action: |
    [[[
      /* Open-only from the dial's own icon — per spec the ring/arc closes
         in exactly 2 ways: tap on empty space (climate_arc_overlay_btn) or
         select an option (climate_arc_option_btn). Re-tapping the icon
         while already expanded must NOT be a 3rd close path. */
      if (!this.classList.contains('lg-arc-expanded')) {
        this.classList.add('lg-arc-expanded');
      }
      return { action: 'none' };
    ]]]
  extra_styles: |
    [[[
      this.classList.add('lg-arc-host');
      const mode = entity ? entity.state : 'off';
      const modeColor = mode === 'cool'
        ? 'var(--lg_color_climate_cool)'
        : mode === 'heat'
          ? 'var(--lg_color_climate_heat)'
          : 'var(--lg_color_text)';
      const modeGlow = mode === 'off' || !mode
        ? 'none'
        : mode === 'cool'
          ? 'var(--lg_glow_climate_cool)'
          : mode === 'heat'
            ? 'var(--lg_glow_climate_heat)'
            : 'var(--lg_glow_climate_other)';
      const modeFilter = mode === 'off' || !mode
        ? 'none'
        : mode === 'cool'
          ? 'var(--lg_filter_climate_cool)'
          : mode === 'heat'
            ? 'var(--lg_filter_climate_heat)'
            : 'var(--lg_filter_climate_other)';
      return `
    :host {
      --lg_arc_t: 0;
      --lg_arc_transition: var(--lg_transition_climate_arc_collapse);
      --lg_arc_pointer: none;
      position: relative;
      display: block;
      overflow: visible !important;
      z-index: 1;
    }
    :host(.lg-arc-expanded) {
      --lg_arc_t: 1;
      --lg_arc_transition: var(--lg_transition_climate_arc_expand);
      --lg_arc_pointer: auto;
      z-index: 45;
    }
    @media (min-width: 48.0625rem) {
      :host(.lg-arc-expanded) {
        --lg_arc_transition: var(--lg_transition_climate_arc_expand_desktop);
      }
    }
    :host {
      width: var(--lg_size_climate_arc_trigger_w) !important;
      max-width: var(--lg_size_climate_arc_trigger_w) !important;
      min-width: var(--lg_size_climate_arc_trigger_w) !important;
      height: var(--lg_size_climate_arc_trigger_w) !important;
      max-height: var(--lg_size_climate_arc_trigger_w) !important;
      min-height: var(--lg_size_climate_arc_trigger_w) !important;
      aspect-ratio: 1 !important;
      box-sizing: border-box;
      background: transparent !important;
      box-shadow: none !important;
    }
    @media (max-width: 48rem) {
      :host {
        width: var(--lg_size_climate_arc_trigger_w_phone) !important;
        max-width: var(--lg_size_climate_arc_trigger_w_phone) !important;
        min-width: var(--lg_size_climate_arc_trigger_w_phone) !important;
        height: var(--lg_size_climate_arc_trigger_w_phone) !important;
        max-height: var(--lg_size_climate_arc_trigger_w_phone) !important;
        min-height: var(--lg_size_climate_arc_trigger_w_phone) !important;
      }
    }
    ha-card, #card {
      background: transparent !important;
      box-shadow: none !important;
      /* Stays visible (not hidden): callers like climate_arc_dial and
         climate_setpoint_trigger nest absolutely-positioned expansion
         custom_fields (#overlay, #option_N, #ring_overlay)
         INSIDE this same #card that must fan out / grow past the small
         idle circle's own bounds. The circular look itself comes from
         #liquid_clip's own overflow:hidden + border-radius:50% below, not
         from clipping at the #card level. */
      overflow: visible !important;
    }
    #card {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      box-sizing: border-box;
      border-radius: var(--lg_radius_climate_round_btn);
      border: var(--lg_stroke_climate_arc_glass) solid var(--lg_color_climate_arc_glass_stroke);
      box-shadow: var(--lg_shadow_climate_arc_sphere);
      cursor: pointer;
      transition: var(--lg_transition_press);
    }
    #card:active {
      transform: var(--lg_transform_climate_press_scale);
      opacity: var(--lg_opacity_climate_press);
      filter: var(--lg_filter_climate_press);
      box-shadow: var(--lg_shadow_climate_hub_press);
    }
    #container {
      display: grid !important;
      place-items: center !important;
      width: 100%;
      height: 100%;
    }
    #liquid_clip {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: var(--lg_color_climate_arc_glass_fill);
      backdrop-filter: blur(var(--lg_blur_climate_arc_glass)) saturate(var(--lg_saturate_glass));
      -webkit-backdrop-filter: blur(var(--lg_blur_climate_arc_glass)) saturate(var(--lg_saturate_glass));
      pointer-events: none;
      z-index: 0;
    }
    #img-cell {
      position: relative;
      z-index: 1;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: visible !important;
    }
    #icon {
      position: relative;
      z-index: 1;
      width: var(--lg_size_climate_chip_icon) !important;
      height: var(--lg_size_climate_chip_icon) !important;
      max-width: var(--lg_size_climate_chip_icon) !important;
      max-height: var(--lg_size_climate_chip_icon) !important;
      --mdc-icon-size: var(--lg_size_climate_chip_icon);
    }
    @media (max-width: 48rem) {
      #icon {
        width: var(--lg_size_climate_chip_icon) !important;
        height: var(--lg_size_climate_chip_icon) !important;
        max-width: var(--lg_size_climate_chip_icon) !important;
        max-height: var(--lg_size_climate_chip_icon) !important;
        --mdc-icon-size: var(--lg_size_climate_chip_icon);
      }
    }
    #img-cell {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-self: center !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    #icon,
    #icon ha-icon,
    #icon ha-svg-icon {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-content: center !important;
      place-items: center !important;
      line-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #icon {
      transform: translateY(var(--lg_space_icon_optical_nudge));
    }
    #icon ha-svg-icon svg {
      display: block !important;
      margin: 0 auto !important;
    }
    #name, #label, #state { display: none !important; }
    #card {
      box-shadow: ${modeGlow === 'none' ? 'var(--lg_shadow_climate_arc_sphere)' : modeGlow};
      opacity: ${mode === 'off' || !mode ? 'var(--lg_opacity_climate_arc_trigger_off)' : '1'};
    }
    #icon {
      color: ${modeColor} !important;
      filter: ${modeFilter};
    }
    /* FIX (regression): button-card attaches its own click handler to the
       auto-generated wrapper <div> for EACH custom_field (#overlay,
       #option_1..5), separately from the nested card's own
       :host. Gate the WRAPPER's own pointer-events on the same variable —
       !important is required here: button-card sets pointer-events
       directly on these wrapper divs via element.style (inline), which
       otherwise beats a plain (non-!important) external rule regardless of
       selector specificity, silently re-enabling hit-testing on the
       fullscreen overlay wrapper even while --lg_arc_pointer is 'none'. */
    #overlay,
    #option_1, #option_2, #option_3, #option_4, #option_5 {
      pointer-events: var(--lg_arc_pointer, none) !important;
    }
      `;
    ]]]
  custom_fields:
    liquid_clip: ""
    overlay:
      card:
        type: custom:button-card
        template: climate_arc_overlay_btn

# HVAC-mode Arc Speed Dial — 5 options: cool/heat/dry/fan_only/auto.
# Same climate.set_hvac_mode target/data as the retired climate_left_col.
climate_arc_option_btn:
  show_name: true
  show_icon: true
  show_state: false
  show_ripple: false
  variables:
    check: state
    attrib: ""
    value: ""
    service: climate.set_hvac_mode
    data_key: hvac_mode
    arc_index: 0
    arc_total: 1
    arc_side: ""
  tap_action: |
    [[[
      /* Collapse the ancestor arc dial (climate_arc_dial :host carries
         .lg-arc-host + toggled .lg-arc-expanded) before the service call —
         SelectOption per spec: apply + close. Same composedParent walk
         already proven in climate_thermostat's slider binder. */
      const composedParent = (el) => {
        if (!el) return null;
        if (el.parentElement) return el.parentElement;
        const rn = el.getRootNode && el.getRootNode();
        return (rn && rn.host) || null;
      };
      let scope = composedParent(this);
      for (let i = 0; i < 12 && scope; i++) {
        if (scope.classList && scope.classList.contains('lg-arc-host')) {
          scope.classList.remove('lg-arc-expanded');
          break;
        }
        scope = composedParent(scope);
      }
      const key = variables.data_key || 'hvac_mode';
      return {
        action: 'call-service',
        service: variables.service || 'climate.set_hvac_mode',
        target: { entity_id: (entity && entity.entity_id) || '' },
        data: { [key]: variables.value },
      };
    ]]]
  extra_styles: |
    [[[
      const a = (entity && entity.attributes) || {};
      const active = variables.check === 'attrib'
        ? a[variables.attrib] === variables.value
        : entity && entity.state === variables.value;
      const mode = variables.value;
      const color = mode === 'cool'
        ? 'var(--lg_color_climate_cool)'
        : mode === 'heat'
          ? 'var(--lg_color_climate_heat)'
          : 'var(--lg_color_text)';
      const glow = !active
        ? 'none'
        : mode === 'cool'
          ? 'var(--lg_glow_climate_cool)'
          : mode === 'heat'
            ? 'var(--lg_glow_climate_heat)'
            : 'var(--lg_glow_climate_other)';
      const iconFilter = !active
        ? 'none'
        : mode === 'cool'
          ? 'var(--lg_filter_climate_cool)'
          : mode === 'heat'
            ? 'var(--lg_filter_climate_heat)'
            : 'var(--lg_filter_climate_other)';
      /* Arc placement — sweep angle from the inherited theme tokens (read via
         getComputedStyle so the JS stays in sync with the CSS token SoT,
         no hardcoded/guessed degrees). Side-specific pair (arc_side =
         'left' for the HVAC dial, 'right' for the fan dial) tilts the fan-out
         toward whichever side of the central setpoint circle the dial sits
         on; unset/unknown arc_side falls back to the original centered pair. */
      const idx = Number(variables.arc_index) || 0;
      const total = Math.max(1, Number(variables.arc_total) || 1);
      const cs = getComputedStyle(this);
      const side = variables.arc_side === 'left' || variables.arc_side === 'right' ? variables.arc_side : '';
      const startVar = side ? `--lg_climate_arc_sweep_start_deg_${side}` : '--lg_climate_arc_sweep_start_deg';
      const endVar = side ? `--lg_climate_arc_sweep_end_deg_${side}` : '--lg_climate_arc_sweep_end_deg';
      const startDeg = parseFloat(cs.getPropertyValue(startVar)) || -30;
      const endDeg = parseFloat(cs.getPropertyValue(endVar)) || -150;
      const angleDeg = total > 1 ? startDeg + (endDeg - startDeg) * (idx / (total - 1)) : startDeg;
      const rad = angleDeg * Math.PI / 180;
      const cosV = Math.cos(rad).toFixed(4);
      const sinV = Math.sin(rad).toFixed(4);
      const delay = `calc(${idx} * var(--lg_climate_arc_stagger_step))`;
      return `
    :host {
      position: absolute;
      width: var(--lg_size_climate_arc_option_w);
      height: var(--lg_size_climate_arc_option_w);
      aspect-ratio: 1;
      display: block;
      box-sizing: border-box;
      background: transparent !important;
      box-shadow: none !important;
      overflow: visible;
      cursor: pointer;
      pointer-events: auto;
      transform:
        translate(
          calc(var(--lg_arc_t, 0) * ${cosV} * var(--lg_size_climate_arc_radius)),
          calc(var(--lg_arc_t, 0) * ${sinV} * var(--lg_size_climate_arc_radius))
        )
        scale(var(--lg_arc_t, 0));
      opacity: var(--lg_arc_t, 0);
      /* Liquid-Glass "emerge from one drop": each pill arrives frosted and
         sharpens as it settles (t: 0 -> 1). Pairs with the bounce+stagger. */
      filter: blur(calc((1 - var(--lg_arc_t, 0)) * var(--lg_climate_arc_emerge_blur)));
      transition: var(--lg_arc_transition, var(--lg_transition_climate_arc_collapse)), opacity var(--lg_transition_climate_arc_collapse);
      transition-delay: ${delay};
      z-index: 42;
    }
    @media (max-width: 48rem) {
      :host {
        width: var(--lg_size_climate_arc_option_w_phone);
        height: var(--lg_size_climate_arc_option_w_phone);
        transform:
          translate(
            calc(var(--lg_arc_t, 0) * ${cosV} * var(--lg_size_climate_arc_radius_phone)),
            calc(var(--lg_arc_t, 0) * ${sinV} * var(--lg_size_climate_arc_radius_phone))
          )
          scale(var(--lg_arc_t, 0));
      }
    }
    ha-card, #card {
      background: transparent !important;
      box-shadow: none !important;
    }
    #card {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      box-sizing: border-box;
      border-radius: 50%;
      overflow: hidden;
      border: var(--lg_stroke_climate_arc_glass) solid var(--lg_color_climate_arc_glass_stroke);
      box-shadow: ${active ? glow : 'var(--lg_shadow_climate_arc_sphere)'};
      transition: var(--lg_transition_press);
      cursor: pointer;
    }
    #card:active {
      transform: var(--lg_transform_climate_press_scale);
      opacity: var(--lg_opacity_climate_press);
      filter: var(--lg_filter_climate_press);
    }
    #container {
      display: grid !important;
      place-items: center !important;
      width: 100%;
      height: 100%;
    }
    #liquid_clip {
      /* Per-option sphere glass — #arc_backdrop removed; each atom owns its
         own frost so options read as independent balls on the viewport scrim. */
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: var(--lg_color_climate_arc_glass_fill);
      backdrop-filter: blur(var(--lg_blur_climate_arc_glass)) saturate(var(--lg_saturate_glass));
      -webkit-backdrop-filter: blur(var(--lg_blur_climate_arc_glass)) saturate(var(--lg_saturate_glass));
      pointer-events: none;
      z-index: 0;
    }
    #img-cell {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: visible !important;
    }
    #icon {
      position: relative;
      z-index: 1;
      color: ${active ? color : 'var(--lg_color_text)'} !important;
      filter: ${iconFilter};
      /* Icons stay fully visible whenever the ring is open — active/inactive
         is communicated by color + glow only, never by dimming opacity. */
      opacity: 1;
      width: var(--lg_size_climate_chip_icon);
      height: var(--lg_size_climate_chip_icon);
      --mdc-icon-size: var(--lg_size_climate_chip_icon);
    }
    #img-cell {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-self: center !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    #icon,
    #icon ha-icon,
    #icon ha-svg-icon {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      place-content: center !important;
      place-items: center !important;
      line-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #icon {
      transform: translateY(var(--lg_space_icon_optical_nudge));
    }
    #icon ha-svg-icon svg {
      display: block !important;
      margin: 0 auto !important;
    }
    #name, #label, #state { display: none !important; }
      `;
    ]]]
  custom_fields:
    liquid_clip: ""

# Swing axis toggle (vertical | horizontal). HA climate.set_swing_mode is set-not-toggle;
# UI computes next mode. Independent swing_horizontal_modes → set_swing_horizontal_mode.
# Fan/HVAC chips must NOT use this template.
climate_arc_overlay_btn:
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  show_ripple: false
  tap_action: |
    [[[
      const composedParent = (el) => {
        if (!el) return null;
        if (el.parentElement) return el.parentElement;
        const rn = el.getRootNode && el.getRootNode();
        return (rn && rn.host) || null;
      };
      let scope = composedParent(this);
      for (let i = 0; i < 12 && scope; i++) {
        if (scope.classList && scope.classList.contains('lg-arc-host')) {
          scope.classList.remove('lg-arc-expanded');
          break;
        }
        scope = composedParent(scope);
      }
      return { action: 'none' };
    ]]]
  extra_styles: |
    :host {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      /* Full-viewport Apple frost when arc is open (--lg_arc_t inherited
         from climate_arc_dial). Idle: invisible + no hit-testing. */
      background: var(--lg_color_focus_viewport_fill) !important;
      backdrop-filter: blur(var(--lg_blur_focus_viewport)) saturate(var(--lg_saturate_focus_viewport));
      -webkit-backdrop-filter: blur(var(--lg_blur_focus_viewport)) saturate(var(--lg_saturate_focus_viewport));
      opacity: var(--lg_arc_t, 0);
      transition: none !important;
      box-shadow: none !important;
      overflow: hidden;
      pointer-events: var(--lg_arc_pointer, none) !important;
      z-index: 40;
    }
    ha-card, #card, #container {
      background: transparent !important;
      box-shadow: none !important;
      width: 100%;
      height: 100%;
    }
    #icon, #name, #label, #state { display: none !important; }

# Arc Speed Dial base (ArcModeSelector): MainButton (shows current value) +
# fullscreen Overlay + N ArcOptions (climate_arc_option_btn custom_fields
# added by the two thin subclasses below). Expand/collapse = a host-class
# toggle (.lg-arc-host permanently tagged; .lg-arc-expanded toggled by tap);
# descendants read the inherited --lg_arc_t / --lg_arc_transition /
# --lg_arc_pointer custom properties — same cross-shadow-boundary technique
# already proven by --lg_climate_temp_fill_color / --slider-color.
climate_fan_arc_dial:
  template: climate_arc_dial
  icon: |
    [[[
      /* 1:1 with fan option icons (auto/low/medium/high). */
      const fm = entity && entity.attributes ? String(entity.attributes.fan_mode || '').toLowerCase() : '';
      if (fm === 'low') return 'ph:wind';
      if (fm === 'medium') return 'ph:gauge';
      if (fm === 'high') return 'ph:gauge-fill';
      return 'ph:fan';
    ]]]
  variables:
    arc_total: 4
  custom_fields:
    option_1:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:fan
        name: Авто
        variables:
          check: attrib
          attrib: fan_mode
          value: auto
          service: climate.set_fan_mode
          data_key: fan_mode
          arc_side: right
          arc_index: 0
          arc_total: 4
    option_2:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:wind
        name: Низ.
        variables:
          check: attrib
          attrib: fan_mode
          value: low
          service: climate.set_fan_mode
          data_key: fan_mode
          arc_side: right
          arc_index: 1
          arc_total: 4
    option_3:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:gauge
        name: Сер.
        variables:
          check: attrib
          attrib: fan_mode
          value: medium
          service: climate.set_fan_mode
          data_key: fan_mode
          arc_side: right
          arc_index: 2
          arc_total: 4
    option_4:
      card:
        type: custom:button-card
        template: climate_arc_option_btn
        entity: "[[[ return (entity && entity.entity_id) || '' ]]]"
        icon: ph:gauge-fill
        name: Вис.
        variables:
          check: attrib
          attrib: fan_mode
          value: high
          service: climate.set_fan_mode
          data_key: fan_mode
          arc_side: right
          arc_index: 3
          arc_total: 4

# ── Global liquid-glass game wheel (Klimat mode/fan SoT) ──────────────
