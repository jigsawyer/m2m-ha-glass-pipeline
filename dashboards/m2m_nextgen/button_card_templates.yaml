# Utility row: swing (horizontal/vertical) + power as small glass chips in
# a horizontal flex row (replaces the retired grid-dock placement). Chip
# templates + services untouched: climate_swing_axis_chip / climate_power_btn.
# Satellite band — 4 small icon-only toggles orbiting the sun (swing
# vertical/horizontal + the new Turbo/Quiet switches). climate_power_btn
# is retired from here: room on/off now lives inside the climate room
# panel as a tap-to-off button (climate_room_off_button).
climate_house_off_button:
  show_name: false
  show_icon: true
  show_state: false
  show_ripple: false
  icon: mdi:power
  variables:
    ha_entity_ids: []
  tap_action:
    action: none
  hold_action:
    action: call-service
    service: climate.turn_off
    target: |
      [[[
        const ids = variables.ha_entity_ids;
        if (Array.isArray(ids) && ids.length) return { entity_id: ids };
        return {};
      ]]]
  extra_styles: |
    :host {
      width: var(--lg_size_tab_side_btn) !important;
      max-width: var(--lg_size_tab_side_btn) !important;
      min-width: var(--lg_size_tab_side_btn) !important;
      height: var(--lg_size_tab_side_btn) !important;
      max-height: var(--lg_size_tab_side_btn) !important;
      min-height: var(--lg_size_tab_side_btn) !important;
      display: block;
      box-sizing: border-box;
      margin: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      overflow: visible !important;
      --ha-card-border-radius: var(--lg_radius_tab_side_btn) !important;
    }
    ha-card {
      width: var(--lg_size_tab_side_btn) !important;
      max-width: var(--lg_size_tab_side_btn) !important;
      min-width: var(--lg_size_tab_side_btn) !important;
      height: var(--lg_size_tab_side_btn) !important;
      max-height: var(--lg_size_tab_side_btn) !important;
      min-height: var(--lg_size_tab_side_btn) !important;
      aspect-ratio: 1 !important;
      box-sizing: border-box;
      border-radius: var(--lg_radius_tab_side_btn) !important;
      overflow: visible !important;
      margin: 0 !important;
      --ha-card-border-radius: var(--lg_radius_tab_side_btn) !important;
    }
    #container {
      display: grid !important;
      grid-template-areas: "i" !important;
      grid-template-columns: 1fr !important;
      grid-template-rows: var(--lg_size_tab_side_btn) !important;
      justify-content: center !important;
      align-items: center !important;
      place-content: center !important;
    }
    #card {
      position: relative;
      box-sizing: border-box;
      width: var(--lg_size_tab_side_btn) !important;
      max-width: var(--lg_size_tab_side_btn) !important;
      min-width: var(--lg_size_tab_side_btn) !important;
      height: var(--lg_size_tab_side_btn) !important;
      max-height: var(--lg_size_tab_side_btn) !important;
      min-height: var(--lg_size_tab_side_btn) !important;
      aspect-ratio: 1;
      border-radius: var(--lg_radius_tab_side_btn);
      border: var(--lg_stroke_glass) solid transparent;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      filter: none;
