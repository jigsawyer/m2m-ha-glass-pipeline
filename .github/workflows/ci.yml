name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/scripts/requirements.txt
          pip install -r pipeline/tests/requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Generate Artifacts
        run: python pipeline/scripts/build_engine.py

      - name: Run Tests
        run: pytest pipeline/tests/e2e/ --browser chromium

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Edge deployment
        run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
