name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/scripts/requirements.txt
          pip install -r pipeline/tests/requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Generate Artifacts
        run: python pipeline/scripts/build_engine.py

      - name: Run Tests
        run: |
          set -o pipefail
          pytest pipeline/tests/e2e/ --browser chromium 2>&1 | tee pytest-failure.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: pytest-failure.log
          if-no-files-found: ignore

  agentic-fallback:
    needs: build-and-test
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/scripts/requirements.txt

      - name: Download failure logs
        uses: actions/download-artifact@v4
        with:
          name: pytest-failure-log
          path: .

      - name: Run agentic repair orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/scripts/agentic_repair.py pytest-failure.log

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Edge deployment
        run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
