name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/scripts/requirements.txt
          pip install -r pipeline/tests/requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Generate Artifacts
        run: python pipeline/scripts/build_engine.py

      - name: Run Tests
        run: |
          pytest pipeline/tests/e2e/ 2>&1 | tee test_failures.log
          exit ${PIPESTATUS[0]}

      - name: Agentic Fallback (Auto-Repair)
        if: failure() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install anthropic
          python pipeline/scripts/agentic_repair.py test_failures.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: test_failures.log
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Edge deployment
        run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
