name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/scripts/requirements.txt
          pip install -r pipeline/tests/requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Generate Artifacts
        run: python pipeline/scripts/build_engine.py

      - name: Run Tests
        run: |
          pytest pipeline/tests/e2e/ 2>&1 | tee test_failures.log
          exit ${PIPESTATUS[0]}

      - name: Agentic Fallback (Auto-Repair)
        if: failure() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install anthropic
          python pipeline/scripts/agentic_repair.py test_failures.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: test_failures.log
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r pipeline/scripts/requirements.txt

      - name: Generate Artifacts
        run: |
          set -euo pipefail
          python pipeline/scripts/build_engine.py

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH context
        env:
          HAOS_SSH_KEY: ${{ secrets.HAOS_SSH_KEY }}
          HAOS_HOST: ${{ secrets.HAOS_HOST }}
          HAOS_USER: ${{ secrets.HAOS_USER }}
          HAOS_PORT: ${{ secrets.HAOS_PORT }}
        run: |
          set -euo pipefail
          : "${HAOS_SSH_KEY:?HAOS_SSH_KEY secret is required}"
          : "${HAOS_HOST:?HAOS_HOST secret is required}"
          : "${HAOS_USER:?HAOS_USER secret is required}"
          : "${HAOS_PORT:?HAOS_PORT secret is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HAOS_SSH_KEY" > ~/.ssh/haos_key
          chmod 600 ~/.ssh/haos_key
          cat > ~/.ssh/config <<EOF
          Host haos-target
            HostName ${HAOS_HOST}
            User ${HAOS_USER}
            Port ${HAOS_PORT}
            IdentityFile ~/.ssh/haos_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Rsync deploy to Edge
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude='.storage/' \
            --exclude='.cloud/' \
            --exclude='home-assistant_v2.db*' \
            --exclude='home-assistant.log*' \
            --exclude='custom_components/' \
            --exclude='blueprints/' \
            --exclude='tts/' \
            --exclude='backups/' \
            --exclude='secrets.yaml' \
            --exclude='configuration.yaml' \
            -e ssh build/staging/ haos-target:/config/

      - name: Reload Core configuration
        run: |
          set -euo pipefail
          ssh haos-target 'ha core restart'
