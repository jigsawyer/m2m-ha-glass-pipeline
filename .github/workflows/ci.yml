name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r pipeline/scripts/requirements.txt
          pip install -r pipeline/tests/requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Generate Artifacts
        run: python pipeline/scripts/build_engine.py

      - name: Run Tests
        run: |
          pytest pipeline/tests/e2e/ 2>&1 | tee test_failures.log
          exit ${PIPESTATUS[0]}

      - name: Agentic Fallback (Auto-Repair)
        if: failure() && github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install anthropic
          python pipeline/scripts/agentic_repair.py test_failures.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-log
          path: test_failures.log
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0054: classify Change Set from git source paths (not build/staging).
      - name: Detect Change Set
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'environments/**/ha_operator/**'
            frontend:
              - 'design_system/**'
              - 'environments/**/dashboards/**'
              - 'environments/**/global_hardware_map.json'
              - 'environments/**/global_spatial_topology.json'
              - 'environments/**/config.json'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r pipeline/scripts/requirements.txt

      - name: Generate Artifacts
        run: |
          set -euo pipefail
          python pipeline/scripts/build_engine.py

      - name: Publish edge-state artifact branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # ADR-0057: Lovelace SoT is origin/edge-state → /config/edge-state.
          bash pipeline/scripts/publish_edge.sh

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH context
        env:
          HAOS_SSH_KEY: ${{ secrets.HAOS_SSH_KEY }}
          HAOS_HOST: ${{ secrets.HAOS_HOST }}
          HAOS_USER: ${{ secrets.HAOS_USER }}
          HAOS_PORT: ${{ secrets.HAOS_PORT }}
        run: |
          set -euo pipefail
          : "${HAOS_SSH_KEY:?HAOS_SSH_KEY secret is required}"
          : "${HAOS_HOST:?HAOS_HOST secret is required}"
          : "${HAOS_USER:?HAOS_USER secret is required}"
          : "${HAOS_PORT:?HAOS_PORT secret is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HAOS_SSH_KEY" > ~/.ssh/haos_key
          chmod 600 ~/.ssh/haos_key
          cat > ~/.ssh/config <<EOF
          Host haos-target
            HostName ${HAOS_HOST}
            User ${HAOS_USER}
            Port ${HAOS_PORT}
            IdentityFile ~/.ssh/haos_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Rsync deploy to Edge
        run: |
          set -euo pipefail
          STAGING_DIR="build/staging"
          if [ ! -d "${STAGING_DIR}" ]; then
            echo "FATAL: ${STAGING_DIR} missing — run build_engine before deploy."
            exit 1
          fi

          # Whitelist Execution Boundary (ADR-0051 / ADR-0056):
          # never rsync --delete at /config/. Scoped --delete only inside
          # explicitly allowed artifact directories.
          # `www/liquid_glass` only — never bare www/ (would wipe HACS community).
          # `views` is required for Lovelace !include paths from root dashboard.yaml.
          ALLOWED_DIRS=(themes dashboards packages views)

          if [ -d "${STAGING_DIR}/www/liquid_glass" ]; then
            ssh haos-target "mkdir -p /config/www/liquid_glass"
            rsync -avz --delete -e ssh \
              "${STAGING_DIR}/www/liquid_glass/" \
              "haos-target:/config/www/liquid_glass/"
          fi

          for dir in "${ALLOWED_DIRS[@]}"; do
            src="${STAGING_DIR}/${dir}"
            if [ -d "${src}" ]; then
              ssh haos-target "mkdir -p /config/${dir}"
              rsync -avz --delete -e ssh "${src}/" "haos-target:/config/${dir}/"
            fi
          done

          # Refuse accidental publish of sandbox community bundles to Edge.
          if [ -d "${STAGING_DIR}/www/community" ]; then
            echo "WARN: staging www/community present (sandbox residue) — skipped; Edge HACS is SoT (ADR-0056)."
          fi

          # Root YAML only — additive sync, never --delete (preserves HAOS core files).
          shopt -s nullglob
          root_yamls=("${STAGING_DIR}"/*.yaml)
          if [ "${#root_yamls[@]}" -gt 0 ]; then
            rsync -avz -e ssh "${root_yamls[@]}" haos-target:/config/
          fi

      - name: Sync /config/edge-state from origin
        env:
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          set -euo pipefail
          # ADR-0057 / ADR-0058: reset Lovelace SoT, then fail-closed UI reload.
          ssh haos-target "HA_TOKEN=$(printf '%q' "${HA_TOKEN:-}") bash -s" <<'EOS'
          set -euo pipefail
          STATE_DIR="/config/edge-state"
          HA_URL="${HA_URL:-http://127.0.0.1:8123}"
          if [ ! -d "${STATE_DIR}/.git" ]; then
            echo "FATAL: ${STATE_DIR} is not a git checkout — cannot reset to origin/edge-state."
            exit 1
          fi
          export GIT_SSH_COMMAND="${GIT_SSH_COMMAND:-ssh -i /config/.ssh/id_ed25519 -o StrictHostKeyChecking=no}"
          cd "${STATE_DIR}"
          git fetch origin edge-state
          git reset --hard origin/edge-state
          git clean -fd
          mkdir -p /config/www/liquid_glass
          if [ -d "${STATE_DIR}/www/liquid_glass" ]; then
            # Replace wallpaper tree only — never touch www/community (ADR-0056).
            find /config/www/liquid_glass -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "${STATE_DIR}/www/liquid_glass/." /config/www/liquid_glass/
          fi
          HEAD_SHORT="$(git rev-parse --short HEAD)"
          echo "edge-state HEAD=${HEAD_SHORT}"
          if ! grep -q 'rBezelInner' "${STATE_DIR}/button_card_templates.yaml"; then
            echo "FATAL: edge-state button_card_templates.yaml missing Watch Bezel marker rBezelInner"
            exit 1
          fi

          TOKEN="${HA_TOKEN:-}"
          if [ -z "${TOKEN}" ] && [ -f /config/deploy/ha_token ]; then
            TOKEN="$(tr -d '[:space:]' </config/deploy/ha_token)"
          fi
          if [ -z "${TOKEN}" ]; then
            echo "FATAL: HA_TOKEN unavailable for Lovelace reload (set GitHub secret HA_TOKEN or Edge /config/deploy/ha_token). Soft-success is forbidden (ADR-0058)."
            exit 1
          fi

          TH="$(curl -X POST -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${HA_URL}/api/services/frontend/reload_themes" || echo fail)"
          LV="$(curl -X POST -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${HA_URL}/api/events/lovelace_updated" \
            -d '{}' || echo fail)"
          echo "reload_themes=${TH} lovelace_updated=${LV}"
          if [ "${TH}" != "200" ] || [ "${LV}" != "200" ]; then
            echo "FATAL: UI reload failed after edge-state sync (ADR-0058)."
            exit 1
          fi
          EOS

      # ADR-0054: packages (backend) require HAOS core restart; frontend-only skips.
      - name: Reload Core configuration
        if: steps.filter.outputs.backend == 'true'
        run: |
          set -euo pipefail
          echo "Backend Change Set detected — executing ha core restart."
          ssh haos-target 'ha core restart'

      - name: Skip Core restart (non-backend Change Set)
        if: steps.filter.outputs.backend != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            echo "Frontend-only Change Set — edge-state synced; skipping ha core restart (ADR-0054/0057)."
          else
            echo "No backend Change Set — skipping ha core restart (ADR-0054)."
          fi
          exit 0
